<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 226"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><text x="20" y="40" font-size="15">HOOC(CH₂)₄COOH</text><text x="270" y="40" font-size="15">H₂N(CH₂)₆NH₂</text><text x="20" y="62" class="tm" font-size="12">dicarboxylic acid</text><text x="270" y="62" class="tm" font-size="12">diamine</text><text x="236" y="44" text-anchor="middle" font-size="16">+</text><line x1="240" y1="80" x2="240" y2="116" class="ln" marker-end="url(#ah)"/><text x="250" y="102" class="ta" font-size="12">− H₂O for every link</text><text x="240" y="150" text-anchor="middle" font-size="16">–[ CO(CH₂)₄CO–NH(CH₂)₆NH ]ₙ–</text><rect x="222" y="130" width="54" height="30" rx="4" class="lm"/><text x="249" y="180" class="ta" text-anchor="middle" font-size="13">amide link</text><text x="240" y="214" class="tm" text-anchor="middle" font-size="12">e.g. hexanedioic acid + hexane-1,6-diamine → nylon-6,6</text></svg>
