<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><rect x="20" y="70" width="440" height="90" rx="10" class="bx"/><text x="65" y="56" text-anchor="middle" font-size="13">ionisation</text><text x="65" y="184" class="tm" text-anchor="middle" font-size="11">M + H⁺ → MH⁺</text><text x="155" y="56" text-anchor="middle" font-size="13">acceleration</text><text x="155" y="184" class="tm" text-anchor="middle" font-size="11">same KE</text><text x="290" y="56" text-anchor="middle" font-size="13">ion drift</text><text x="290" y="184" class="tm" text-anchor="middle" font-size="11">light ions faster</text><text x="420" y="56" text-anchor="middle" font-size="13">detection</text><text x="420" y="184" class="tm" text-anchor="middle" font-size="11">current ∝ abundance</text><line x1="110" y1="70" x2="110" y2="160" class="lm"/><line x1="200" y1="70" x2="200" y2="160" class="lm"/><line x1="380" y1="70" x2="380" y2="160" class="lm"/><line x1="140" y1="80" x2="140" y2="150" class="ln thick"/><line x1="170" y1="80" x2="170" y2="150" class="ln thick"/><text x="140" y="96" text-anchor="middle" font-size="13">+</text><text x="170" y="96" text-anchor="middle" font-size="13">−</text><rect x="440" y="82" width="14" height="66" rx="3" class="at"/><circle cx="270" cy="130" r="9" class="gt"/><line x1="286" y1="130" x2="320" y2="130" class="gl" marker-end="url(#ag)"/><text x="270" y="150" class="tg" text-anchor="middle" font-size="11">heavy</text><circle cx="340" cy="100" r="5" class="af"/><line x1="352" y1="100" x2="432" y2="100" class="ac" marker-end="url(#aa)"/><text x="340" y="90" class="ta" text-anchor="middle" font-size="11">light</text><circle cx="55" cy="115" r="6" class="af"/><circle cx="72" cy="120" r="8" class="gt"/><line x1="210" y1="115" x2="250" y2="115" class="ln" marker-end="url(#ah)"/><text x="240" y="214" class="tm" text-anchor="middle" font-size="12">½mv² = KE, so smaller m → larger v → shorter time t = d ÷ v</text></svg>
