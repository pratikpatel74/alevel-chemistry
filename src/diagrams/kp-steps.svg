<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cf"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="af"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="gf"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mf"/></marker></defs><rect x="30" y="14" width="420" height="56" rx="6" class="bx"/><text x="46" y="36" font-size="14">equilibrium moles</text><text x="46" y="56" class="tm" font-size="12">N₂O₄ 0.60, NO₂ 0.80  total 1.40 mol</text><line x1="240" y1="72" x2="240" y2="86" class="ln" marker-end="url(#ah)"/><rect x="30" y="88" width="420" height="56" rx="6" class="bx"/><text x="46" y="110" font-size="14">mole fractions</text><text x="46" y="130" class="tm" font-size="12">N₂O₄ 0.429, NO₂ 0.571  (add up to 1)</text><line x1="240" y1="146" x2="240" y2="160" class="ln" marker-end="url(#ah)"/><rect x="30" y="162" width="420" height="56" rx="6" class="bx"/><text x="46" y="184" font-size="14">partial pressures</text><text x="46" y="204" class="tm" font-size="12">N₂O₄ 42.9 kPa, NO₂ 57.1 kPa  (× total 100 kPa)</text><line x1="240" y1="220" x2="240" y2="234" class="ln" marker-end="url(#ah)"/><rect x="30" y="236" width="420" height="56" rx="6" class="at"/><text x="46" y="258" class="ta" font-size="14">Kp = (pNO₂)² ÷ pN₂O₄</text><text x="46" y="278" class="tm" font-size="12">= 57.1² ÷ 42.9 = 76 kPa</text></svg>
