", "A brick-red precipitate", "No reaction"], "a": 1, "e": "The reaction is vigorous and HCl gas is released."}, {"q": "What are the products of acid hydrolysis of methyl ethanoate?", "o": ["Sodium ethanoate and methanol", "Ethanol and methanoic acid", "Ethanoic acid and methanol", "Methanoic acid and ethanol"], "a": 2, "e": "Acid hydrolysis reverses esterification: ethanoic acid + methanol."}, {"q": "Why is the esterification reaction heated under reflux?", "o": ["To remove the ester", "To make it irreversible", "To cool it", "To heat for a long time without losing volatile reactants and products"], "a": 3, "e": "Esterification is slow and the compounds are volatile."}, {"q": "What is the formula of ethyl ethanoate?", "o": ["CH₃COOCH₂CH₃", "CH₃CH₂COOCH₃", "HCOOCH₂CH₃", "CH₃COOCH₃"], "a": 0, "e": "Ethanoate (CH₃COO–) attached to ethyl (–CH₂CH₃)."}]}, {"id": "3.3.10", "order": 28, "year": 2, "section": "3.3", "spec": "3.3.10", "title": "Aromatic chemistry", "desc": "Bonding and stability of benzene, enthalpy of hydrogenation evidence, electrophilic substitution: nitration and Friedel–Crafts acylation.", "practicals": [10], "summary": [{"h": "Structure of benzene", "p": ["Benzene, C₆H₆, is a **planar** ring of six carbons. Each carbon forms **three σ bonds** (two C–C, one C–H), and has one **p orbital** electron.", "The p orbitals overlap above and below the ring, forming a **delocalised ring of π electrons**.", "All C–C bonds are the **same length**, between a single and double bond."]}, {"h": "Stability of benzene", "p": ["The **enthalpy of hydrogenation** of cyclohexene is −120 kJ mol⁻¹. For a theoretical 'cyclohexa-1,3,5-triene' with three C=C, it would be −360 kJ mol⁻¹.", "Benzene's actual value is about **−208 kJ mol⁻¹**, so benzene is about **152 kJ mol⁻¹ more stable**, due to **delocalisation**.", "Because of this stability, benzene undergoes **substitution** (keeping the delocalised ring), not addition."]}, {"h": "Electrophilic substitution", "p": ["The delocalised electrons attract **electrophiles**.", "Mechanism: electrons from the ring attack the electrophile, forming an intermediate in which the delocalisation is **partly broken** (shown as a horseshoe with +). Then **H⁺ is lost** and the delocalised ring is restored."]}, {"h": "Nitration", "p": ["Reagents: **concentrated HNO₃** and **concentrated H₂SO₄** at about **50 °C**.", "The electrophile **NO₂⁺** (nitronium ion) is formed: `HNO₃ + 2H₂SO₄ → NO₂⁺ + H₃O⁺ + 2HSO₄⁻`.", "Product: **nitrobenzene**. Above 50 °C, multiple substitution happens.", "Nitration is important for making **explosives** (e.g. TNT) and for making **aromatic amines** (by reducing nitro compounds), used to make dyes."]}, {"h": "Friedel–Crafts acylation", "p": ["Reagents: an **acyl chloride** with an **AlCl₃** catalyst, heated under reflux.", "The electrophile **RCO⁺** (acylium ion) forms: `RCOCl + AlCl₃ → RCO⁺ + AlCl₄⁻`.", "Product: an **aromatic ketone**, e.g. phenylethanone from ethanoyl chloride.", "The catalyst is regenerated: `H⁺ + AlCl₄⁻ → AlCl₃ + HCl`."]}], "pitfalls": ["Benzene does **substitution**, not addition, to keep its delocalised stability.", "In the intermediate, draw the **horseshoe** of partial delocalisation, with the + inside, and the H and electrophile on the same carbon.", "Use ΔH of hydrogenation data to show stability: actual is **less exothermic** than predicted."], "questions": [{"q": "How are the electrons arranged in benzene?", "o": ["Three fixed C=C double bonds", "A delocalised ring of π electrons above and below the plane of the ring", "Six C–C single bonds only", "Ionic bonds"], "a": 1, "e": "Overlapping p orbitals create a ring of delocalised electrons."}, {"q": "What evidence shows that all C–C bonds in benzene are equal?", "o": ["All C–C bond lengths are the same, between single and double bond lengths", "Benzene decolourises bromine water", "Benzene is a liquid", "Benzene has six hydrogens"], "a": 0, "e": "X-ray diffraction shows one C–C bond length of 0.139 nm."}, {"q": "What is the enthalpy of hydrogenation of benzene compared with the theoretical value for cyclohexa-1,3,5-triene?", "o": ["More exothermic", "The same", "Less exothermic, showing benzene is more stable", "Endothermic"], "a": 2, "e": "About −208 vs −360 kJ mol⁻¹, so benzene is about 152 kJ mol⁻¹ more stable."}, {"q": "Why does benzene undergo substitution rather than addition?", "o": ["It has no C=C", "It is unreactive", "Addition is too fast", "Substitution keeps the stable delocalised ring of electrons"], "a": 3, "e": "Addition would destroy the delocalisation and lose its stability."}, {"q": "What is the electrophile in the nitration of benzene?", "o": ["NO₂⁺", "NO₃⁻", "HNO₃", "H⁺"], "a": 0, "e": "The nitronium ion is generated from the acids."}, {"q": "What reagents and conditions are used for nitration of benzene?", "o": ["Dilute HNO₃ at room temperature", "Concentrated HNO₃ and concentrated H₂SO₄ at about 50 °C", "AlCl₃ and an acyl chloride", "UV light"], "a": 1, "e": "Above 50 °C, more than one nitro group may substitute."}, {"q": "What is the role of sulfuric acid in nitration?", "o": ["Solvent only", "Nucleophile", "It reacts with nitric acid to generate NO₂⁺ (and is regenerated)", "It oxidises benzene"], "a": 2, "e": "HNO₃ + 2H₂SO₄ → NO₂⁺ + H₃O⁺ + 2HSO₄⁻."}, {"q": "Why is nitration of aromatic compounds important?", "o": ["To make soaps", "To make fuels", "To make plastics only", "To make explosives and aromatic amines for dyes"], "a": 3, "e": "Nitro compounds like TNT are explosives; reducing nitrobenzene gives phenylamine for dyes."}, {"q": "What catalyst is used in Friedel–Crafts acylation?", "o": ["AlCl₃", "H₂SO₄", "Ni", "Pt"], "a": 0, "e": "AlCl₃ helps generate the acylium ion and is regenerated."}, {"q": "What is the electrophile in Friedel–Crafts acylation with ethanoyl chloride?", "o": ["Cl⁺", "CH₃CO⁺", "AlCl₄⁻", "CH₃⁺"], "a": 1, "e": "CH₃COCl + AlCl₃ → CH₃CO⁺ + AlCl₄⁻."}, {"q": "What is the product of benzene with ethanoyl chloride and AlCl₃?", "o": ["Methylbenzene", "Benzoic acid", "Phenylethanone", "Chlorobenzene"], "a": 2, "e": "An aromatic ketone, C₆H₅COCH₃, forms."}, {"q": "How is AlCl₃ regenerated in Friedel–Crafts acylation?", "o": ["It isn't regenerated", "By reaction with water", "By heating", "H⁺ + AlCl₄⁻ → AlCl₃ + HCl"], "a": 3, "e": "The H⁺ lost from the ring reacts with AlCl₄⁻."}, {"q": "In the electrophilic substitution intermediate, what happens to the delocalised ring?", "o": ["It is partly broken, shown as a horseshoe with a positive charge", "It stays intact", "It becomes two double bonds", "It is completely destroyed"], "a": 0, "e": "Two electrons are used to bond to the electrophile, so delocalisation is partly lost."}, {"q": "What is the final step of electrophilic substitution?", "o": ["The electrophile leaves", "H⁺ is lost from the ring, restoring the delocalised system", "An OH⁻ adds", "The ring breaks"], "a": 1, "e": "Losing H⁺ allows the electrons to return to the ring."}, {"q": "By how much is benzene more stable than expected for a triene?", "o": ["About 360 kJ mol⁻¹", "About 120 kJ mol⁻¹", "About 152 kJ mol⁻¹", "About 208 kJ mol⁻¹"], "a": 2, "e": "−360 − (−208) = 152 kJ mol⁻¹, the delocalisation energy."}, {"q": "What shape is a benzene molecule?", "o": ["Tetrahedral", "Chair-shaped", "Linear", "Planar hexagon"], "a": 3, "e": "All atoms lie in one plane with 120° angles."}, {"q": "Why doesn't benzene readily decolourise bromine water?", "o": ["Its delocalised electrons are stable and spread out, so it doesn't undergo addition easily", "It has no electrons", "Bromine isn't an electrophile", "Benzene is ionic"], "a": 0, "e": "The electron density is lower than in a localised C=C, so bromine isn't polarised enough without a catalyst."}, {"q": "Why is the temperature kept at about 50 °C in nitration?", "o": ["To speed it up", "To avoid multiple substitution", "To stop sulfuric acid boiling", "To form NO₂⁺"], "a": 1, "e": "Higher temperatures lead to dinitro and trinitro products."}, {"q": "What is the formula of benzene?", "o": ["C₆H₁₂", "C₆H₁₀", "C₆H₆", "C₆H₁₄"], "a": 2, "e": "Benzene is C₆H₆."}, {"q": "What type of mechanism do benzene's reactions follow?", "o": ["Nucleophilic addition", "Electrophilic addition", "Free-radical substitution", "Electrophilic substitution"], "a": 3, "e": "Electrophiles attack the ring, and a hydrogen is substituted."}, {"q": "What happens to the H atom on the carbon attacked during electrophilic substitution?", "o": ["It is lost as H⁺", "It stays", "It moves to oxygen", "It becomes H⁻"], "a": 0, "e": "The C–H electrons return to the ring as H⁺ leaves."}, {"q": "How is phenylamine made from nitrobenzene?", "o": ["Oxidation with KMnO₄", "Reduction with tin and concentrated HCl, then NaOH", "Reaction with NH₃", "Friedel–Crafts acylation"], "a": 1, "e": "Nitro groups are reduced to amine groups."}]}, {"id": "3.3.11", "order": 29, "year": 2, "section": "3.3", "spec": "3.3.11", "title": "Amines", "desc": "Primary, secondary and tertiary amines, preparing amines, base strength, nucleophilic reactions and quaternary ammonium salts.", "practicals": [], "summary": [{"h": "Classification", "p": ["**Primary** amines: one alkyl or aryl group on N (RNH₂). **Secondary**: two (R₂NH). **Tertiary**: three (R₃N). **Quaternary ammonium ions**: four (R₄N⁺).", "Quaternary ammonium salts with long chains are used as **cationic surfactants** in fabric softeners and hair conditioners."]}, {"h": "Preparation", "p": ["**Aliphatic amines**: halogenoalkane + **excess ammonia** (nucleophilic substitution). Excess NH₃ limits further substitution.", "Or reduce a **nitrile** with LiAlH₄, or H₂ with a nickel catalyst: `RCN + 4[H] → RCH₂NH₂`. This gives only the primary amine.", "**Aromatic amines**: reduce nitro compounds with **tin and concentrated HCl**, then NaOH: `C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + 2H₂O`."]}, {"h": "Base properties", "p": ["Amines are **bases**: the **lone pair** on N accepts a proton.", "Base strength depends on how available the lone pair is.", "**Primary aliphatic amines** are **stronger** bases than ammonia: alkyl groups **push electron density** onto N (positive inductive effect).", "**Aromatic amines** (e.g. phenylamine) are **weaker** than ammonia: the N lone pair is **delocalised into the benzene ring**, so less available.", "Order: primary aliphatic amine > ammonia > phenylamine."]}, {"h": "Nucleophilic properties", "p": ["Amines are **nucleophiles** (N lone pair).", "Primary amines react with halogenoalkanes to form secondary amines, then tertiary amines, then quaternary ammonium salts.", "Amines react with **acyl chlorides** and **acid anhydrides** by nucleophilic addition–elimination to form **N-substituted amides**."]}], "pitfalls": ["Explain base strength by **availability of the N lone pair**: inductive effect (stronger) vs delocalisation into the ring (weaker).", "Nitrile reduction adds a **CH₂**: ethanenitrile gives **ethylamine**.", "Further substitution happens because the amine product is itself a nucleophile."], "questions": [{"q": "What is a primary amine?", "o": ["N bonded to two carbon groups", "N bonded to one carbon group and two hydrogens", "N with four carbon groups", "An amide"], "a": 1, "e": "Primary amines have the form RNH₂."}, {"q": "What is a quaternary ammonium ion?", "o": ["N bonded to four carbon groups, with a positive charge", "NH₄⁺ only", "A neutral amine", "N with a lone pair"], "a": 0, "e": "R₄N⁺ has no lone pair, so it can't act as a base or nucleophile."}, {"q": "What are quaternary ammonium salts used for?", "o": ["Explosives", "Fuels", "Cationic surfactants in fabric softeners and hair conditioners", "Antacids"], "a": 2, "e": "The positive head sticks to negatively charged surfaces, and the long chain gives softness."}, {"q": "Why is excess ammonia used to make a primary amine from a halogenoalkane?", "o": ["It is a catalyst", "It increases temperature", "It removes HCl", "To reduce further substitution forming secondary and tertiary amines"], "a": 3, "e": "Excess NH₃ makes the halogenoalkane more likely to meet NH₃ than the amine product."}, {"q": "How can a primary amine be made without a mixture of products?", "o": ["Reduce a nitrile with LiAlH₄ or H₂ with a nickel catalyst", "React a halogenoalkane with limited NH₃", "Oxidise an alcohol", "Hydrolyse an ester"], "a": 0, "e": "Nitrile reduction only gives the primary amine."}, {"q": "What is formed when ethanenitrile is reduced?", "o": ["Methylamine", "Ethylamine", "Ethanamide", "Ethanol"], "a": 1, "e": "CH₃CN + 4[H] → CH₃CH₂NH₂."}, {"q": "How is phenylamine made from nitrobenzene?", "o": ["Heat with NaOH", "React with NH₃", "Reduce with tin and concentrated HCl, then add NaOH", "Oxidise with KMnO₄"], "a": 2, "e": "Sn/HCl reduces the nitro group; NaOH frees the amine from its salt."}, {"q": "Why are amines bases?", "o": ["They release OH⁻ directly", "They donate H⁺", "They contain oxygen", "The lone pair on nitrogen can accept a proton"], "a": 3, "e": "RNH₂ + H⁺ → RNH₃⁺."}, {"q": "Why is ethylamine a stronger base than ammonia?", "o": ["The ethyl group pushes electron density onto N, making the lone pair more available", "Ethylamine is larger", "Ammonia has no lone pair", "Ethylamine is more soluble"], "a": 0, "e": "The positive inductive effect increases electron density on nitrogen."}, {"q": "Why is phenylamine a weaker base than ammonia?", "o": ["It has no lone pair", "The N lone pair is delocalised into the benzene ring, so it is less available", "It is a gas", "Benzene pushes electrons onto N"], "a": 1, "e": "Delocalisation reduces electron density on N."}, {"q": "What is the order of base strength?", "o": ["Phenylamine > ammonia > ethylamine", "Ammonia > ethylamine > phenylamine", "Ethylamine > ammonia > phenylamine", "All are equal"], "a": 2, "e": "Inductive effect strengthens; delocalisation weakens."}, {"q": "What is formed when ethylamine reacts with hydrochloric acid?", "o": ["Ethanol", "Ethanamide", "Chloroethane", "Ethylammonium chloride"], "a": 3, "e": "CH₃CH₂NH₂ + HCl → CH₃CH₂NH₃⁺Cl⁻."}, {"q": "Why do amines act as nucleophiles?", "o": ["They have a lone pair on nitrogen", "They are positively charged", "They have a C=O", "They are acids"], "a": 0, "e": "The lone pair can attack δ+ carbons."}, {"q": "What is formed when ethylamine reacts with ethanoyl chloride?", "o": ["Ethyl ethanoate", "N-ethylethanamide", "Ethanamide", "Diethylamine"], "a": 1, "e": "Nucleophilic addition–elimination gives an N-substituted amide."}, {"q": "Why does a halogenoalkane with ammonia give a mixture of amines?", "o": ["Ammonia decomposes", "The halogenoalkane is unstable", "The amine products are also nucleophiles and react further with the halogenoalkane", "Water is present"], "a": 2, "e": "Primary → secondary → tertiary → quaternary."}, {"q": "What is (CH₃)₂NH?", "o": ["Primary amine", "Tertiary amine", "Quaternary ammonium ion", "Secondary amine"], "a": 3, "e": "N is bonded to two carbon groups."}, {"q": "Why can't a quaternary ammonium ion act as a base?", "o": ["It has no lone pair on nitrogen", "It is negatively charged", "It is too large", "It contains oxygen"], "a": 0, "e": "All four N bonds are used, so there is no lone pair to accept H⁺."}, {"q": "Which amine is tertiary?", "o": ["CH₃NH₂", "(CH₃)₃N", "(CH₃)₂NH", "(CH₃)₄N⁺"], "a": 1, "e": "Trimethylamine has three carbon groups on N."}, {"q": "Write the equation for reducing nitrobenzene to phenylamine.", "o": ["C₆H₅NO₂ + 2[H] → C₆H₅NH₂ + O₂", "C₆H₅NO₂ + H₂O → C₆H₅NH₂", "C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + 2H₂O", "C₆H₅NO₂ → C₆H₅NH₂ + NO"], "a": 2, "e": "Six [H] remove both oxygens as water and add two H to N."}, {"q": "Phenylamine is used to make which products?", "o": ["Fuels", "Soaps", "Explosives only", "Dyes"], "a": 3, "e": "Aromatic amines are important in making azo dyes."}, {"q": "Which reagent reduces a nitrile to an amine?", "o": ["LiAlH₄", "K₂Cr₂O₇", "NaOH", "H₂SO₄"], "a": 0, "e": "LiAlH₄ (or H₂ with Ni) supplies hydrogen to reduce C≡N to CH₂NH₂."}, {"q": "What is formed when excess chloromethane reacts with ammonia?", "o": ["Methylamine only", "Tetramethylammonium chloride", "Methanol", "Methanamide"], "a": 1, "e": "With excess halogenoalkane, substitution continues all the way to the quaternary salt."}]}, {"id": "3.3.12", "order": 30, "year": 2, "section": "3.3", "spec": "3.3.12", "title": "Polymers", "desc": "Condensation polymers (polyesters and polyamides), their repeating units, hydrogen bonding in polyamides, biodegradability and disposal of polymers.", "practicals": [], "summary": [{"h": "Condensation polymers", "p": ["**Condensation polymers** form when monomers join with the **loss of a small molecule**, usually **water** (or HCl from acyl chlorides).", "Each monomer needs **two functional groups**.", "**Polyesters**: a **dicarboxylic acid** + a **diol**. E.g. **Terylene** (PET) from benzene-1,4-dicarboxylic acid and ethane-1,2-diol. Ester links: –COO–.", "**Polyamides**: a **dicarboxylic acid** (or diacyl chloride) + a **diamine**. E.g. **nylon-6,6** from hexanedioic acid and hexane-1,6-diamine; **Kevlar** from benzene-1,4-dicarboxylic acid and benzene-1,4-diamine. Amide (peptide) links: –CONH–.", "Draw the **repeating unit** with an ester or amide link and extension bonds."]}, {"h": "Intermolecular forces", "p": ["Polyamides form **hydrogen bonds** between N–H and C=O groups on neighbouring chains, making them strong.", "Kevlar's straight chains and many hydrogen bonds make it very strong (used in body armour).", "Polyesters have **permanent dipole–dipole** forces between chains."]}, {"h": "Biodegradability and disposal", "p": ["**Polyesters and polyamides** can be broken down by **hydrolysis** (acid or base) because the ester and amide links are **polar**, so they are **biodegradable**.", "**Polyalkenes** (addition polymers) are **chemically inert**: their non-polar C–C and C–H bonds aren't attacked, so they are **non-biodegradable**.", "Disposal options: **landfill** (takes up space, slow breakdown), **incineration** (releases energy, but produces CO₂ and possibly toxic gases), and **recycling** (saves resources, but needs sorting and is costly)."]}], "pitfalls": ["Condensation polymers lose a **small molecule** for each link formed. Addition polymers don't.", "Show the amide link as –CONH– and the ester link as –COO– in repeat units.", "Polyalkenes are non-biodegradable because they have **non-polar** bonds."], "questions": [{"q": "What is a condensation polymer?", "o": ["A polymer formed by opening C=C bonds", "A polymer formed when monomers join with the loss of a small molecule such as water", "A polymer of alkenes", "A natural polymer only"], "a": 1, "e": "Each new link releases a small molecule."}, {"q": "Which monomers form a polyester?", "o": ["A dicarboxylic acid and a diol", "A diamine and a diol", "Two alkenes", "Amino acids only"], "a": 0, "e": "Ester links form between COOH and OH groups."}, {"q": "Which monomers form a polyamide?", "o": ["A diol and a dicarboxylic acid", "Two alkenes", "A dicarboxylic acid and a diamine", "A diol and an alkene"], "a": 2, "e": "Amide links form between COOH and NH₂ groups."}, {"q": "What is the linking group in a polyamide?", "o": ["–COO–", "–O–", "–C=C–", "–CONH–"], "a": 3, "e": "The amide (peptide) link."}, {"q": "Which polymer is made from hexanedioic acid and hexane-1,6-diamine?", "o": ["Nylon-6,6", "Terylene", "Kevlar", "Poly(ethene)"], "a": 0, "e": "Each monomer has 6 carbons, hence nylon-6,6."}, {"q": "Which polymer is made from benzene-1,4-dicarboxylic acid and ethane-1,2-diol?", "o": ["Nylon-6,6", "Terylene (PET)", "Kevlar", "PVC"], "a": 1, "e": "This is a polyester used in fibres and bottles."}, {"q": "Kevlar is made from benzene-1,4-dicarboxylic acid and which other monomer?", "o": ["Ethane-1,2-diol", "Hexane-1,6-diamine", "Benzene-1,4-diamine", "Ethene"], "a": 2, "e": "Kevlar is an aromatic polyamide."}, {"q": "Why are polyamides such as Kevlar very strong?", "o": ["They have C=C bonds", "They are ionic", "They are short", "Hydrogen bonds form between N–H and C=O groups on neighbouring chains"], "a": 3, "e": "Many hydrogen bonds between straight chains give great strength."}, {"q": "Why are polyesters and polyamides biodegradable?", "o": ["Their polar ester and amide links can be hydrolysed", "They are made from alkenes", "They contain C=C", "They are non-polar"], "a": 0, "e": "Water, acids, bases and enzymes can break these links."}, {"q": "Why are polyalkenes non-biodegradable?", "o": ["They contain amide bonds", "They have non-polar C–C and C–H bonds that aren't easily attacked", "They are too small", "They dissolve in water"], "a": 1, "e": "There are no polar bonds for nucleophiles or enzymes to attack."}, {"q": "What small molecule is lost when a diacyl chloride reacts with a diamine to form a polyamide?", "o": ["Water", "Ammonia", "HCl", "CO₂"], "a": 2, "e": "Acyl chlorides release HCl in addition–elimination reactions."}, {"q": "What is a disadvantage of incinerating polymers?", "o": ["It takes up land", "It is expensive to sort", "It saves crude oil", "It releases CO₂ and possibly toxic gases"], "a": 3, "e": "Burning releases greenhouse gases and, for PVC, HCl."}, {"q": "What is an advantage of incinerating polymers?", "o": ["The energy released can be used to generate electricity", "No CO₂ is produced", "It is cheap to set up", "It makes new polymers"], "a": 0, "e": "Waste-to-energy plants recover energy from burning waste."}, {"q": "What is a disadvantage of recycling polymers?", "o": ["It releases toxic gases", "Different polymers must be collected and sorted, which is costly", "It uses more crude oil", "It produces methane"], "a": 1, "e": "Sorting and cleaning add cost, but recycling saves resources."}, {"q": "What is a disadvantage of landfill for polymers?", "o": ["It produces electricity", "It releases HCl", "It takes up a lot of space, and polymers take a very long time to break down", "It is too expensive"], "a": 2, "e": "Landfill sites fill up and polymers persist for centuries."}, {"q": "How can polyesters be broken down chemically?", "o": ["By adding bromine", "By polymerisation", "By cracking", "By hydrolysis with acid or base"], "a": 3, "e": "Hydrolysis reverses the condensation reaction."}, {"q": "Each monomer for condensation polymerisation must have how many functional groups?", "o": ["Two", "One", "Three", "None"], "a": 0, "e": "Two reactive groups allow chains to grow in both directions."}, {"q": "What is the linking group in a polyester?", "o": ["–CONH–", "–COO–", "–NH–", "–CH₂–"], "a": 1, "e": "The ester link."}, {"q": "How does a condensation polymer differ from an addition polymer?", "o": ["Condensation polymers are always natural", "Addition polymers lose water", "Condensation polymers form with loss of a small molecule; addition polymers don't", "There is no difference"], "a": 2, "e": "Addition polymers keep all the monomer atoms."}, {"q": "What forces exist between polyester chains?", "o": ["Ionic bonds", "Hydrogen bonds only", "Metallic bonds", "Permanent dipole–dipole forces (and van der Waals)"], "a": 3, "e": "The polar C=O bonds give dipole–dipole forces between chains."}, {"q": "Which polymer would biodegrade most easily?", "o": ["Nylon-6,6", "Poly(ethene)", "Poly(propene)", "PVC"], "a": 0, "e": "Nylon has amide links that can be hydrolysed. The others are polyalkenes."}, {"q": "What is a use of Kevlar?", "o": ["Fuel", "Bulletproof vests", "Food flavouring", "Fertiliser"], "a": 1, "e": "Kevlar's strength-to-weight ratio makes it ideal for protective clothing."}]}, {"id": "3.3.13", "order": 31, "year": 2, "section": "3.3", "spec": "3.3.13", "title": "Amino acids, proteins and DNA", "desc": "Amino acids as zwitterions, peptide bonds and hydrolysis, protein structure, enzymes and drug design, DNA structure and the action of cisplatin.", "practicals": [12], "summary": [{"h": "Amino acids", "p": ["Amino acids have an **amine group** and a **carboxylic acid group**. Most are chiral (except glycine).", "At their **isoelectric point**, amino acids exist as **zwitterions**: H₃N⁺–CHR–COO⁻.", "In **acid** (low pH), the COO⁻ is protonated: H₃N⁺–CHR–COOH. In **alkali** (high pH), the NH₃⁺ loses H⁺: H₂N–CHR–COO⁻.", "Zwitterions explain the **high melting points** and solubility of amino acids (ionic attractions)."]}, {"h": "Proteins", "p": ["Amino acids join by **condensation** to form **peptide bonds**: –CONH–.", "Proteins can be **hydrolysed** by heating with **6 mol dm⁻³ HCl** for 24 hours, giving amino acids. These can be separated and identified by **TLC** (developed with ninhydrin).", "**Primary** structure: sequence of amino acids. **Secondary**: α-helix and β-pleated sheet held by **hydrogen bonds**. **Tertiary**: 3D shape held by hydrogen bonds, **ionic** interactions and **disulfide bridges** (–S–S– between cysteine residues)."]}, {"h": "Enzymes", "p": ["Enzymes are proteins with a **stereospecific active site**: only one enantiomer of a substrate may fit.", "**Inhibitors** with a similar shape to the substrate can **block the active site**.", "**Drug design**: computer modelling is used to design drugs that fit active sites of target enzymes."]}, {"h": "DNA", "p": ["DNA is a polymer of **nucleotides**: a phosphate, **2-deoxyribose** sugar, and a base (A, T, C or G).", "Nucleotides are joined by **phosphodiester** links in a sugar-phosphate backbone.", "Two strands form a **double helix**, held by **hydrogen bonds** between complementary base pairs: **A–T (2 H-bonds)** and **C–G (3 H-bonds)**."]}, {"h": "Cisplatin", "p": ["**Cisplatin**, Pt(NH₃)₂Cl₂, is an **anticancer** drug.", "It binds to **DNA**: the two Cl⁻ ligands are replaced by **nitrogen atoms on guanine** bases (ligand substitution). This forms a cross-link, stopping DNA replication, so cancer cells can't divide.", "Side effects: it also affects **healthy cells** that divide quickly (e.g. hair loss). Doses are minimised."]}], "pitfalls": ["Write the zwitterion with **NH₃⁺** and **COO⁻**.", "A–T forms **2** hydrogen bonds; C–G forms **3**.", "Cisplatin works by **ligand substitution** with guanine N atoms, preventing replication."], "questions": [{"q": "What is a zwitterion?", "o": ["An amino acid with no charges", "An ion with both a positive (NH₃⁺) and a negative (COO⁻) group, with no overall charge", "A negative ion only", "A protein"], "a": 1, "e": "The amino acid's acid group donates H⁺ to its own amine group."}, {"q": "What form does an amino acid take in strongly acidic solution?", "o": ["H₃N⁺–CHR–COOH", "H₂N–CHR–COO⁻", "H₃N⁺–CHR–COO⁻", "H₂N–CHR–COOH"], "a": 0, "e": "The COO⁻ is protonated, so the ion is positive overall."}, {"q": "What form does an amino acid take in strongly alkaline solution?", "o": ["H₃N⁺–CHR–COOH", "H₃N⁺–CHR–COO⁻", "H₂N–CHR–COO⁻", "H₂N–CHR–COOH"], "a": 2, "e": "The NH₃⁺ loses H⁺, so the ion is negative overall."}, {"q": "Why do amino acids have relatively high melting points?", "o": ["They are covalent networks", "They have C=C bonds", "They are large polymers", "They exist as zwitterions with strong ionic attractions between them"], "a": 3, "e": "Ionic attractions between zwitterions need a lot of energy to overcome."}, {"q": "What is the peptide link?", "o": ["–CONH–", "–COO–", "–O–", "–S–S–"], "a": 0, "e": "Formed by condensation between the COOH of one amino acid and NH₂ of another."}, {"q": "How are proteins hydrolysed in the lab?", "o": ["With cold water", "By heating with 6 mol dm⁻³ HCl for about 24 hours", "With bromine water", "By distillation"], "a": 1, "e": "Strong acid and long heating break all the peptide bonds."}, {"q": "How are amino acids from hydrolysed proteins identified?", "o": ["By IR only", "By titration", "By TLC, developed with ninhydrin, and comparing Rf values", "By measuring pH"], "a": 2, "e": "Ninhydrin reveals amino acids as purple spots."}, {"q": "What holds the secondary structure of a protein?", "o": ["Peptide bonds", "Ionic bonds only", "Disulfide bridges", "Hydrogen bonds between C=O and N–H groups"], "a": 3, "e": "Hydrogen bonding forms α-helices and β-pleated sheets."}, {"q": "Which bonds are involved in tertiary structure?", "o": ["Hydrogen bonds, ionic interactions and disulfide bridges", "Only peptide bonds", "Only van der Waals", "Glycosidic bonds"], "a": 0, "e": "Interactions between R groups fold the chain into a 3D shape."}, {"q": "What is a disulfide bridge?", "o": ["An ionic bond", "A covalent S–S bond between two cysteine residues", "A hydrogen bond", "A peptide bond"], "a": 1, "e": "The thiol groups of two cysteines can form an –S–S– link."}, {"q": "Why is an enzyme active site stereospecific?", "o": ["It is planar", "It reacts with all molecules", "Its 3D shape means only one enantiomer of a substrate fits", "It contains metal ions"], "a": 2, "e": "Active sites are chiral, so the substrate's 3D arrangement matters."}, {"q": "How can a drug act as an enzyme inhibitor?", "o": ["By denaturing the enzyme", "By adding more substrate", "By raising temperature", "By having a similar shape to the substrate and binding to the active site"], "a": 3, "e": "Computer modelling helps design such molecules."}, {"q": "What are the components of a DNA nucleotide?", "o": ["A phosphate, 2-deoxyribose and a base", "Ribose, phosphate and uracil", "An amino acid and sugar", "Glucose and phosphate"], "a": 0, "e": "DNA nucleotides contain 2-deoxyribose."}, {"q": "How many hydrogen bonds form between cytosine and guanine?", "o": ["2", "3", "1", "4"], "a": 1, "e": "C–G has three hydrogen bonds; A–T has two."}, {"q": "Which base pairs with adenine in DNA?", "o": ["Guanine", "Cytosine", "Thymine", "Uracil"], "a": 2, "e": "A pairs with T through two hydrogen bonds."}, {"q": "What links nucleotides in a DNA strand?", "o": ["Peptide bonds", "Hydrogen bonds", "Ester bonds only", "Phosphodiester links"], "a": 3, "e": "Sugar and phosphate join in a backbone."}, {"q": "How does cisplatin work as an anticancer drug?", "o": ["Its Cl ligands are replaced by N atoms on guanine in DNA, preventing replication", "It breaks peptide bonds", "It oxidises DNA", "It acts as an antibiotic"], "a": 0, "e": "Cisplatin cross-links DNA strands, so the cell can't divide."}, {"q": "What type of reaction is cisplatin binding to DNA?", "o": ["Electrophilic addition", "Ligand substitution", "Hydrolysis", "Polymerisation"], "a": 1, "e": "Guanine nitrogen atoms replace chloride ligands on the platinum."}, {"q": "Why does cisplatin cause side effects such as hair loss?", "o": ["It is acidic", "It contains chlorine", "It also prevents replication in healthy, rapidly dividing cells", "It destroys proteins"], "a": 2, "e": "Doses are kept as low as possible to limit harm to healthy cells."}, {"q": "Which amino acid is not chiral?", "o": ["Alanine", "Serine", "Cysteine", "Glycine"], "a": 3, "e": "Glycine's R group is H, so its central carbon has two H atoms."}, {"q": "What is the primary structure of a protein?", "o": ["The sequence of amino acids", "The α-helix", "The 3D shape", "Disulfide bridges"], "a": 0, "e": "Primary structure is the order of amino acids in the chain."}, {"q": "What is the isoelectric point of an amino acid?", "o": ["The pH where it is fully protonated", "The pH at which it exists as a zwitterion with no overall charge", "Its melting point", "The pH of pure water"], "a": 1, "e": "At this pH, the positive and negative charges balance."}]}, {"id": "3.3.14", "order": 32, "year": 2, "section": "3.3", "spec": "3.3.14", "title": "Organic synthesis", "desc": "Planning multi-step syntheses, key reagents and conditions for interconversions, and choosing efficient and safer routes.", "practicals": [], "summary": [{"h": "Planning a synthesis", "p": ["Organic syntheses involve **two or more steps**. Work **backwards** from the target and forwards from the starting material.", "Identify the **functional group changes** needed, and any **change in carbon chain length** (e.g. CN⁻ adds a carbon).", "For each step, state the **reagent**, **conditions** and **type of reaction**.", "Chemists aim for routes with **fewer steps**, **high yields**, **high atom economy**, and that **avoid hazardous** solvents and reagents."]}, {"h": "Key aliphatic interconversions", "p": ["**Alkane → halogenoalkane**: Cl₂ or Br₂, **UV light** (free-radical substitution).", "**Alkene → halogenoalkane**: HBr, room temperature (electrophilic addition). **Alkene → dihalogenoalkane**: Br₂.", "**Alkene → alcohol**: steam + H₃PO₄ catalyst, or conc. H₂SO₄ then water.", "**Halogenoalkane → alcohol**: NaOH(aq), warm, reflux (nucleophilic substitution).", "**Halogenoalkane → alkene**: KOH in ethanol, heat (elimination).", "**Halogenoalkane → nitrile**: KCN in ethanol, reflux (adds one carbon).", "**Halogenoalkane → amine**: excess ethanolic NH₃, heat, sealed tube.", "**Nitrile → amine**: LiAlH₄ or H₂/Ni (reduction).", "**Primary alcohol → aldehyde**: K₂Cr₂O₇/H₂SO₄, distil. **→ carboxylic acid**: reflux with excess.", "**Secondary alcohol → ketone**: K₂Cr₂O₇/H₂SO₄, reflux.", "**Alcohol → alkene**: conc. H₂SO₄ or H₃PO₄, heat (elimination).", "**Aldehyde/ketone → alcohol**: NaBH₄ (reduction). **→ hydroxynitrile**: KCN then dilute acid.", "**Carboxylic acid + alcohol → ester**: conc. H₂SO₄, heat.", "**Acyl chloride → ester/amide/acid**: with alcohol/amine or NH₃/water, room temperature."]}, {"h": "Key aromatic interconversions", "p": ["**Benzene → nitrobenzene**: conc. HNO₃ + conc. H₂SO₄, 50 °C.", "**Nitrobenzene → phenylamine**: Sn + conc. HCl, then NaOH.", "**Benzene → aromatic ketone**: acyl chloride + AlCl₃ (Friedel–Crafts acylation)."]}], "pitfalls": ["Always give **reagent + condition + reaction type** for each step. Marks are lost for missing conditions (e.g. 'aqueous' vs 'ethanolic').", "Check whether the chain length changes. Only **CN⁻** steps add a carbon here.", "Distinguish distil (aldehyde) from reflux (acid) for oxidations."], "questions": [{"q": "How can propan-1-ol be converted to propanal?", "o": ["Heat under reflux with excess acidified K₂Cr₂O₇", "Warm with acidified K₂Cr₂O₇ and distil off the aldehyde", "React with NaBH₄", "Heat with concentrated H₂SO₄"], "a": 1, "e": "Distilling removes the aldehyde before further oxidation."}, {"q": "How can bromoethane be converted to propanenitrile?", "o": ["KCN in ethanol, heated under reflux", "NH₃ in ethanol", "NaOH(aq)", "HBr"], "a": 0, "e": "Nucleophilic substitution by CN⁻ adds one carbon."}, {"q": "What reagent converts a nitrile to a primary amine?", "o": ["NaBH₄", "K₂Cr₂O₇", "LiAlH₄ (or H₂ with Ni catalyst)", "Concentrated H₂SO₄"], "a": 2, "e": "Reduction converts –C≡N into –CH₂NH₂."}, {"q": "How can ethene be converted to ethanol?", "o": ["NaBH₄", "KOH in ethanol", "UV light and Cl₂", "Steam with a phosphoric acid catalyst"], "a": 3, "e": "Hydration of ethene by electrophilic addition."}, {"q": "Which conditions convert 2-bromopropane into propene?", "o": ["KOH in ethanol, heated", "NaOH(aq), warm", "Excess NH₃", "KCN in ethanol"], "a": 0, "e": "Ethanolic hydroxide favours elimination."}, {"q": "How can a ketone be converted to a secondary alcohol?", "o": ["Oxidise with K₂Cr₂O₇", "Reduce with NaBH₄", "React with KCN", "Heat with H₂SO₄"], "a": 1, "e": "NaBH₄ reduces ketones to secondary alcohols."}, {"q": "What is the reagent for converting benzene into nitrobenzene?", "o": ["Dilute HNO₃", "Sn and HCl", "Concentrated HNO₃ and concentrated H₂SO₄ at 50 °C", "AlCl₃"], "a": 2, "e": "These generate the NO₂⁺ electrophile."}, {"q": "A synthesis needs to increase the carbon chain length by one. Which reagent is useful?", "o": ["NaBH₄", "NH₃", "HBr", "KCN"], "a": 3, "e": "CN⁻ adds a carbon atom in substitution or addition reactions."}, {"q": "What is a two-step route from ethane to ethanol?", "o": ["Cl₂ with UV light, then NaOH(aq) and warm", "Steam and H₃PO₄, then oxidise", "NaBH₄, then H₂SO₄", "KOH in ethanol, then HBr"], "a": 0, "e": "Free-radical substitution gives chloroethane, which nucleophilic substitution turns into ethanol."}, {"q": "What is a route from ethanol to ethyl ethanoate using ethanol as the only organic starting material?", "o": ["Reduce ethanol, then esterify", "Oxidise some ethanol to ethanoic acid (reflux), then esterify with more ethanol using H₂SO₄", "Dehydrate ethanol, then add HBr", "React ethanol with NaBH₄"], "a": 1, "e": "Oxidation gives the acid; esterification joins acid and alcohol."}, {"q": "How can phenylamine be made from benzene?", "o": ["React with NH₃ directly", "Friedel–Crafts acylation", "Nitrate with conc. HNO₃/H₂SO₄, then reduce with Sn/HCl", "React with KCN"], "a": 2, "e": "Benzene → nitrobenzene → phenylamine."}, {"q": "Why do chemists prefer synthetic routes with fewer steps?", "o": ["They use more reagents", "They make more by-products", "They are always slower", "Each step loses some yield, so fewer steps give a higher overall yield"], "a": 3, "e": "Overall yield is the product of the yields of each step."}, {"q": "Two steps each have 80% yield. What is the overall yield?", "o": ["64%", "80%", "160%", "40%"], "a": 0, "e": "0.80 × 0.80 = 0.64, so 64%."}, {"q": "Which reagent converts an acyl chloride into an amide?", "o": ["Water", "Ammonia", "An alcohol", "NaBH₄"], "a": 1, "e": "Nucleophilic addition–elimination with NH₃ gives a primary amide."}, {"q": "What converts propanal into 2-hydroxybutanenitrile?", "o": ["NaBH₄", "K₂Cr₂O₇", "KCN followed by dilute acid", "NH₃"], "a": 2, "e": "Nucleophilic addition of CN⁻ to the C=O adds a carbon."}, {"q": "How can propan-2-ol be converted to propanone?", "o": ["Distil with K₂Cr₂O₇", "Reduce with NaBH₄", "React with HBr", "Heat under reflux with acidified K₂Cr₂O₇"], "a": 3, "e": "Secondary alcohols are oxidised to ketones."}, {"q": "Which reagent converts benzene into phenylethanone?", "o": ["Ethanoyl chloride with AlCl₃", "Ethanol with H₂SO₄", "Ethanoic acid only", "Chloroethane with UV"], "a": 0, "e": "Friedel–Crafts acylation gives an aromatic ketone."}, {"q": "What reaction type converts an alkene into a dibromoalkane?", "o": ["Nucleophilic substitution", "Electrophilic addition", "Free-radical substitution", "Elimination"], "a": 1, "e": "Br₂ adds across the C=C."}, {"q": "Why might a chemist avoid a route using a hazardous solvent?", "o": ["It always lowers the yield", "It makes the product impure", "To reduce risks to people and the environment (green chemistry)", "It increases atom economy"], "a": 2, "e": "Safer reagents and solvents are a key aim of sustainable synthesis."}, {"q": "What is formed by heating a halogenoalkane with excess ethanolic ammonia in a sealed tube?", "o": ["An alcohol", "An alkene", "A nitrile", "A primary amine"], "a": 3, "e": "Nucleophilic substitution by NH₃."}, {"q": "Which step converts a carboxylic acid into an ester?", "o": ["Heat with an alcohol and a concentrated H₂SO₄ catalyst", "Add NaBH₄", "Add water", "Add HBr"], "a": 0, "e": "Esterification is a reversible condensation reaction."}, {"q": "How can propene be converted into propan-2-ol in one step?", "o": ["React with NaBH₄", "React with steam and a phosphoric acid catalyst", "React with KOH in ethanol", "React with Cl₂ in UV"], "a": 1, "e": "Acid-catalysed hydration gives mainly propan-2-ol via the more stable carbocation."}]}, {"id": "3.3.15", "order": 33, "year": 2, "section": "3.3", "spec": "3.3.15", "title": "NMR spectroscopy", "desc": "¹³C and ¹H NMR, chemical shift and TMS, number of environments, integration, splitting patterns using the n+1 rule, and solvents.", "practicals": [], "summary": [{"h": "Principles", "p": ["NMR detects nuclei with spin, such as **¹H** and **¹³C**, in a magnetic field.", "Atoms in different **chemical environments** absorb at different **chemical shifts (δ)**, measured in **ppm**.", "The reference is **TMS**, Si(CH₃)₄, given δ = 0. TMS is used because it gives a **single, sharp peak** (12 equivalent H), is **inert**, **non-toxic** and **volatile** (easily removed).", "Samples are dissolved in **deuterated solvents** (e.g. CDCl₃) or CCl₄, which have **no ¹H** to interfere."]}, {"h": "¹³C NMR", "p": ["The **number of peaks** = the number of **different carbon environments**.", "Chemical shift (from the data sheet) indicates the type of carbon, e.g. C=O at 160–220 ppm, C–O at 50–90, aromatic/alkene C at 90–150, alkyl C at 5–55.", "¹³C spectra aren't split, and peak heights aren't proportional to the number of carbons."]}, {"h": "¹H NMR", "p": ["**Number of peaks** = number of different **H environments**.", "**Integration** (relative peak area) = the **ratio** of H atoms in each environment.", "**Chemical shift** shows the type of environment, e.g. R–CH₃ about 0.7–1.2, H–C–C=O about 2.1–2.6, H–C–O about 3.1–3.9, aldehyde CHO about 9–10, carboxylic acid OH about 10–12."]}, {"h": "Splitting (n + 1 rule)", "p": ["A peak is split into **n + 1** lines, where **n** is the number of H atoms on **adjacent carbons**.", "Singlet (0 neighbours), **doublet** (1), **triplet** (2), **quartet** (3), and so on.", "Example: ethyl group CH₃CH₂– gives a **triplet** (3H) and a **quartet** (2H).", "H on O or N (OH, NH) often appears as a singlet and doesn't usually split neighbouring peaks."]}], "pitfalls": ["In the n + 1 rule, count H on **neighbouring carbons**, not on the same carbon.", "Check for **symmetry**: equivalent carbons or hydrogens count as **one** environment.", "Integration gives a **ratio**, not absolute numbers. Scale up to fit the formula."], "questions": [{"q": "What is used as the standard reference in NMR?", "o": ["Water", "Tetramethylsilane (TMS)", "CDCl₃", "Benzene"], "a": 1, "e": "TMS is given a chemical shift of 0 ppm."}, {"q": "Why is TMS used as the reference?", "o": ["It gives a single sharp peak, is inert, non-toxic and volatile", "It has many different H environments", "It is a solvent", "It absorbs at high δ"], "a": 0, "e": "All 12 H atoms in TMS are equivalent."}, {"q": "Why are deuterated solvents such as CDCl₃ used in ¹H NMR?", "o": ["They are cheaper", "They react with the sample", "They contain no ¹H atoms, so they don't give peaks in the spectrum", "They increase chemical shift"], "a": 2, "e": "Deuterium doesn't show up in a ¹H spectrum."}, {"q": "How many peaks are in the ¹³C NMR spectrum of propanone, CH₃COCH₃?", "o": ["3", "1", "4", "2"], "a": 3, "e": "The two CH₃ carbons are equivalent, plus one C=O carbon: 2 environments."}, {"q": "How many peaks are in the ¹³C NMR spectrum of propan-1-ol?", "o": ["3", "2", "1", "4"], "a": 0, "e": "Each of the three carbons is in a different environment."}, {"q": "In ¹H NMR, what does the relative area (integration) of peaks show?", "o": ["The number of carbon atoms", "The ratio of hydrogen atoms in each environment", "The chemical shift", "The number of neighbouring H"], "a": 1, "e": "Peak area is proportional to the number of H atoms in that environment."}, {"q": "A ¹H NMR peak is split into a quartet. How many H atoms are on adjacent carbons?", "o": ["4", "2", "3", "1"], "a": 2, "e": "n + 1 = 4, so n = 3."}, {"q": "What splitting pattern does the CH₃ in an ethyl group (CH₃CH₂–) show?", "o": ["Singlet", "Doublet", "Quartet", "Triplet"], "a": 3, "e": "The CH₃ is next to a CH₂ (2 H), so n + 1 = 3."}, {"q": "What splitting pattern does the CH₂ in CH₃CH₂Cl show?", "o": ["Quartet", "Triplet", "Singlet", "Doublet"], "a": 0, "e": "The CH₂ is next to a CH₃ (3 H), so it is a quartet."}, {"q": "How many peaks are in the ¹H NMR spectrum of ethanol, CH₃CH₂OH?", "o": ["2", "3", "6", "1"], "a": 1, "e": "CH₃, CH₂ and OH are three different environments."}, {"q": "A peak at δ 9.7 in a ¹H NMR spectrum suggests which group?", "o": ["Alkyl CH₃", "Alcohol OH", "Aldehyde CHO", "Aromatic H"], "a": 2, "e": "Aldehyde protons appear at about 9–10 ppm."}, {"q": "In ¹³C NMR, what does a peak at about 200 ppm indicate?", "o": ["C–H alkyl carbon", "C–O in an alcohol", "Aromatic carbon", "C=O in an aldehyde or ketone"], "a": 3, "e": "Carbonyl carbons appear far downfield, at 160–220 ppm."}, {"q": "What unit is chemical shift measured in?", "o": ["ppm", "cm⁻¹", "m/z", "nm"], "a": 0, "e": "Chemical shift is measured in parts per million relative to TMS."}, {"q": "What splitting does a CH₃ group show if it is attached to a C=O with no H?", "o": ["Doublet", "Singlet", "Triplet", "Quartet"], "a": 1, "e": "No H on adjacent carbons, so n = 0 and it's a singlet (e.g. CH₃ in propanone)."}, {"q": "What is the ratio of peak areas in the ¹H NMR spectrum of ethyl ethanoate, CH₃COOCH₂CH₃?", "o": ["3:3:2", "3:2", "3:2:3", "1:1:1"], "a": 2, "e": "CH₃CO (3H), OCH₂ (2H), CH₂CH₃ (3H): three environments in ratio 3:2:3."}, {"q": "How many H environments does 2-methylpropane, (CH₃)₃CH, have?", "o": ["4", "1", "3", "2"], "a": 3, "e": "The three CH₃ groups are equivalent (9H), plus one CH (1H)."}, {"q": "What splitting does the CH in (CH₃)₂CHCl show?", "o": ["A heptet (7 lines)", "A doublet", "A triplet", "A singlet"], "a": 0, "e": "6 neighbouring H, so n + 1 = 7."}, {"q": "Why are ¹³C NMR peak heights not used to count carbons?", "o": ["¹³C spectra have no peaks", "Peak heights aren't proportional to the number of carbons", "All carbons give the same peak", "TMS interferes"], "a": 1, "e": "Only the number and position of peaks are used in ¹³C NMR at A-level."}, {"q": "A compound C₃H₆O gives one ¹H NMR peak (singlet). What is it?", "o": ["Propanal", "Propan-1-ol", "Propanone", "Prop-2-en-1-ol"], "a": 2, "e": "Propanone has two equivalent CH₃ groups next to C=O, giving one singlet."}, {"q": "In ¹H NMR, what does chemical shift indicate?", "o": ["The number of H atoms", "The number of neighbouring H", "The molecular mass", "The type of chemical environment of the H atoms"], "a": 3, "e": "Nearby electronegative atoms or groups shift peaks to higher δ."}, {"q": "What does the n in the n + 1 rule refer to?", "o": ["The number of H atoms on adjacent carbons", "The number of H atoms on the same carbon", "The number of carbons", "The number of peaks"], "a": 0, "e": "Coupling happens between non-equivalent H on neighbouring carbons."}, {"q": "Which compound has 2 peaks in its ¹³C NMR spectrum?", "o": ["Propan-1-ol", "Ethanol", "Butane", "Pentane"], "a": 1, "e": "Ethanol has two carbons in different environments."}]}, {"id": "3.3.16", "order": 34, "year": 2, "section": "3.3", "spec": "3.3.16", "title": "Chromatography", "desc": "Stationary and mobile phases, thin-layer, column and gas chromatography, Rf values and retention times, and combining GC with mass spectrometry.", "practicals": [12], "summary": [{"h": "Principles", "p": ["Chromatography separates and identifies components of a mixture.", "All types have a **stationary phase** and a **mobile phase**.", "Separation depends on the balance between **solubility in the mobile phase** and **retention by the stationary phase** (e.g. adsorption)."]}, {"h": "Thin-layer chromatography (TLC)", "p": ["Stationary phase: a thin layer of **silica** or **alumina** on a plate. Mobile phase: a **solvent**.", "`Rf = distance moved by spot ÷ distance moved by solvent front`", "Colourless spots are revealed by **UV light** or chemicals such as **ninhydrin** (amino acids) or iodine.", "Identify substances by comparing Rf values with known samples run under the **same conditions**."]}, {"h": "Column chromatography", "p": ["A column packed with silica or alumina (stationary phase). A solvent (mobile phase, the **eluent**) is run through.", "Components travel at different rates and are collected separately as **fractions**. Used to **purify** products."]}, {"h": "Gas chromatography (GC)", "p": ["Mobile phase: an **inert carrier gas** (e.g. helium or nitrogen). Stationary phase: a **liquid or solid** coating inside a long, coiled column in an oven.", "Each component has a characteristic **retention time**: the time from injection to detection.", "**Peak area** is proportional to the **amount** of that component.", "**GC–MS**: GC separates components, then **mass spectrometry** identifies each one."]}], "pitfalls": ["Rf values depend on conditions: compare only with standards run on the **same plate** with the **same solvent**.", "In GC, retention time **identifies**, and peak **area** gives relative **amount**.", "Draw the TLC origin in **pencil**, with the solvent level **below** it."], "questions": [{"q": "What two phases are involved in all types of chromatography?", "o": ["Solid and liquid phases only", "A stationary phase and a mobile phase", "Gas and liquid phases only", "Polar and non-polar phases"], "a": 1, "e": "Components are distributed between the stationary and mobile phases."}, {"q": "What determines how far a substance moves in chromatography?", "o": ["The balance between solubility in the mobile phase and retention by the stationary phase", "Its colour", "Its mass only", "Temperature only"], "a": 0, "e": "Substances that are more soluble in the mobile phase and less retained travel further."}, {"q": "What is the stationary phase in TLC?", "o": ["A solvent", "An inert gas", "A thin layer of silica or alumina on a plate", "Water"], "a": 2, "e": "The solid coating adsorbs components to different extents."}, {"q": "A spot moves 2.4 cm and the solvent front moves 6.0 cm. What is the Rf value?", "o": ["2.5", "3.6", "0.25", "0.40"], "a": 3, "e": "Rf = 2.4 ÷ 6.0 = 0.40."}, {"q": "How can colourless spots of amino acids be seen on a TLC plate?", "o": ["Spray with ninhydrin, or view under UV light", "Add water", "Heat to 500 °C", "Add bromine water"], "a": 0, "e": "Ninhydrin reacts with amino acids to give purple spots."}, {"q": "Why is the origin line drawn in pencil?", "o": ["It's easier to see", "Ink would dissolve in the solvent and move up the plate", "Pencil is cheaper", "To mark the solvent front"], "a": 1, "e": "Graphite doesn't dissolve, so it doesn't interfere."}, {"q": "Why must the solvent level be below the origin line?", "o": ["To speed up the solvent", "To make spots visible", "So the samples don't dissolve into the solvent pool instead of moving up the plate", "To keep the plate dry"], "a": 2, "e": "Spots in the solvent would wash off the plate."}, {"q": "What is column chromatography mainly used for?", "o": ["Measuring Rf values", "Measuring retention time", "Identifying gases", "Separating and purifying products, collected as fractions"], "a": 3, "e": "Components are collected separately as they come out of the column."}, {"q": "What is the mobile phase in gas chromatography?", "o": ["An inert carrier gas such as helium or nitrogen", "Silica", "Water", "A liquid solvent"], "a": 0, "e": "The gas carries the vaporised sample through the column."}, {"q": "What is retention time in GC?", "o": ["The time the oven is on", "The time from injection to detection of a component", "The time for the solvent front to move", "The time to vaporise the sample"], "a": 1, "e": "Each compound has a characteristic retention time under given conditions."}, {"q": "In a gas chromatogram, what does the area under each peak show?", "o": ["The identity of the component", "The retention time", "The relative amount of that component", "The boiling point"], "a": 2, "e": "Larger area means more of that substance."}, {"q": "What is the advantage of GC–MS?", "o": ["It is cheaper than TLC", "It doesn't need a sample", "It only measures Rf", "GC separates the mixture and MS identifies each component"], "a": 3, "e": "The mass spectrum of each separated compound can be matched to a database."}, {"q": "Why must Rf values be compared under the same conditions?", "o": ["Rf depends on the solvent, plate and temperature", "Rf never changes", "Rf depends on the amount of sample", "Rf depends on the pencil used"], "a": 0, "e": "Different conditions change how far substances move."}, {"q": "What is the stationary phase in gas chromatography?", "o": ["The carrier gas", "A liquid or solid coating inside the column", "A paper strip", "The sample"], "a": 1, "e": "Components interact differently with this coating."}, {"q": "Why is a lid placed on the TLC tank?", "o": ["To keep light out", "To heat the plate", "To keep the atmospher   const secs = u.summary.map((s, i) => `<section class="sum-sec"><h2><span class="n">${String(i + 1).padStart(2, '0')}</span>${fmt(s.h)}</h2><ul>${s.p.map(p => `<li>${fmt(p)}</li>`).join('')}</ul></section>`).join('');
  const pit = u.pitfalls && u.pitfalls.length ? `<div class="callout"><h2>Where marks are lost</h2><ul>${u.pitfalls.map(p => `<li>${fmt(p)}</li>`).join('')}</ul></div>` : '';
  const rps = (u.practicals || []).map(n => { const p = rpById(n); return p ? `<a class="btn" href="#rp-${n}">RP${n}: ${esc(p.title)}</a>` : ''; }).join('');
  $('#app').innerHTML = topbar(`<a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="page wrap ${cls}"><div class="page-head"><div class="page-eyebrow">${esc(u.section)} ${esc(SEC_NAMES[u.section])} · Spec ${esc(u.spec)}</div>
  <h1 class="page-title">${esc(u.title)}</h1><p class="page-sub">${esc(u.desc)}</p>
  <div class="page-actions"><a class="btn primary" href="#q-${u.id}">Take the quiz</a>${rps}</div></div>
  ${secs}${pit}
  <div class="page-actions"><a class="btn primary" href="#q-${u.id}">Take the quiz</a><a class="btn" href="#hub">Back to hub</a></div></main>` + footer();
}

/* ---------- Practicals ---------- */
function rpCard(p) {
  const u = unitById(p.unit);
  const cls = u ? secClass(u) : 'sec1';
  return `<article class="rp ${cls}" id="rp-card-${p.n}"><div class="rp-top"><span class="rp-no">RP ${p.n}</span><div><h3>${esc(p.title)}</h3><div class="spec">Spec ${esc(p.spec)} · Year ${p.year}${u ? ` · <a href="#s-${u.id}">${esc(u.title)}</a>` : ''}</div></div></div>
  <p style="font-size:0.9rem;color:var(--muted)">${fmt(p.aim)}</p>
  <h4>Method</h4><ol>${p.method.map(m => `<li>${fmt(m)}</li>`).join('')}</ol>
  <h4>Variables</h4><div class="vars"><div class="var"><b>Independent</b>${fmt(p.iv)}</div><div class="var"><b>Dependent</b>${fmt(p.dv)}</div><div class="var"><b>Control</b>${fmt(p.cv)}</div></div>
  <h4>Exam points</h4><ul>${p.exam.map(m => `<li>${fmt(m)}</li>`).join('')}</ul></article>`;
}
function renderPracticals(focus) {
  const list = DATA.practicals.slice().sort((a, b) => a.n - b.n);
  $('#app').innerHTML = topbar(`<a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="page wrap"><div class="page-head"><div class="page-eyebrow">Practical skills · Apparatus and techniques</div><h1 class="page-title">Required practicals</h1>
  <p class="page-sub">${DATA.meta.rpIntro}</p></div>
  ${list.map(rpCard).join('')}${list.length < 12 ? `<div class="pending">${12 - list.length} more practicals being written.</div>` : ''}</main>` + footer();
  if (focus) { const el = document.getElementById('rp-card-' + focus); if (el) el.scrollIntoView(); }
}

/* ---------- Quiz ---------- */
const DRAW = 10;
let Q = null, timerInterval = null;
function renderQuiz(u, retry) {
  clearInterval(timerInterval);
  let pool = u.questions.map((q, i) => Object.assign({ _id: i }, q));
  if (retry) {
    const m = store.get('missed_' + u.id, []);
    const p2 = pool.filter(q => m.includes(q._id));
    if (p2.length) pool = p2;
  } else store.del('missed_' + u.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  Q = { u, qs: pool.slice(0, Math.min(DRAW, pool.length)), cur: 0, score: 0, answered: false, done: false, timer: store.get('timer', false), secs: 60 };
  const cls = secClass(u);
  $('#app').innerHTML = topbar(`<button class="pill-btn ${Q.timer ? 'active' : ''}" id="timer-btn" onclick="toggleTimer()">Timer: ${Q.timer ? 'On' : 'Off'}</button><a class="pill-btn" href="#hub">← Hub</a>`) + `
  <main class="quiz wrap ${cls}"><div class="quiz-head"><div class="page-eyebrow">${esc(u.section)} · Spec ${esc(u.spec)}</div><h1 class="page-title">${esc(u.title)}</h1>
  <p class="page-sub">${retry ? 'Retrying the questions you missed' : `10 questions drawn from a pool of ${u.questions.length}`} · <a href="#s-${u.id}">Read the summary</a></p></div>
  <div id="qa"></div></main>` + footer();
  drawQ();
}
function drawQ() {
  const q = Q.qs[Q.cur], L = ['A', 'B', 'C', 'D'];
  Q.answered = false;
  $('#qa').innerHTML = `<div class="prog-label"><span>Question ${Q.cur + 1} of ${Q.qs.length}</span><span>Score: ${Q.score}</span></div>
  <div class="prog"><div style="width:${(Q.cur + 1) / Q.qs.length * 100}%"></div></div>
  <div class="q-card"><div class="q-num"><span>Question ${Q.cur + 1}</span>${Q.timer ? `<span class="q-timer" id="q-timer">60s</span>` : ''}</div>
  <div class="q-text">${fmt(q.q)}</div><div class="options">${q.o.map((o, i) => `<button class="option" id="opt${i}" onclick="pick(${i})"><span class="letter">${L[i]}</span><span>${fmt(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>
  <div class="quiz-foot"><span class="key-hint">Keys: 1–4 to answer · Enter for next</span><button class="btn-next" id="next" hidden onclick="nextQ()">Next →</button></div>`;
  if (Q.timer) startTimer();
}
function startTimer() {
  clearInterval(timerInterval); Q.secs = 60;
  timerInterval = setInterval(() => {
    Q.secs--; const el = $('#q-timer');
    if (el) { el.textContent = Q.secs + 's'; if (Q.secs <= 10) el.classList.add('warn'); }
    if (Q.secs <= 0) { clearInterval(timerInterval); pick(-1); }
  }, 1000);
}
function pick(i) {
  if (!Q || Q.answered || Q.done) return;
  Q.answered = true; clearInterval(timerInterval);
  const q = Q.qs[Q.cur];
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  const ok = i === q.a;
  if (ok) Q.score++;
  else {
    if (i >= 0) $('#opt' + i).classList.add('wrong');
    const m = store.get('missed_' + Q.u.id, []); if (!m.includes(q._id)) { m.push(q._id); store.set('missed_' + Q.u.id, m); }
  }
  $('#opt' + q.a).classList.add('correct');
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'correct' : 'wrong'}"><b>${ok ? 'Correct.' : i === -1 ? "Time's up." : 'Not quite.'}</b> ${fmt(q.e)}</div>`;
  const nb = $('#next'); nb.hidden = false; nb.textContent = Q.cur < Q.qs.length - 1 ? 'Next →' : 'See results'; nb.focus({ preventScroll: true });
  document.querySelector('.prog-label span:last-child').textContent = 'Score: ' + Q.score;
}
function nextQ() { if (!Q.answered) return; Q.cur++; if (Q.cur >= Q.qs.length) return showResult(); drawQ(); window.scrollTo(0, 0); }
function showResult() {
  Q.done = true; clearInterval(timerInterval);
  const pct = Math.round(Q.score / Q.qs.length * 100);
  store.set('last_' + Q.u.id, { score: Q.score, total: Q.qs.length, pct, date: new Date().toISOString() });
  const missed = store.get('missed_' + Q.u.id, []).length;
  const msg = pct >= 80 ? 'Excellent. This topic is in good shape.' : pct >= 60 ? 'Good effort. Read the explanations for the ones you missed.' : 'Worth another pass through the summary, then retry.';
  $('#qa').innerHTML = `<div class="result"><div class="result-score">${Q.score}/${Q.qs.length}</div><div class="result-pct">${pct}% correct</div><div class="result-msg">${msg}</div>
  <div class="actions"><button class="btn primary" onclick="renderQuiz(Q.u,false)">New quiz</button>${missed ? `<button class="btn warn" onclick="renderQuiz(Q.u,true)">Retry ${missed} missed</button>` : ''}<a class="btn" href="#s-${Q.u.id}">Summary</a><a class="btn" href="#hub">Hub</a></div></div>`;
}
function toggleTimer() {
  Q.timer = !Q.timer; store.set('timer', Q.timer);
  const b = $('#timer-btn'); b.textContent = 'Timer: ' + (Q.timer ? 'On' : 'Off'); b.classList.toggle('active', Q.timer);
}
document.addEventListener('keydown', e => {
  if (!Q || Q.done || !$('#qa')) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (!Q.answered && ['1', '2', '3', '4'].includes(e.key)) pick(+e.key - 1);
  else if (Q.answered && (e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.id !== 'next') { e.preventDefault(); nextQ(); }
});

/* ---------- Router ---------- */
function route() {
  clearInterval(timerInterval); Q = null;
  const h = location.hash.replace('#', '');
  let m;
  if ((m = h.match(/^q-(.+)$/)) && unitById(m[1])) renderQuiz(unitById(m[1]), false);
  else if ((m = h.match(/^s-(.+)$/)) && unitById(m[1])) renderSummary(unitById(m[1]));
  else if (h === 'practicals') renderPracticals();
  else if ((m = h.match(/^rp-(\d+)$/))) renderPracticals(m[1]);
  else renderHub();
  if (!/^rp-/.test(h)) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
