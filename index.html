<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQA Chemistry Study Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: Finance Study Hub design carried over — dark-first, gold brand accent, one colour per AQA spec section. */
:root {
  color-scheme: dark;
  --bg:#09090f; --surface:#111118; --card:#16161e; --card-hover:#1c1c26;
  --border:#2a2a38; --border-hi:#3d3d52; --text:#f0efff; --muted:#8b8aab; --dim:#6a6985;
  --gold:#e8b84b; --gold-dim:#a8832a; --gold-bg:rgba(232,184,75,0.08);
  --topbar:rgba(9,9,15,0.85);
  --correct:#34d399; --correct-bg:rgba(52,211,153,0.12); --wrong:#f87171; --wrong-bg:rgba(248,113,113,0.12);
  --on-accent:#0b0b12;
  --s1:#818cf8; --s2:#38bdf8; --s3:#2dd4bf; --s4:#a78bfa; --s5:#fbbf24; --s6:#fb7185; --s7:#34d399; --s8:#e879f9;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#f5f4f0; --surface:#eeede8; --card:#ffffff; --card-hover:#fafaf8;
    --border:#dddbd4; --border-hi:#c8c5bc; --text:#1a1814; --muted:#635f54; --dim:#8a867a;
    --gold:#9a6f12; --gold-dim:#c9982c; --gold-bg:rgba(184,134,26,0.08);
    --topbar:rgba(245,244,240,0.9);
    --correct:#047857; --correct-bg:rgba(5,150,105,0.10); --wrong:#c81e1e; --wrong-bg:rgba(220,38,38,0.09);
    --on-accent:#ffffff;
    --s1:#4f46e5; --s2:#0369a1; --s3:#0f766e; --s4:#6d28d9; --s5:#b45309; --s6:#be123c; --s7:#047857; --s8:#a21caf;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#f5f4f0; --surface:#eeede8; --card:#ffffff; --card-hover:#fafaf8;
  --border:#dddbd4; --border-hi:#c8c5bc; --text:#1a1814; --muted:#635f54; --dim:#8a867a;
  --gold:#9a6f12; --gold-dim:#c9982c; --gold-bg:rgba(184,134,26,0.08);
  --topbar:rgba(245,244,240,0.9);
  --correct:#047857; --correct-bg:rgba(5,150,105,0.10); --wrong:#c81e1e; --wrong-bg:rgba(220,38,38,0.09);
  --on-accent:#ffffff;
  --s1:#4f46e5; --s2:#0369a1; --s3:#0f766e; --s4:#6d28d9; --s5:#b45309; --s6:#be123c; --s7:#047857; --s8:#a21caf;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.5; min-height:100%; }
button { font-family:inherit; }
a { color:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

.sec1{--acc:var(--s1)} .sec2{--acc:var(--s2)} .sec3{--acc:var(--s3)} .sec4{--acc:var(--s4)}
.sec5{--acc:var(--s5)} .sec6{--acc:var(--s6)} .sec7{--acc:var(--s7)} .sec8{--acc:var(--s8)}

/* Top bar */
.topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--topbar);
  backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--border); height:52px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.brand { font-size:0.92rem; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:var(--text); }
.brand span { font-size:0.66rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; background:var(--gold-bg); color:var(--gold); border:1px solid var(--gold-dim); border-radius:4px; padding:2px 8px; white-space:nowrap; }
.brand b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
.top-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.icon-btn, .pill-btn { background:var(--surface); border:1px solid var(--border); border-radius:8px; height:34px; cursor:pointer; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
.icon-btn { width:34px; }
.icon-btn svg { width:16px; height:16px; }
.pill-btn { padding:0 12px; font-size:0.74rem; font-weight:700; white-space:nowrap; }
.icon-btn:hover, .pill-btn:hover { border-color:var(--border-hi); color:var(--text); }
.pill-btn.active { border-color:var(--correct); color:var(--correct); background:var(--correct-bg); }

.wrap { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }

/* Hero */
.hero { padding-block:64px 52px; text-align:center; position:relative; overflow:hidden; }
.hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 0%, var(--gold-bg) 0%, transparent 70%); pointer-events:none; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-bottom:20px; }
.eyebrow::before, .eyebrow::after { content:''; width:28px; height:1px; background:var(--gold-dim); }
.hero h1 { font-size:clamp(2.2rem, 7vw, 3.8rem); font-weight:800; line-height:1.05; letter-spacing:-0.03em; margin-bottom:14px; text-wrap:balance; }
.hero h1 em { font-style:italic; color:var(--gold); }
.hero-sub { color:var(--muted); font-size:1rem; max-width:470px; margin:0 auto 34px; line-height:1.7; }
.stats { display:inline-flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); position:relative; }
.stat { padding:14px 26px; text-align:center; border-right:1px solid var(--border); }
.stat:last-child { border-right:none; }
.stat-num { font-size:1.6rem; font-weight:800; color:var(--gold); line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.stat-label { font-size:0.66rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); margin-top:4px; }

/* Hub */
.main { max-width:900px; margin:0 auto; padding-block:24px 72px; }
.year-tabs { display:flex; gap:8px; margin-bottom:32px; flex-wrap:wrap; }
.year-tab { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:0.8rem; font-weight:700; cursor:pointer; }
.year-tab[aria-pressed="true"] { background:var(--gold-bg); color:var(--gold); border-color:var(--gold-dim); }
.year-tab small { font-weight:500; opacity:0.8; margin-left:4px; }
.sec-block { margin-bottom:40px; }
.section-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.section-head .code { font-size:0.72rem; font-weight:800; color:var(--acc); letter-spacing:0.04em; font-variant-numeric:tabular-nums; }
.section-head .label { font-size:0.72rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); }
.section-head .line { flex:1; height:1px; background:var(--border); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap:14px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s, transform .2s, background .2s; min-width:0; }
.card:hover { border-color:var(--border-hi); background:var(--card-hover); transform:translateY(-2px); }
.card-accent { height:2px; background:var(--acc); }
.card-body { padding:20px; flex:1; display:flex; flex-direction:column; }
.card-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.sec-badge { width:44px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:color-mix(in srgb, var(--acc) 12%, transparent); color:var(--acc); font-size:0.78rem; font-weight:800; font-variant-numeric:tabular-nums; }
.card-meta { min-width:0; flex:1; }
.card-num { font-size:0.64rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
.card-title { font-size:1rem; font-weight:700; line-height:1.25; letter-spacing:-0.01em; text-wrap:balance; }
.score { font-size:0.66rem; font-weight:700; padding:2px 8px; border-radius:5px; letter-spacing:0.04em; margin-top:3px; white-space:nowrap; }
.score.pass { background:var(--correct-bg); color:var(--correct); }
.score.fail { background:var(--wrong-bg); color:var(--wrong); }
.divider { height:1px; background:var(--border); margin-bottom:12px; }
.card-desc { color:var(--muted); font-size:0.835rem; line-height:1.6; flex:1; margin-bottom:18px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-size:0.78rem; font-weight:600; text-decoration:none; border:1px solid var(--border); cursor:pointer; background:var(--surface); color:var(--muted); transition:opacity .15s, transform .12s, border-color .15s, color .15s; }
.btn:hover { border-color:var(--border-hi); color:var(--text); transform:translateY(-1px); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--on-accent); }
.btn.primary:hover { color:var(--on-accent); opacity:0.88; }
.btn.off { opacity:0.4; pointer-events:none; }
.rp-banner { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:36px; }
.rp-banner h2 { font-size:1rem; font-weight:700; }
.rp-banner p { color:var(--muted); font-size:0.84rem; }
.pending { border:1px dashed var(--border-hi); border-radius:14px; padding:20px; color:var(--dim); font-size:0.85rem; }

/* Reading views */
.page { max-width:720px; margin:0 auto; padding-block:40px 80px; }
.page-head { margin-bottom:32px; }
.page-eyebrow { font-size:0.68rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--acc, var(--gold)); margin-bottom:10px; }
.page-title { font-size:clamp(1.6rem, 5vw, 2.1rem); font-weight:800; letter-spacing:-0.03em; line-height:1.15; text-wrap:balance; margin-bottom:8px; }
.page-sub { color:var(--muted); font-size:0.92rem; max-width:62ch; }
.sum-sec { margin-bottom:30px; }
.sum-sec h2 { font-size:1.08rem; font-weight:700; letter-spacing:-0.01em; margin-bottom:12px; display:flex; gap:10px; align-items:baseline; }
.sum-sec h2 .n { color:var(--acc); font-size:0.8rem; font-weight:800; font-variant-numeric:tabular-nums; }
.sum-sec ul { list-style:none; display:flex; flex-direction:column; gap:8px; }
.sum-sec li { position:relative; padding-left:18px; font-size:0.93rem; line-height:1.65; max-width:68ch; }
.sum-sec li::before { content:''; position:absolute; left:2px; top:0.68em; width:6px; height:6px; border-radius:2px; background:var(--acc); opacity:0.7; }
.sum-sec li strong, .rp li strong { font-weight:700; color:var(--text); }
.callout { background:var(--wrong-bg); border:1px solid color-mix(in srgb, var(--wrong) 40%, transparent); border-radius:12px; padding:18px 20px; margin-bottom:30px; }
.callout h2 { font-size:0.74rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--wrong); margin-bottom:10px; }
.callout ul { padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:0.9rem; line-height:1.6; }
.eq { font-variant-numeric:tabular-nums; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1px 6px; overflow-wrap:anywhere; }
.page-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }

.rp { scroll-margin-top:68px; min-width:0; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:16px; }
.rp-top { display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
.rp-no { font-size:0.7rem; font-weight:800; letter-spacing:0.08em; background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--acc); border-radius:6px; padding:4px 8px; white-space:nowrap; }
.rp-top h3 { font-size:1rem; font-weight:700; line-height:1.3; }
.rp-top .spec { font-size:0.74rem; color:var(--dim); margin-top:2px; }
.rp h4 { font-size:0.68rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin:14px 0 6px; }
.rp ol, .rp ul { padding-left:20px; display:flex; flex-direction:column; gap:5px; font-size:0.9rem; line-height:1.6; }
.vars { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,180px),1fr)); gap:8px; }
.var { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:0.84rem; min-width:0; }
.var b { display:block; font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }

/* Quiz */
.quiz { max-width:680px; margin:0 auto; padding-block:40px 80px; }
.quiz-head { text-align:center; margin-bottom:34px; }
.quiz-head .page-sub { margin:0 auto; }
.prog-label { display:flex; justify-content:space-between; font-size:0.74rem; color:var(--dim); margin-bottom:8px; font-variant-numeric:tabular-nums; }
.prog { background:var(--surface); border-radius:99px; height:6px; margin-bottom:26px; overflow:hidden; }
.prog > div { height:100%; background:var(--acc); border-radius:99px; transition:width .4s ease; }
.q-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:26px; margin-bottom:18px; }
.q-num { font-size:0.68rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:10px; display:flex; justify-content:space-between; }
.q-timer { color:var(--acc); font-variant-numeric:tabular-nums; }
.q-timer.warn { color:var(--wrong); }
.q-text { font-size:1.04rem; font-weight:600; line-height:1.5; margin-bottom:20px; }
.options { display:flex; flex-direction:column; gap:10px; }
.option { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:0.9rem; font-weight:500; cursor:pointer; text-align:left; color:var(--text); display:flex; align-items:center; gap:12px; line-height:1.45; }
.option:hover:not(:disabled) { border-color:var(--border-hi); background:var(--card-hover); }
.option:disabled { cursor:default; }
.option.correct { border-color:var(--correct); background:var(--correct-bg); color:var(--correct); }
.option.wrong { border-color:var(--wrong); background:var(--wrong-bg); color:var(--wrong); }
.letter { width:24px; height:24px; border-radius:6px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; flex-shrink:0; }
.option.correct .letter { background:var(--correct); border-color:var(--correct); color:var(--on-accent); }
.option.wrong .letter { background:var(--wrong); border-color:var(--wrong); color:var(--on-accent); }
.feedback { margin-top:14px; padding:12px 16px; border-radius:8px; font-size:0.87rem; line-height:1.6; }
.feedback.correct { background:var(--correct-bg); border:1px solid var(--correct); }
.feedback.wrong { background:var(--wrong-bg); border:1px solid var(--wrong); }
.feedback b { color:var(--correct); }
.feedback.wrong b { color:var(--wrong); }
.quiz-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.key-hint { font-size:0.72rem; color:var(--dim); }
.btn-next { background:var(--acc); color:var(--on-accent); border:none; border-radius:10px; padding:11px 26px; font-size:0.88rem; font-weight:700; cursor:pointer; margin-left:auto; }
.result { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px 24px; text-align:center; }
.result-score { font-size:3.4rem; font-weight:800; letter-spacing:-0.04em; color:var(--acc); line-height:1; font-variant-numeric:tabular-nums; }
.result-pct { color:var(--muted); margin:6px 0 4px; }
.result-msg { font-size:1.04rem; font-weight:600; margin-bottom:24px; }
.result .actions { justify-content:center; }
.btn.warn { color:var(--wrong); border-color:var(--wrong); background:var(--wrong-bg); }

.footer { text-align:center; padding-block:26px 44px; border-top:1px solid var(--border); color:var(--dim); font-size:0.76rem; }

@media (max-width:540px) {
  .hero { padding-block:44px 36px; }
  .stats { display:flex; width:100%; }
  .stat { flex:1; padding:12px 8px; }
  .brand span { display:none; }
  .q-card { padding:20px 16px; }
}
</style>

each molecule **gains a proton**, giving MH⁺) or by **electron impact** (high-energy electrons knock out an electron, giving X⁺).", "**Acceleration**: an electric field gives all ions the **same kinetic energy**.", "**Ion drift**: lighter ions travel faster, so they reach the detector first.", "**Detection**: ions hit the detector and gain an electron, creating a current proportional to their **abundance**.", "`KE = ½mv²`, so `v = √(2KE ÷ m)` and `t = d ÷ v`."]}, {"h": "Relative atomic mass", "p": ["**Relative atomic mass (Ar)**: the weighted mean mass of an atom of an element relative to **1/12 of the mass of an atom of carbon-12**.", "`Ar = Σ(isotope mass × abundance) ÷ Σ abundance`", "Mass spectra of diatomic molecules like Cl₂ show peaks for each combination, e.g. ³⁵Cl³⁵Cl, ³⁵Cl³⁷Cl and ³⁷Cl³⁷Cl at m/z 70, 72 and 74."]}, {"h": "Electron configuration", "p": ["Shells contain **sub-levels** s, p, d and f, which hold 2, 6, 10 and 14 electrons. Each orbital holds **2 electrons** with opposite spins.", "Fill in order: 1s 2s 2p 3s 3p **4s 3d** 4p. The 4s fills before 3d, but 4s electrons are **lost first** when ions form.", "Exceptions: **Cr** is [Ar] 3d⁵ 4s¹ and **Cu** is [Ar] 3d¹⁰ 4s¹."]}, {"h": "Ionisation energy", "p": ["**First ionisation energy**: the energy needed to remove **one mole of electrons** from **one mole of gaseous atoms**, forming 1+ ions. `X(g) → X⁺(g) + e⁻`", "It depends on **nuclear charge**, **distance** of the outer electron from the nucleus, and **shielding** by inner electrons.", "**Down a group**: decreases, because outer electrons are further away and more shielded, despite more protons.", "**Across a period**: generally increases, because nuclear charge increases, with similar shielding and a slightly smaller radius.", "**Dip from Group 2 to 3** (e.g. Mg to Al): the electron removed from Al is in a **3p** sub-level, higher in energy and slightly more shielded than 3s.", "**Dip from Group 5 to 6** (e.g. P to S): in S, the electron is removed from a **3p orbital containing a pair**, and **repulsion** between the paired electrons makes it easier to remove.", "**Successive ionisation energies** show a large jump when an electron is removed from a new, inner shell. This shows which group an element is in."]}], "pitfalls": ["Include **gaseous** and state symbols in ionisation energy definitions and equations.", "Transition metals lose **4s electrons before 3d** when forming ions.", "For the Group 2→3 dip, mention the **p sub-level**. For the 5→6 dip, mention **pair repulsion**.", "In electrospray, molecules gain a proton (**M + H**), so the peak is 1 unit above Mr."], "questions": [{"q": "What is the relative charge and mass of a neutron?", "o": ["Charge +1, mass 1", "Charge 0, mass 1", "Charge −1, mass 1/1836", "Charge 0, mass 1/1836"], "a": 1, "e": "Neutrons are neutral and have a relative mass of 1, the same as a proton."}, {"q": "What are isotopes?", "o": ["Atoms with the same number of protons but different numbers of neutrons", "Atoms with different numbers of protons", "Ions with different charges", "Molecules with the same formula"], "a": 0, "e": "Isotopes of an element have the same atomic number but different mass numbers."}, {"q": "Why do isotopes of an element have the same chemical properties?", "o": ["They have the same mass", "They have the same number of neutrons", "They have the same electron configuration", "They have the same density"], "a": 2, "e": "Chemical reactions involve electrons. Isotopes have the same number and arrangement of electrons."}, {"q": "In electrospray ionisation, what happens to the sample molecules?", "o": ["They lose an electron", "They are bombarded with electrons", "They are heated until they break", "They gain a proton, forming MH⁺ ions"], "a": 3, "e": "In electrospray, the high voltage causes each molecule to gain a proton: M + H⁺ → MH⁺."}, {"q": "In TOF mass spectrometry, why do lighter ions reach the detector first?", "o": ["All ions have the same kinetic energy, so lighter ions travel faster", "Lighter ions have a larger charge", "They are deflected less", "They are produced first"], "a": 0, "e": "KE = ½mv². With the same KE, a smaller mass means a higher velocity, so a shorter flight time."}, {"q": "How is a current produced at the detector in TOF mass spectrometry?", "o": ["Ions lose an electron at the detector", "Ions gain an electron at the detector", "Ions are deflected by a magnet", "Ions emit light"], "a": 1, "e": "Positive ions gain electrons when they hit the detector. The current is proportional to abundance."}, {"q": "What is the definition of relative atomic mass?", "o": ["The mass of one atom in grams", "The number of protons and neutrons", "The weighted mean mass of an atom of an element relative to 1/12 the mass of a carbon-12 atom", "The mass of the most common isotope"], "a": 2, "e": "Ar is a weighted average of the isotopes, compared with 1/12 of the mass of a carbon-12 atom."}, {"q": "Chlorine is 75% ³⁵Cl and 25% ³⁷Cl. What is its relative atomic mass?", "o": ["36.0", "35.0", "37.0", "35.5"], "a": 3, "e": "Ar = (35 × 75 + 37 × 25) ÷ 100 = 35.5."}, {"q": "A mass spectrum of Cl₂ shows peaks at m/z 70, 72 and 74. What causes three peaks?", "o": ["Different combinations of ³⁵Cl and ³⁷Cl in the molecule", "Fragmentation of Cl₂", "Cl⁺ and Cl²⁺ ions", "Impurities"], "a": 0, "e": "³⁵Cl–³⁵Cl = 70, ³⁵Cl–³⁷Cl = 72, ³⁷Cl–³⁷Cl = 74."}, {"q": "What is the electron configuration of Fe²⁺?", "o": ["[Ar] 3d⁴ 4s²", "[Ar] 3d⁶", "[Ar] 3d⁶ 4s²", "[Ar] 3d⁵ 4s¹"], "a": 1, "e": "Fe is [Ar] 3d⁶ 4s². The two 4s electrons are lost first, giving [Ar] 3d⁶."}, {"q": "What is the electron configuration of a chromium atom?", "o": ["[Ar] 3d⁴ 4s²", "[Ar] 3d⁶", "[Ar] 3d⁵ 4s¹", "[Ar] 4s² 3d⁵"], "a": 2, "e": "Chromium is an exception: [Ar] 3d⁵ 4s¹, because a half-filled d sub-level is more stable."}, {"q": "How many electrons can a d sub-level hold?", "o": ["2", "6", "14", "10"], "a": 3, "e": "A d sub-level has 5 orbitals, each holding 2 electrons, so 10 electrons."}, {"q": "Which equation represents the first ionisation energy of sodium?", "o": ["Na(g) → Na⁺(g) + e⁻", "Na(s) → Na⁺(g) + e⁻", "Na(g) + e⁻ → Na⁻(g)", "Na(s) → Na⁺(aq) + e⁻"], "a": 0, "e": "First ionisation energy involves gaseous atoms forming gaseous 1+ ions."}, {"q": "Why does first ionisation energy decrease down Group 1?", "o": ["Nuclear charge decreases", "The outer electron is further from the nucleus and more shielded", "There are fewer electrons", "Atoms get smaller"], "a": 1, "e": "Although the nuclear charge increases, the extra shells increase distance and shielding, so attraction for the outer electron falls."}, {"q": "Why does first ionisation energy generally increase across a period?", "o": ["Shielding increases greatly", "Atoms get larger", "Nuclear charge increases with similar shielding, so the outer electrons are held more strongly", "Electrons are added to new shells"], "a": 2, "e": "Protons are added but electrons go into the same shell, so shielding is similar and attraction increases."}, {"q": "Why is the first ionisation energy of aluminium lower than that of magnesium?", "o": ["Aluminium has fewer protons", "Aluminium's outer electron is paired", "Aluminium is in a new shell", "Aluminium's outer electron is in a 3p sub-level, which is higher in energy than 3s"], "a": 3, "e": "The 3p electron is higher in energy and slightly more shielded by the 3s electrons, so less energy is needed."}, {"q": "Why is the first ionisation energy of sulfur lower than that of phosphorus?", "o": ["In sulfur, the electron is removed from a 3p orbital containing a pair, and repulsion between the paired electrons makes it easier to remove", "Sulfur has fewer protons", "Sulfur's outer electron is in a 4s orbital", "Sulfur is a larger atom"], "a": 0, "e": "Phosphorus has three unpaired 3p electrons. Sulfur has one paired 3p orbital, and electron repulsion lowers the energy needed."}, {"q": "The successive ionisation energies of an element show a large jump between the 2nd and 3rd. Which group is it in?", "o": ["Group 1", "Group 2", "Group 3", "Group 6"], "a": 1, "e": "Two electrons are removed easily, then the third comes from an inner shell. So the element has 2 outer electrons: Group 2."}, {"q": "Which order shows sub-levels filling in a potassium atom?", "o": ["1s 2s 2p 3s 3p 3d", "1s 2s 2p 3s 3p 4p", "1s 2s 2p 3s 3p 4s", "1s 2s 3s 2p 3p 4s"], "a": 2, "e": "4s fills before 3d, so K is 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹."}, {"q": "Which statement about the 4s and 3d sub-levels is correct?", "o": ["3d fills first and empties first", "4s fills after 3d", "4s and 3d fill at the same time", "4s fills before 3d, and 4s electrons are lost first when transition metals form ions"], "a": 3, "e": "4s is lower in energy for empty atoms, so it fills first. Once 3d is occupied, 4s electrons are removed first."}, {"q": "An ion has 16 protons, 18 electrons and 16 neutrons. What is it?", "o": ["³²S²⁻", "³²S²⁺", "³⁴S²⁻", "³²P³⁻"], "a": 0, "e": "16 protons is sulfur. Mass number = 16 + 16 = 32. Two extra electrons give a 2− charge."}, {"q": "An electrospray mass spectrum shows a molecular ion peak at m/z 47. What is the Mr of the compound?", "o": ["47", "46", "48", "23.5"], "a": 1, "e": "Electrospray adds a proton (mass 1), so the peak at 47 is MH⁺ and Mr = 46."}]}, {"id": "3.1.2", "order": 2, "year": 1, "section": "3.1", "spec": "3.1.2", "title": "Amount of substance", "desc": "Relative masses, the mole and Avogadro constant, the ideal gas equation, empirical and molecular formulae, yields, atom economy and titration calculations.", "practicals": [1], "summary": [{"h": "Relative masses and the mole", "p": ["**Relative molecular mass (Mr)**: the average mass of a molecule compared with 1/12 of the mass of a carbon-12 atom. **Relative formula mass** is used for ionic compounds.", "The **Avogadro constant (L)** is **6.022 × 10²³ mol⁻¹**: the number of particles in one mole.", "`moles = mass ÷ Mr`", "`number of particles = moles × 6.022 × 10²³`"]}, {"h": "Ideal gas equation", "p": ["`pV = nRT`", "**p** in **pascals (Pa)**, **V** in **m³**, **n** in mol, **R** = 8.31 J K⁻¹ mol⁻¹, **T** in **kelvin** (°C + 273).", "Conversions: 1 dm³ = 1 × 10⁻³ m³. 1 cm³ = 1 × 10⁻⁶ m³. 1 kPa = 1000 Pa."]}, {"h": "Solutions", "p": ["`moles = concentration (mol dm⁻³) × volume (dm³)`", "To convert cm³ to dm³, divide by **1000**.", "In a titration, use the balanced equation to find the **mole ratio** between the two reactants."]}, {"h": "Formulae and equations", "p": ["**Empirical formula**: the **simplest whole-number ratio** of atoms of each element in a compound.", "**Molecular formula**: the **actual number** of atoms of each element in a molecule.", "To find the empirical formula: divide mass (or %) of each element by its Ar, then divide by the smallest answer, then scale to whole numbers.", "Molecular formula = empirical formula × (Mr ÷ empirical formula mass).", "Balanced **ionic equations** show only the species that react, e.g. H⁺(aq) + OH⁻(aq) → H₂O(l)."]}, {"h": "Yield and atom economy", "p": ["`Percentage yield = (actual yield ÷ theoretical yield) × 100`", "`Percentage atom economy = (Mr of desired product ÷ sum of Mr of all reactants) × 100`", "High atom economy means less waste, which is better for **sustainability** and **cost**.", "Addition reactions have **100%** atom economy because there is only one product."]}], "pitfalls": ["In pV = nRT, convert **everything** to SI units: Pa, m³ and K. This is the most common error.", "Use the **mole ratio** from the balanced equation, not 1:1, in titration and yield calculations.", "Yield and atom economy are different: yield measures how much product you actually got; atom economy is from the equation.", "Round only at the end, and give answers to the same number of significant figures as the data."], "questions": [{"q": "How many moles are in 9.0 g of water (Mr = 18.0)?", "o": ["0.25 mol", "0.50 mol", "2.0 mol", "162 mol"], "a": 1, "e": "moles = mass ÷ Mr = 9.0 ÷ 18.0 = 0.50 mol."}, {"q": "What is the value of the Avogadro constant?", "o": ["6.022 × 10²³ mol⁻¹", "8.31 J K⁻¹ mol⁻¹", "6.022 × 10⁻²³ mol⁻¹", "1.66 × 10⁻²⁴ mol⁻¹"], "a": 0, "e": "L = 6.022 × 10²³ mol⁻¹, the number of particles in one mole of a substance."}, {"q": "How many molecules are in 0.25 mol of CO₂?", "o": ["6.022 × 10²³", "2.4 × 10²⁴", "1.5 × 10²³", "1.5 × 10²²"], "a": 2, "e": "Number = 0.25 × 6.022 × 10²³ = 1.5 × 10²³."}, {"q": "In pV = nRT, what are the units of V?", "o": ["dm³", "cm³", "litres", "m³"], "a": 3, "e": "SI units are used: V in m³, p in Pa, T in K."}, {"q": "Convert 250 cm³ into m³.", "o": ["2.5 × 10⁻⁴ m³", "0.25 m³", "2.5 × 10⁻¹ m³", "250 × 10⁻³ m³"], "a": 0, "e": "1 cm³ = 1 × 10⁻⁶ m³, so 250 cm³ = 2.5 × 10⁻⁴ m³."}, {"q": "What volume does 0.100 mol of gas occupy at 100 kPa and 300 K? (R = 8.31 J K⁻¹ mol⁻¹)", "o": ["24.9 m³", "2.49 × 10⁻³ m³", "2.49 × 10⁻² m³", "0.249 m³"], "a": 1, "e": "V = nRT ÷ p = (0.100 × 8.31 × 300) ÷ 100 000 = 2.49 × 10⁻³ m³ (2.49 dm³)."}, {"q": "How many moles are in 25.0 cm³ of 0.200 mol dm⁻³ HCl?", "o": ["5.00 mol", "0.0500 mol", "5.00 × 10⁻³ mol", "0.200 mol"], "a": 2, "e": "moles = 0.200 × (25.0 ÷ 1000) = 5.00 × 10⁻³ mol."}, {"q": "25.0 cm³ of NaOH is neutralised by 20.0 cm³ of 0.100 mol dm⁻³ H₂SO₄. What is the concentration of the NaOH?", "o": ["0.0800 mol dm⁻³", "0.100 mol dm⁻³", "0.0400 mol dm⁻³", "0.160 mol dm⁻³"], "a": 3, "e": "Moles H₂SO₄ = 0.100 × 0.0200 = 2.00 × 10⁻³. Ratio 2NaOH : 1H₂SO₄, so NaOH = 4.00 × 10⁻³ mol. Concentration = 4.00 × 10⁻³ ÷ 0.0250 = 0.160 mol dm⁻³."}, {"q": "What is an empirical formula?", "o": ["The simplest whole-number ratio of atoms of each element in a compound", "The actual number of atoms in a molecule", "The structural formula", "The formula of an ion"], "a": 0, "e": "The empirical formula gives the simplest ratio, e.g. CH₂ for ethene (C₂H₄)."}, {"q": "A compound contains 40.0% C, 6.7% H and 53.3% O by mass. What is its empirical formula?", "o": ["C₂H₄O", "CH₂O", "CHO", "CH₂O₂"], "a": 1, "e": "C: 40.0 ÷ 12.0 = 3.33. H: 6.7 ÷ 1.0 = 6.7. O: 53.3 ÷ 16.0 = 3.33. Divide by 3.33: 1 : 2 : 1, so CH₂O."}, {"q": "A compound has the empirical formula CH₂O and Mr = 180. What is its molecular formula?", "o": ["CH₂O", "C₃H₆O₃", "C₆H₁₂O₆", "C₂H₄O₂"], "a": 2, "e": "Empirical formula mass = 30. 180 ÷ 30 = 6, so the molecular formula is C₆H₁₂O₆."}, {"q": "The theoretical yield of a product is 12.0 g. The actual yield is 9.0 g. What is the percentage yield?", "o": ["133%", "25%", "3.0%", "75%"], "a": 3, "e": "Percentage yield = (9.0 ÷ 12.0) × 100 = 75%."}, {"q": "How is percentage atom economy calculated?", "o": ["(Mr of desired product ÷ sum of Mr of all reactants) × 100", "(actual yield ÷ theoretical yield) × 100", "(moles of product ÷ moles of reactant) × 100", "(mass of reactants ÷ mass of products) × 100"], "a": 0, "e": "Atom economy measures what proportion of the reactant atoms end up in the useful product."}, {"q": "Why do addition reactions have 100% atom economy?", "o": ["They are always fast", "All the reactant atoms end up in the single product", "They have no catalyst", "They are exothermic"], "a": 1, "e": "There are no by-products, so every atom in the reactants is in the desired product."}, {"q": "CaCO₃ → CaO + CO₂. What is the atom economy for making CaO? (Mr: CaCO₃ = 100, CaO = 56)", "o": ["44%", "100%", "56%", "78%"], "a": 2, "e": "Atom economy = (56 ÷ 100) × 100 = 56%."}, {"q": "Why might the percentage yield of a reaction be less than 100%?", "o": ["The atom economy is low", "The reaction is exothermic", "The equation is balanced", "Some product is lost during separation, side reactions occur, or the reaction is reversible"], "a": 3, "e": "Losses in transfers and purification, competing reactions and incomplete reactions all reduce yield."}, {"q": "What mass of MgO forms when 4.8 g of Mg burns completely? (2Mg + O₂ → 2MgO; Ar Mg = 24, O = 16)", "o": ["8.0 g", "4.8 g", "16 g", "6.4 g"], "a": 0, "e": "Moles Mg = 4.8 ÷ 24 = 0.20. Ratio 1:1, so 0.20 mol MgO. Mass = 0.20 × 40 = 8.0 g."}, {"q": "Which is the correct ionic equation for the reaction of an acid with an alkali?", "o": ["HCl + NaOH → NaCl + H₂O", "H⁺(aq) + OH⁻(aq) → H₂O(l)", "Na⁺ + Cl⁻ → NaCl", "H₂ + O₂ → H₂O"], "a": 1, "e": "Spectator ions (Na⁺, Cl⁻) are left out. Only H⁺ and OH⁻ react."}, {"q": "A gas occupies 500 cm³ at 20 °C. In pV = nRT, what values should be used for V and T?", "o": ["500 and 20", "0.500 and 293", "5.00 × 10⁻⁴ and 293", "5.00 × 10⁻⁴ and 20"], "a": 2, "e": "500 cm³ = 5.00 × 10⁻⁴ m³. 20 °C = 293 K."}, {"q": "What is the relative formula mass of CaCO₃? (Ca = 40.1, C = 12.0, O = 16.0)", "o": ["68.1", "84.1", "116.1", "100.1"], "a": 3, "e": "40.1 + 12.0 + (3 × 16.0) = 100.1."}, {"q": "What is the concentration in mol dm⁻³ of a solution with 5.85 g NaCl (Mr = 58.5) in 250 cm³?", "o": ["0.400 mol dm⁻³", "0.100 mol dm⁻³", "0.0250 mol dm⁻³", "23.4 mol dm⁻³"], "a": 0, "e": "Moles = 5.85 ÷ 58.5 = 0.100. Concentration = 0.100 ÷ 0.250 = 0.400 mol dm⁻³."}, {"q": "Why is a high atom economy important in industry?", "o": ["It increases reaction rate", "It means less waste is produced, which is more sustainable and cheaper", "It always gives a high yield", "It lowers activation energy"], "a": 1, "e": "Fewer by-products means less waste to dispose of and better use of raw materials."}]}, {"id": "3.1.3", "order": 3, "year": 1, "section": "3.1", "spec": "3.1.3", "title": "Bonding", "desc": "Ionic, covalent, dative and metallic bonding, crystal structures, shapes of molecules, electronegativity and polarity, and intermolecular forces.", "practicals": [], "summary": [{"h": "Ionic, covalent and metallic bonding", "p": ["**Ionic bonding**: electrostatic attraction between oppositely charged ions in a lattice.", "**Covalent bond**: a shared pair of electrons. **Dative (coordinate) bond**: a shared pair where **both electrons come from the same atom**, shown with an arrow, e.g. in NH₄⁺.", "**Metallic bonding**: attraction between **positive metal ions** and **delocalised electrons**.", "Learn ion formulae: e.g. sulfate SO₄²⁻, hydroxide OH⁻, nitrate NO₃⁻, carbonate CO₃²⁻, ammonium NH₄⁺."]}, {"h": "Structures and properties", "p": ["**Ionic** (e.g. NaCl): high melting point (strong attractions throughout the lattice). Conducts when **molten or dissolved**, because ions can move.", "**Metallic** (e.g. Mg): high melting point. Conducts as **solid and liquid** (delocalised electrons). Malleable, because layers of ions can slide.", "**Simple molecular** (e.g. I₂, ice): low melting point. Only weak **intermolecular forces** need breaking, not covalent bonds. Doesn't conduct.", "**Macromolecular / giant covalent** (e.g. diamond, graphite): very high melting point, because many **strong covalent bonds** must break. Graphite conducts (delocalised electrons between layers). Diamond doesn't."]}, {"h": "Shapes of molecules (VSEPR)", "p": ["Electron pairs around the central atom **repel** each other and arrange themselves as far apart as possible.", "**Lone pairs repel more** than bonding pairs, reducing bond angles by about **2.5°** per lone pair.", "2 bonding pairs: **linear**, 180°. 3: **trigonal planar**, 120°. 4: **tetrahedral**, 109.5°. 5: **trigonal bipyramidal**, 90° and 120°. 6: **octahedral**, 90°.", "3 bonding + 1 lone pair (NH₃): **pyramidal**, 107°. 2 bonding + 2 lone pairs (H₂O): **bent**, 104.5°."]}, {"h": "Electronegativity and polarity", "p": ["**Electronegativity**: the power of an atom to attract the pair of electrons in a covalent bond. Increases across a period and up a group. **Fluorine** is the most electronegative.", "A difference in electronegativity makes a bond **polar** (δ+ and δ−).", "A molecule is **polar** only if its bond dipoles **don't cancel**. CO₂ has polar bonds but is non-polar, because it is linear and symmetrical."]}, {"h": "Intermolecular forces", "p": ["**Van der Waals (induced dipole–dipole)**: between all molecules. Electrons move, creating a temporary dipole, which induces a dipole in a neighbour. Stronger with **more electrons** (bigger molecules) and more surface contact.", "**Permanent dipole–dipole**: between polar molecules.", "**Hydrogen bonding**: the strongest. Between an H atom bonded to **N, O or F** and a **lone pair** on N, O or F of another molecule.", "Hydrogen bonding explains why water has an anomalously high boiling point, and why **ice is less dense** than water (open lattice).", "Boiling points depend on the **strength of intermolecular forces** for simple molecular substances."]}], "pitfalls": ["When a simple molecular substance melts or boils, **intermolecular forces** break, not covalent bonds.", "Draw hydrogen bonds with the **lone pair**, partial charges, and a 180° angle at H.", "Polar bonds don't always give a polar molecule: check the **symmetry**.", "Name both shape and bond angle, and explain using **repulsion** between electron pairs."], "questions": [{"q": "What is a dative covalent bond?", "o": ["A shared pair of electrons where both electrons come from the same atom", "A bond between two ions", "A bond with three shared pairs", "A hydrogen bond"], "a": 0, "e": "In a dative bond, one atom donates both electrons, e.g. the N–H⁺ bond formed in NH₄⁺."}, {"q": "What is metallic bonding?", "o": ["Attraction between ions of opposite charge", "Attraction between positive metal ions and delocalised electrons", "Shared pairs between metal atoms", "Hydrogen bonding in metals"], "a": 1, "e": "Metal atoms lose outer electrons, which become delocalised and attract the lattice of positive ions."}, {"q": "Why does sodium chloride conduct electricity when molten but not when solid?", "o": ["Electrons are free when molten", "Covalent bonds break when molten", "In the molten state, ions are free to move and carry charge", "Solid NaCl contains no ions"], "a": 2, "e": "In the solid, ions are fixed in the lattice. Melting frees them to move."}, {"q": "Why does iodine have a low melting point?", "o": ["Covalent bonds in I₂ are weak", "It is ionic", "It is a giant covalent structure", "Only weak intermolecular forces between molecules need to be overcome"], "a": 3, "e": "Iodine is simple molecular. Melting overcomes van der Waals forces, not the I–I covalent bond."}, {"q": "Why does graphite conduct electricity?", "o": ["Each carbon has one delocalised electron, which can move between layers", "It contains ions", "It is a metal", "Its covalent bonds break easily"], "a": 0, "e": "Each C forms 3 covalent bonds, leaving one electron delocalised along the layers."}, {"q": "Why does diamond have a very high melting point?", "o": ["Strong intermolecular forces", "Many strong covalent bonds must be broken", "It contains ions", "It has delocalised electrons"], "a": 1, "e": "Diamond is macromolecular: each C is bonded to 4 others in a giant network of strong covalent bonds."}, {"q": "What is the shape and bond angle of NH₃?", "o": ["Trigonal planar, 120°", "Tetrahedral, 109.5°", "Pyramidal, 107°", "Bent, 104.5°"], "a": 2, "e": "NH₃ has 3 bonding pairs and 1 lone pair. The lone pair repels more, reducing the angle from 109.5° to 107°."}, {"q": "What is the shape and bond angle of H₂O?", "o": ["Linear, 180°", "Pyramidal, 107°", "Tetrahedral, 109.5°", "Bent, 104.5°"], "a": 3, "e": "Water has 2 bonding pairs and 2 lone pairs. Two lone pairs reduce the angle to about 104.5°."}, {"q": "What is the shape of SF₆?", "o": ["Octahedral", "Trigonal bipyramidal", "Tetrahedral", "Square planar"], "a": 0, "e": "Six bonding pairs and no lone pairs give an octahedral shape with 90° bond angles."}, {"q": "What is the shape of BF₃?", "o": ["Pyramidal", "Trigonal planar", "Tetrahedral", "Linear"], "a": 1, "e": "Boron has 3 bonding pairs and no lone pairs, so they spread out at 120° in a plane."}, {"q": "Why do lone pairs reduce bond angles?", "o": ["They attract bonding pairs", "They are further from the nucleus", "Lone pairs repel more strongly than bonding pairs", "They form extra bonds"], "a": 2, "e": "Lone pair–lone pair repulsion > lone pair–bonding pair > bonding pair–bonding pair."}, {"q": "What is electronegativity?", "o": ["The energy to remove an electron", "The charge on an ion", "The number of electrons in the outer shell", "The power of an atom to attract the pair of electrons in a covalent bond"], "a": 3, "e": "Electronegativity increases with nuclear charge and decreases with distance and shielding."}, {"q": "Why is CO₂ a non-polar molecule, even though C=O bonds are polar?", "o": ["It is linear and symmetrical, so the bond dipoles cancel", "Carbon and oxygen have the same electronegativity", "It has lone pairs", "It is an ionic compound"], "a": 0, "e": "The two dipoles point in opposite directions and cancel out."}, {"q": "What causes van der Waals forces between molecules?", "o": ["Permanent dipoles", "Temporary dipoles from electron movement, inducing dipoles in neighbouring molecules", "Shared pairs of electrons", "Attraction between ions"], "a": 1, "e": "Uneven electron distribution creates a temporary dipole, which induces a dipole in a nearby molecule."}, {"q": "Why does the boiling point increase down the noble gases?", "o": ["Covalent bonds get stronger", "Hydrogen bonding increases", "More electrons means stronger van der Waals forces", "Atoms get smaller"], "a": 2, "e": "Larger atoms have more electrons, so bigger temporary dipoles and stronger induced dipole–dipole forces."}, {"q": "Which conditions are needed for hydrogen bonding?", "o": ["H bonded to any non-metal", "Ions in solution", "Carbon bonded to hydrogen", "H bonded to N, O or F, and a lone pair on N, O or F of another molecule"], "a": 3, "e": "Only N, O and F are electronegative enough to make H sufficiently δ+, and they have lone pairs."}, {"q": "Why does water have a higher boiling point than H₂S?", "o": ["Water forms hydrogen bonds between molecules, which are stronger than the forces between H₂S molecules", "H₂S has fewer electrons", "Water is ionic", "O–H covalent bonds are stronger"], "a": 0, "e": "Water forms hydrogen bonds. H₂S has only weaker van der Waals and permanent dipole forces, despite having more electrons."}, {"q": "Why is ice less dense than liquid water?", "o": ["Ice has more molecules", "Hydrogen bonds hold molecules in an open lattice, further apart than in liquid water", "Ice contains air", "Covalent bonds lengthen"], "a": 1, "e": "In ice, each molecule forms hydrogen bonds in a fixed open structure, taking up more space."}, {"q": "Why are metals malleable?", "o": ["Ions are held by strong ionic bonds", "Electrons are fixed", "Layers of positive ions can slide over each other while still attracted to delocalised electrons", "Covalent bonds are flexible"], "a": 2, "e": "The delocalised electrons keep bonding the ions together even when layers move."}, {"q": "What is the bond angle in a tetrahedral molecule such as CH₄?", "o": ["90°", "107°", "120°", "109.5°"], "a": 3, "e": "Four bonding pairs and no lone pairs arrange tetrahedrally at 109.5°."}, {"q": "Which molecule is polar?", "o": ["HCl", "CO₂", "CH₄", "BF₃"], "a": 0, "e": "HCl has one polar bond and nothing to cancel it. The others are symmetrical, so their dipoles cancel."}, {"q": "What is the formula of the sulfate ion?", "o": ["SO₃²⁻", "SO₄²⁻", "S²⁻", "HSO₄⁻"], "a": 1, "e": "Sulfate is SO₄²⁻. SO₃²⁻ is sulfite, and HSO₄⁻ is hydrogensulfate."}]}, {"id": "3.1.4", "order": 4, "year": 1, "section": "3.1", "spec": "3.1.4", "title": "Energetics", "desc": "Enthalpy change, standard conditions, enthalpies of combustion and formation, calorimetry, Hess's law and mean bond enthalpies.", "practicals": [2], "summary": [{"h": "Enthalpy change", "p": ["**Enthalpy change (ΔH)**: the heat energy change measured under conditions of **constant pressure**.", "**Exothermic**: ΔH is **negative**; heat is released to the surroundings. **Endothermic**: ΔH is **positive**; heat is taken in.", "**Standard conditions**: **100 kPa** and a stated temperature, usually **298 K**. Substances in their standard states. Shown as ΔH⦵."]}, {"h": "Standard enthalpy definitions", "p": ["**Standard enthalpy of combustion (ΔcH⦵)**: the enthalpy change when **1 mole** of a substance is **completely burned in oxygen**, with all reactants and products in their standard states, under standard conditions.", "**Standard enthalpy of formation (ΔfH⦵)**: the enthalpy change when **1 mole** of a compound is formed **from its elements**, with all reactants and products in their standard states, under standard conditions.", "ΔfH⦵ of an **element** in its standard state is **zero**."]}, {"h": "Calorimetry", "p": ["`q = m c ΔT`", "q = heat energy (J), m = mass of the **substance being heated**, usually water (g), c = specific heat capacity (4.18 J g⁻¹ K⁻¹ for water), ΔT = temperature change (K).", "`ΔH = −q ÷ n`, where n is moles of the limiting reactant (or fuel burned). Convert J to kJ by dividing by 1000.", "Experimental values are less exothermic than data-book values mainly because of **heat loss** and **incomplete combustion**."]}, {"h": "Hess's law", "p": ["**Hess's law**: the enthalpy change of a reaction is **independent of the route** taken, provided the start and end conditions are the same.", "Using formation data: `ΔH = Σ ΔfH(products) − Σ ΔfH(reactants)`", "Using combustion data: `ΔH = Σ ΔcH(reactants) − Σ ΔcH(products)`", "Multiply each value by the number of moles in the balanced equation."]}, {"h": "Bond enthalpies", "p": ["**Mean bond enthalpy**: the energy needed to **break one mole** of a covalent bond in **gaseous** molecules, **averaged** over a range of compounds.", "Bond breaking is **endothermic**. Bond making is **exothermic**.", "`ΔH = Σ(bonds broken) − Σ(bonds made)`", "Values calculated from mean bond enthalpies differ from data-book values because they are **averages**, not specific to the molecule in the reaction."]}], "pitfalls": ["In q = mcΔT, m is the mass of the **water or solution**, not the mass of the fuel.", "Always give a **sign** with ΔH, and units of kJ mol⁻¹.", "Formation: products minus reactants. Combustion: **reactants minus products**. Don't mix them up.", "Mean bond enthalpies only apply to **gases**."], "questions": [{"q": "What does a negative value of ΔH show?", "o": ["The reaction is endothermic", "The reaction is exothermic and releases heat to the surroundings", "No energy change", "The reaction is slow"], "a": 1, "e": "Negative ΔH means the products have less enthalpy than the reactants, so energy has been released."}, {"q": "What are standard conditions for enthalpy changes?", "o": ["100 kPa and a stated temperature, usually 298 K", "101 kPa and 273 K", "1 atm and 0 °C", "100 Pa and 25 K"], "a": 0, "e": "Standard conditions are 100 kPa, with a stated temperature, normally 298 K."}, {"q": "What is the standard enthalpy of formation of O₂(g)?", "o": ["−286 kJ mol⁻¹", "+498 kJ mol⁻¹", "0 kJ mol⁻¹", "It depends on temperature"], "a": 2, "e": "The enthalpy of formation of any element in its standard state is zero by definition."}, {"q": "Which equation represents the standard enthalpy of formation of water?", "o": ["2H₂(g) + O₂(g) → 2H₂O(l)", "H₂O(l) → H₂(g) + ½O₂(g)", "H₂(g) + O₂(g) → H₂O₂(l)", "H₂(g) + ½O₂(g) → H₂O(l)"], "a": 3, "e": "Formation is for 1 mole of product, formed from its elements in their standard states."}, {"q": "Which equation represents the standard enthalpy of combustion of methane?", "o": ["CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l)", "C(s) + 2H₂(g) → CH₄(g)", "2CH₄(g) + 4O₂(g) → 2CO₂(g) + 4H₂O(l)", "CH₄(g) + O₂(g) → C(s) + 2H₂O(l)"], "a": 0, "e": "Combustion is for 1 mole of substance completely burned in oxygen."}, {"q": "100 g of water rises by 10.0 K. How much heat energy was absorbed? (c = 4.18 J g⁻¹ K⁻¹)", "o": ["418 J", "4180 J", "41.8 J", "41 800 J"], "a": 1, "e": "q = mcΔT = 100 × 4.18 × 10.0 = 4180 J (4.18 kJ)."}, {"q": "Burning 0.0100 mol of fuel heats water, releasing 6.00 kJ. What is ΔcH?", "o": ["+600 kJ mol⁻¹", "−60.0 kJ mol⁻¹", "−600 kJ mol⁻¹", "−0.0600 kJ mol⁻¹"], "a": 2, "e": "ΔH = −q ÷ n = −6.00 ÷ 0.0100 = −600 kJ mol⁻¹. Negative because heat was released."}, {"q": "Why are experimental enthalpies of combustion usually less exothermic than data-book values?", "o": ["Too much fuel is burned", "The thermometer is too accurate", "Water has a low heat capacity", "Heat is lost to the surroundings and combustion may be incomplete"], "a": 3, "e": "Not all the heat released goes into the water, and incomplete combustion releases less energy."}, {"q": "What is Hess's law?", "o": ["The enthalpy change of a reaction is independent of the route taken", "Energy is always released in reactions", "Bond breaking is exothermic", "ΔH equals q"], "a": 0, "e": "Whatever route is used to go from reactants to products, the overall enthalpy change is the same."}, {"q": "Using formation enthalpies, how is ΔH for a reaction calculated?", "o": ["Σ ΔfH(reactants) − Σ ΔfH(products)", "Σ ΔfH(products) − Σ ΔfH(reactants)", "Σ ΔfH(products) + Σ ΔfH(reactants)", "Σ ΔfH(products) × Σ ΔfH(reactants)"], "a": 1, "e": "Products minus reactants, each multiplied by its number of moles."}, {"q": "Using combustion enthalpies, how is ΔH for a reaction calculated?", "o": ["Σ ΔcH(products) − Σ ΔcH(reactants)", "Σ ΔcH(products) + Σ ΔcH(reactants)", "Σ ΔcH(reactants) − Σ ΔcH(products)", "It can't be calculated"], "a": 2, "e": "With combustion data, the route goes through the combustion products, so it's reactants minus products."}, {"q": "ΔfH: CO₂(g) = −394, H₂O(l) = −286, CH₄(g) = −75 kJ mol⁻¹. What is ΔcH of CH₄?", "o": ["−605 kJ mol⁻¹", "−755 kJ mol⁻¹", "+891 kJ mol⁻¹", "−891 kJ mol⁻¹"], "a": 3, "e": "ΔH = [−394 + 2(−286)] − [−75 + 0] = −966 + 75 = −891 kJ mol⁻¹."}, {"q": "What is mean bond enthalpy?", "o": ["The energy to break one mole of a bond in gaseous molecules, averaged over a range of compounds", "The energy released when a bond forms in a liquid", "The energy of one bond in one molecule", "The enthalpy of formation of a bond"], "a": 0, "e": "Mean bond enthalpies are averages, so they're approximate for any particular molecule."}, {"q": "Is breaking bonds exothermic or endothermic?", "o": ["Exothermic", "Endothermic", "Neither", "It depends on the bond"], "a": 1, "e": "Energy must be put in to overcome the attraction between the bonded atoms, so bond breaking is endothermic."}, {"q": "Using bond enthalpies, how is ΔH calculated?", "o": ["Σ bonds made − Σ bonds broken", "Σ bonds broken + Σ bonds made", "Σ bonds broken − Σ bonds made", "Σ bonds made ÷ Σ bonds broken"], "a": 2, "e": "Energy in (bonds broken) minus energy out (bonds made)."}, {"q": "H₂ + Cl₂ → 2HCl. Bond enthalpies: H–H 436, Cl–Cl 243, H–Cl 432 kJ mol⁻¹. What is ΔH?", "o": ["+247 kJ mol⁻¹", "−432 kJ mol⁻¹", "+185 kJ mol⁻¹", "−185 kJ mol⁻¹"], "a": 3, "e": "Broken: 436 + 243 = 679. Made: 2 × 432 = 864. ΔH = 679 − 864 = −185 kJ mol⁻¹."}, {"q": "Why do values calculated from mean bond enthalpies differ from accurate data-book values?", "o": ["Mean bond enthalpies are averages, not exact for the bonds in that particular molecule", "They include heat loss", "Bonds don't break in reactions", "Data-book values are always wrong"], "a": 0, "e": "The strength of a bond varies slightly depending on the molecule it's in."}, {"q": "In q = mcΔT for a neutralisation in a cup, what is m?", "o": ["The mass of the acid", "The total mass of the solution being heated, often taken as its volume in cm³", "The mass of the cup", "The mass of the salt formed"], "a": 1, "e": "m is the mass of solution that changes temperature. Assume a density of 1.00 g cm⁻³."}, {"q": "In RP2, why is the temperature–time graph extrapolated back to the time of mixing?", "o": ["To find the starting temperature", "To increase accuracy of the clock", "To estimate the maximum temperature change, correcting for heat lost while the reaction was happening", "To find the rate"], "a": 2, "e": "The solution starts cooling while the reaction is still finishing. Extrapolating corrects for this."}, {"q": "Why is a polystyrene cup used in calorimetry?", "o": ["It is cheap", "It reacts with nothing", "It is transparent", "It is a good insulator and has a low heat capacity"], "a": 3, "e": "Polystyrene reduces heat loss and absorbs little heat itself."}, {"q": "What is the enthalpy change when 1 mole of a compound is formed from its elements under standard conditions?", "o": ["Standard enthalpy of formation", "Standard enthalpy of combustion", "Bond enthalpy", "Enthalpy of neutralisation"], "a": 0, "e": "This is the definition of the standard enthalpy of formation, ΔfH⦵."}, {"q": "50.0 cm³ of solution rises by 6.0 K in a neutralisation producing 0.0500 mol of water. What is ΔH? (c = 4.18 J g⁻¹ K⁻¹)", "o": ["+25 kJ mol⁻¹", "−25 kJ mol⁻¹", "−1.25 kJ mol⁻¹", "−50 kJ mol⁻¹"], "a": 1, "e": "q = 50.0 × 4.18 × 6.0 = 1254 J = 1.254 kJ. ΔH = −1.254 ÷ 0.0500 = −25 kJ mol⁻¹."}]}, {"id": "3.1.5", "order": 5, "year": 1, "section": "3.1", "spec": "3.1.5", "title": "Kinetics", "desc": "Collision theory, activation energy, the Maxwell–Boltzmann distribution, and the effect of temperature, concentration, pressure and catalysts on rate.", "practicals": [3], "summary": [{"h": "Collision theory", "p": ["Reactions only happen when particles **collide** with **sufficient energy** (at least the **activation energy**) and the correct orientation.", "**Activation energy (Ea)**: the **minimum energy** particles need to collide for a reaction to occur.", "Most collisions don't lead to a reaction.", "**Rate of reaction**: the change in concentration (or amount) of a reactant or product per unit time. Found from the **gradient** of a concentration–time graph."]}, {"h": "Maxwell–Boltzmann distribution", "p": ["Shows the distribution of **molecular energies** in a gas. The curve starts at the **origin**, has a peak (most probable energy), and **never touches the x-axis** at high energy.", "The **area under the curve** equals the total number of molecules.", "Molecules to the right of **Ea** have enough energy to react."]}, {"h": "Effect of temperature", "p": ["At a **higher temperature**, the curve's peak moves to the **right** and is **lower**. The area stays the same.", "Many **more molecules have energy ≥ Ea**, so many more collisions are successful per second.", "A small temperature rise causes a **large** increase in rate. This is mainly because of the energy distribution, not just more frequent collisions."]}, {"h": "Effect of concentration and pressure", "p": ["Higher **concentration** (solutions) or **pressure** (gases) means more particles in a given volume.", "So collisions are **more frequent**, and there are more successful collisions per second.", "The Maxwell–Boltzmann curve **doesn't change shape** with concentration (only temperature changes it)."]}, {"h": "Catalysts", "p": ["A **catalyst** increases the rate of a reaction **without being changed in chemical composition** or amount.", "It provides an **alternative reaction route** with a **lower activation energy**.", "On the Maxwell–Boltzmann distribution, Ea moves **left**, so more molecules have enough energy to react. The curve itself doesn't change."]}], "pitfalls": ["The Maxwell–Boltzmann curve must start at the **origin** and must **not touch** the x-axis at high energies.", "At higher temperature, the area under the curve stays the **same**, because the number of molecules hasn't changed.", "Catalysts don't give particles more energy. They **lower Ea** via a different route.", "Say 'more **successful** collisions per **second** (unit time)', not just 'more collisions'."], "questions": [{"q": "What is activation energy?", "o": ["The energy released in a reaction", "The minimum energy particles need to collide for a reaction to occur", "The average energy of molecules", "The energy of a catalyst"], "a": 1, "e": "Only collisions with energy at least equal to Ea can result in a reaction."}, {"q": "Why do most collisions not lead to a reaction?", "o": ["The particles don't have enough energy (less than Ea) or the wrong orientation", "Particles never collide", "Reactions only happen in solution", "Catalysts are needed for every reaction"], "a": 0, "e": "Most collisions have energy below Ea, so the particles just bounce apart."}, {"q": "On a Maxwell–Boltzmann distribution, what does the area under the curve represent?", "o": ["The activation energy", "The average energy", "The total number of molecules", "The rate of reaction"], "a": 2, "e": "Each part of the area counts molecules with that energy, so the total area is the total number of molecules."}, {"q": "Where does the Maxwell–Boltzmann curve start?", "o": ["At the activation energy", "At the peak", "On the y-axis above zero", "At the origin, because no molecules have zero energy"], "a": 3, "e": "No molecules have zero energy, so the curve starts at the origin."}, {"q": "How does the Maxwell–Boltzmann curve change at a higher temperature?", "o": ["The peak moves right and is lower; the area stays the same", "The peak moves left and is higher", "The area doubles", "Ea moves to the left"], "a": 0, "e": "The energies spread out, so the peak is lower and further right, but the number of molecules is the same."}, {"q": "Why does increasing temperature increase the rate of reaction?", "o": ["It lowers the activation energy", "More molecules have energy greater than or equal to Ea, so there are more successful collisions per second", "It increases the concentration", "It adds a catalyst"], "a": 1, "e": "The main effect is that a larger proportion of molecules exceed Ea. Collisions also become more frequent."}, {"q": "Why does increasing concentration increase rate?", "o": ["Molecules have more energy", "Activation energy decreases", "There are more particles in the same volume, so more frequent collisions", "The temperature rises"], "a": 2, "e": "More particles per unit volume means more collisions per second, so more successful collisions."}, {"q": "How does increasing the pressure of a gas affect rate?", "o": ["It decreases rate", "It changes Ea", "It has no effect", "It increases rate, because particles are closer together and collide more often"], "a": 3, "e": "Higher pressure is like higher concentration for gases."}, {"q": "How does a catalyst increase the rate of a reaction?", "o": ["It provides an alternative route with a lower activation energy", "It gives molecules more energy", "It increases temperature", "It is used up in the reaction"], "a": 0, "e": "With a lower Ea, a larger proportion of molecules have enough energy to react."}, {"q": "On a Maxwell–Boltzmann diagram, how is the effect of a catalyst shown?", "o": ["The curve moves right", "Ea is moved to the left; the curve stays the same", "The peak gets higher", "The area increases"], "a": 1, "e": "The catalyst lowers Ea, so more of the area under the existing curve lies beyond it."}, {"q": "Does a catalyst get used up in a reaction?", "o": ["Yes, completely", "Yes, partly", "No, it is not changed in chemical composition or amount", "Only at high temperature"], "a": 2, "e": "A catalyst takes part but is regenerated, so it remains unchanged at the end."}, {"q": "How is the rate of reaction found from a concentration–time graph?", "o": ["From the area under the graph", "From the y-intercept", "From the x-intercept", "From the gradient (drawing a tangent at a point)"], "a": 3, "e": "Rate is change in concentration per unit time, which is the gradient."}, {"q": "Why does a small increase in temperature cause a large increase in rate?", "o": ["Because the proportion of molecules with energy ≥ Ea increases greatly", "Because collision frequency doubles", "Because Ea decreases", "Because pressure rises"], "a": 0, "e": "The high-energy tail of the distribution grows a lot, so many more molecules exceed Ea."}, {"q": "Does the Maxwell–Boltzmann curve touch the x-axis at high energy?", "o": ["Yes, at the activation energy", "No, it approaches the axis but never reaches it", "Yes, at twice the mean energy", "It touches it at the peak"], "a": 1, "e": "There is no maximum energy a molecule can have, so the curve never reaches zero."}, {"q": "In RP3, sodium thiosulfate reacts with acid to form a precipitate. What is measured?", "o": ["The mass of sulfur", "The volume of gas", "The time for a cross under the flask to disappear", "The pH"], "a": 2, "e": "Sulfur makes the solution cloudy. The time until the cross can't be seen is recorded."}, {"q": "In RP3, what is used as a measure of rate?", "o": ["Time", "Temperature", "Volume", "1/time"], "a": 3, "e": "A faster reaction takes less time, so rate is proportional to 1/time."}, {"q": "What is the main limitation of the 'disappearing cross' method?", "o": ["Judging when the cross disappears is subjective", "The reaction is too fast to measure", "No gas is produced", "Sulfur is soluble"], "a": 0, "e": "Different people judge the end point differently. A light sensor would be more objective."}, {"q": "What is meant by the rate of a reaction?", "o": ["The total amount of product", "The change in concentration of a reactant or product per unit time", "The activation energy", "The time for a reaction to start"], "a": 1, "e": "Rate measures how quickly concentration changes, e.g. in mol dm⁻³ s⁻¹."}, {"q": "Why does a powder react faster than a lump of the same solid?", "o": ["It has a higher Ea", "It has more energy", "It has a larger surface area, so more frequent collisions", "It has fewer particles"], "a": 2, "e": "More particles are exposed at the surface, so collisions happen more often."}, {"q": "A catalyst is added to a reversible reaction. Which statement is correct?", "o": ["It increases yield", "It changes ΔH", "It only speeds up the forward reaction", "It speeds up the forward and reverse reactions equally"], "a": 3, "e": "A catalyst lowers Ea for both directions, so equilibrium is reached faster but its position doesn't change."}, {"q": "Which change shifts the Maxwell–Boltzmann curve itself?", "o": ["Changing temperature", "Adding a catalyst", "Increasing concentration", "Increasing pressure"], "a": 0, "e": "Only temperature changes the distribution of molecular energies."}, {"q": "Why does a catalyst save energy in industry?", "o": ["It produces heat", "Reactions can be carried out at lower temperatures with a good rate", "It reduces pressure", "It is never replaced"], "a": 1, "e": "A lower Ea means a good rate is reached without as much heating."}]}, {"id": "3.1.6", "order": 6, "year": 1, "section": "3.1", "spec": "3.1.6", "title": "Chemical equilibria and Kc", "desc": "Dynamic equilibrium, Le Chatelier's principle, industrial compromise conditions, and calculating and using the equilibrium constant Kc.", "practicals": [], "summary": [{"h": "Dynamic equilibrium", "p": ["Many reactions are **reversible** (⇌).", "In a **closed system**, a reversible reaction reaches **dynamic equilibrium**: the **forward and reverse rates are equal**, and the **concentrations** of reactants and products **stay constant**."]}, {"h": "Le Chatelier's principle", "p": ["If a factor affecting an equilibrium is changed, the **position of equilibrium shifts** to **oppose the change**.", "**Concentration**: adding a reactant shifts equilibrium to the **right**, to use it up.", "**Pressure** (gases): increasing pressure shifts equilibrium towards the side with **fewer moles of gas**.", "**Temperature**: increasing temperature shifts equilibrium in the **endothermic** direction.", "**Catalyst**: **no effect** on position. It speeds up both directions equally, so equilibrium is reached **faster**."]}, {"h": "Industrial compromise", "p": ["Examples: the **Haber process** (N₂ + 3H₂ ⇌ 2NH₃, ΔH negative) and making **ethanol** from ethene and steam, and methanol.", "A **low temperature** gives a higher yield for an exothermic reaction, but too slow a rate. A **compromise temperature** is used.", "**High pressure** gives a higher yield and rate, but is **expensive** and dangerous to maintain, so a compromise pressure is used."]}, {"h": "Equilibrium constant Kc", "p": ["For aA + bB ⇌ cC + dD: `Kc = [C]ᶜ[D]ᵈ ÷ [A]ᵃ[B]ᵇ`", "Square brackets mean **concentration at equilibrium** in mol dm⁻³.", "Work out the units by cancelling the concentration units.", "Use an **ICE table** (initial, change, equilibrium moles) to find equilibrium amounts, then divide by volume.", "Kc is **only changed by temperature**. Changing concentration or pressure shifts the position, but Kc stays the same.", "If the forward reaction is **exothermic**, increasing temperature **decreases** Kc. If **endothermic**, increasing temperature **increases** Kc.", "A catalyst **doesn't change** Kc."]}], "pitfalls": ["Dynamic equilibrium means rates are equal, **not** that concentrations are equal.", "Kc changes **only** with temperature. That's a very common exam point.", "Use **equilibrium** concentrations in Kc, not starting values.", "Kc units vary: always work them out from the expression."], "questions": [{"q": "What is dynamic equilibrium?", "o": ["When the reaction stops", "When the forward and reverse rates are equal and concentrations stay constant", "When concentrations of reactants and products are equal", "When all reactants become products"], "a": 1, "e": "Both reactions continue at the same rate, so there is no overall change in concentrations."}, {"q": "Which condition is needed for dynamic equilibrium?", "o": ["A closed system", "An open beaker", "A catalyst", "High temperature"], "a": 0, "e": "A closed system stops reactants or products escaping, so equilibrium can be established."}, {"q": "What is Le Chatelier's principle?", "o": ["Catalysts change equilibrium", "Equilibrium always lies to the right", "If a condition is changed, the position of equilibrium shifts to oppose the change", "Kc changes with pressure"], "a": 2, "e": "The system responds to counteract any change made to it."}, {"q": "N₂ + 3H₂ ⇌ 2NH₃. What happens to the position of equilibrium if pressure increases?", "o": ["Shifts left", "No change", "Shifts to the side with more moles", "Shifts right, to the side with fewer moles of gas"], "a": 3, "e": "There are 4 moles of gas on the left and 2 on the right. Higher pressure favours the side with fewer moles."}, {"q": "An equilibrium has an exothermic forward reaction. What happens if temperature increases?", "o": ["Equilibrium shifts left, in the endothermic direction", "Shifts right", "No change", "The reaction stops"], "a": 0, "e": "Raising temperature favours the endothermic direction, which is the reverse reaction here."}, {"q": "What effect does a catalyst have on the position of equilibrium?", "o": ["Shifts it right", "No effect, but equilibrium is reached faster", "Shifts it left", "Increases yield"], "a": 1, "e": "A catalyst speeds up the forward and reverse reactions equally."}, {"q": "H₂ + I₂ ⇌ 2HI. What is the effect of increasing pressure on the position of equilibrium?", "o": ["Shifts right", "Shifts left", "No effect, because there are equal moles of gas on both sides", "The reaction stops"], "a": 2, "e": "2 moles of gas on each side, so pressure doesn't affect the position."}, {"q": "Why is a compromise temperature used in the Haber process?", "o": ["A high temperature gives the best yield", "Low temperature damages the catalyst", "Temperature doesn't matter", "A low temperature gives a higher yield, but the rate would be too slow"], "a": 3, "e": "The forward reaction is exothermic. A compromise temperature gives an acceptable yield at a reasonable rate."}, {"q": "Why isn't a very high pressure used in industry, even when it would increase yield?", "o": ["It is expensive to produce and maintain, and is a safety risk", "It lowers the rate", "It reduces Kc", "It damages catalysts"], "a": 0, "e": "High pressure needs strong equipment and lots of energy for compression, so a compromise is used."}, {"q": "What is the Kc expression for 2SO₂ + O₂ ⇌ 2SO₃?", "o": ["[SO₂]²[O₂] ÷ [SO₃]²", "[SO₃]² ÷ [SO₂]²[O₂]", "[SO₃] ÷ [SO₂][O₂]", "2[SO₃] ÷ 2[SO₂][O₂]"], "a": 1, "e": "Products over reactants, each raised to the power of its coefficient."}, {"q": "What are the units of Kc for 2SO₂ + O₂ ⇌ 2SO₃?", "o": ["mol dm⁻³", "No units", "mol⁻¹ dm³", "mol² dm⁻⁶"], "a": 2, "e": "(mol dm⁻³)² ÷ [(mol dm⁻³)² × mol dm⁻³] = 1 ÷ mol dm⁻³ = mol⁻¹ dm³."}, {"q": "Which change alters the value of Kc?", "o": ["Concentration", "Pressure", "A catalyst", "Temperature"], "a": 3, "e": "Kc is constant at a given temperature. Only temperature changes its value."}, {"q": "For an endothermic forward reaction, what happens to Kc when temperature increases?", "o": ["Kc increases", "Kc decreases", "No change", "Kc becomes zero"], "a": 0, "e": "Equilibrium shifts right, increasing products, so Kc increases."}, {"q": "For H₂ + I₂ ⇌ 2HI at equilibrium: [H₂] = 0.10, [I₂] = 0.10, [HI] = 0.80 mol dm⁻³. What is Kc?", "o": ["80", "64", "0.016", "8.0"], "a": 1, "e": "Kc = 0.80² ÷ (0.10 × 0.10) = 0.64 ÷ 0.010 = 64. No units."}, {"q": "Extra reactant is added to an equilibrium mixture. What happens to Kc?", "o": ["It increases", "It decreases", "It stays the same, because the position shifts to restore the ratio", "It becomes zero"], "a": 2, "e": "The equilibrium shifts right until the concentration ratio again equals Kc."}, {"q": "Why are ICE tables used in Kc calculations?", "o": ["To find the rate", "To find activation energy", "To calculate ΔH", "To find equilibrium amounts from starting amounts and the reaction ratio"], "a": 3, "e": "Initial, Change, Equilibrium rows track how much of each substance reacts and remains."}, {"q": "1.0 mol of A and 1.0 mol of B react (A + B ⇌ C) in 1.0 dm³. At equilibrium, there is 0.60 mol of C. How much A remains?", "o": ["0.40 mol", "0.60 mol", "1.0 mol", "1.6 mol"], "a": 0, "e": "0.60 mol of A reacted, so 1.0 − 0.60 = 0.40 mol remains."}, {"q": "Ethanol is made by C₂H₄(g) + H₂O(g) ⇌ C₂H₅OH(g), ΔH negative. Which conditions favour yield?", "o": ["High temperature, low pressure", "Low temperature, high pressure", "High temperature, high pressure", "Low temperature, low pressure"], "a": 1, "e": "Exothermic, so lower temperature favours products. 2 moles of gas becomes 1, so high pressure favours products."}, {"q": "At dynamic equilibrium, which statement is true?", "o": ["Concentrations of reactants and products are equal", "No reactions happen", "Concentrations are constant, but reactions continue in both directions", "Only the forward reaction happens"], "a": 2, "e": "Both reactions continue at equal rates. Concentrations are constant but usually not equal."}, {"q": "A product is continuously removed from an equilibrium mixture. What happens?", "o": ["Equilibrium shifts left", "Kc decreases", "Nothing", "Equilibrium shifts right, making more product"], "a": 3, "e": "The system replaces the removed product by shifting to the right."}, {"q": "A Kc value is very large. What does this show?", "o": ["Equilibrium lies far to the right; mostly products", "Equilibrium lies far to the left", "The reaction is very fast", "The reaction is endothermic"], "a": 0, "e": "A large Kc means the products' concentrations are much larger than the reactants'."}, {"q": "Does the position of equilibrium affect the rate of reaching equilibrium?", "o": ["Yes, always", "No, position and rate are separate; a catalyst affects only rate", "Only with a catalyst", "Only with pressure"], "a": 1, "e": "Position describes where equilibrium lies. Rate describes how quickly it is reached."}]}, {"id": "3.1.7", "order": 7, "year": 1, "section": "3.1", "spec": "3.1.7", "title": "Oxidation, reduction and redox equations", "desc": "Oxidation and reduction in terms of electrons, oxidation states, oxidising and reducing agents, and writing and combining half-equations.", "practicals": [], "summary": [{"h": "Definitions", "p": ["**Oxidation** is the **loss of electrons**. **Reduction** is the **gain of electrons**. Remember **OIL RIG**.", "An **oxidising agent** is an **electron acceptor**: it is itself **reduced**.", "A **reducing agent** is an **electron donor**: it is itself **oxidised**.", "A **redox** reaction involves both oxidation and reduction."]}, {"h": "Oxidation states", "p": ["Uncombined elements: **0**. E.g. Na, O₂.", "The sum of oxidation states in a compound is **0**. In an ion, it equals the **charge**.", "**Oxygen** is usually **−2** (−1 in peroxides, +2 in OF₂). **Hydrogen** is usually **+1** (−1 in metal hydrides). **Fluorine** is always **−1**.", "Group 1 metals are **+1**, Group 2 are **+2**.", "Roman numerals show oxidation state in names, e.g. iron(III) chloride, potassium manganate(VII).", "**Increase** in oxidation state means **oxidation**. **Decrease** means **reduction**."]}, {"h": "Half-equations", "p": ["A half-equation shows one process with electrons, e.g. `Fe²⁺ → Fe³⁺ + e⁻` (oxidation).", "To balance in acid: balance atoms other than O and H, then add **H₂O** to balance O, then add **H⁺** to balance H, then add **electrons** to balance charge.", "Example: `MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O`"]}, {"h": "Combining half-equations", "p": ["Multiply each half-equation so the **number of electrons is the same** in both.", "Add them together and **cancel electrons** (and any H⁺ or H₂O that appear on both sides).", "Example: `MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺`"]}], "pitfalls": ["The oxidising agent is **reduced**. Students often swap these.", "Electrons go on the **left** in a reduction half-equation and on the **right** in an oxidation half-equation.", "In the overall equation, electrons must **cancel completely**.", "Check charges balance on both sides of every half-equation."], "questions": [{"q": "What is oxidation in terms of electrons?", "o": ["Gain of electrons", "Loss of electrons", "Gain of protons", "Loss of oxygen"], "a": 1, "e": "OIL RIG: Oxidation Is Loss of electrons; Reduction Is Gain."}, {"q": "What is an oxidising agent?", "o": ["An electron acceptor, which is itself reduced", "An electron donor, which is itself oxidised", "A substance that gains oxygen", "A catalyst"], "a": 0, "e": "Oxidising agents take electrons from other species, so they are reduced."}, {"q": "What is a reducing agent?", "o": ["An electron acceptor", "A substance that loses protons", "An electron donor, which is itself oxidised", "A substance that gains electrons"], "a": 2, "e": "Reducing agents give electrons to other species, so they are oxidised."}, {"q": "What is the oxidation state of an uncombined element?", "o": ["+1", "−1", "Depends on the group", "0"], "a": 3, "e": "Elements on their own, e.g. Cl₂ or Mg, have an oxidation state of 0."}, {"q": "What is the oxidation state of Mn in MnO₄⁻?", "o": ["+7", "+6", "+4", "−1"], "a": 0, "e": "4 × (−2) = −8. Total must be −1. So Mn = −1 + 8 = +7."}, {"q": "What is the oxidation state of S in H₂SO₄?", "o": ["+4", "+6", "−2", "+2"], "a": 1, "e": "2(+1) + S + 4(−2) = 0. So S = +6."}, {"q": "What is the oxidation state of Cr in Cr₂O₇²⁻?", "o": ["+7", "+3", "+6", "+12"], "a": 2, "e": "7 × (−2) = −14. Total −2, so 2Cr = +12, and each Cr = +6."}, {"q": "What is the oxidation state of hydrogen in NaH?", "o": ["+1", "0", "+2", "−1"], "a": 3, "e": "In metal hydrides, hydrogen is −1, because the metal is +1."}, {"q": "What is the oxidation state of oxygen in H₂O₂?", "o": ["−1", "−2", "0", "+1"], "a": 0, "e": "In peroxides, oxygen is −1: 2(+1) + 2(O) = 0, so O = −1."}, {"q": "In the reaction Zn + Cu²⁺ → Zn²⁺ + Cu, which species is oxidised?", "o": ["Cu²⁺", "Zn", "Cu", "Zn²⁺"], "a": 1, "e": "Zn loses 2 electrons (0 → +2), so it is oxidised."}, {"q": "In the reaction Zn + Cu²⁺ → Zn²⁺ + Cu, what is the oxidising agent?", "o": ["Zn", "Zn²⁺", "Cu²⁺", "Cu"], "a": 2, "e": "Cu²⁺ accepts electrons, oxidising Zn, and is itself reduced."}, {"q": "Which is a correctly balanced reduction half-equation?", "o": ["Cl₂ → 2Cl⁻ + 2e⁻", "Fe²⁺ + e⁻ → Fe³⁺", "Na → Na⁺ + e⁻", "Cl₂ + 2e⁻ → 2Cl⁻"], "a": 3, "e": "Reduction is gain of electrons, so electrons are on the left. Charge balances: 0 + 2(−1) = 2(−1)."}, {"q": "Which half-equation shows the reduction of MnO₄⁻ in acid?", "o": ["MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O", "MnO₄⁻ + 4H⁺ + 3e⁻ → Mn²⁺ + 2H₂O", "MnO₄⁻ → Mn²⁺ + 4O + 5e⁻", "MnO₄⁻ + 5e⁻ → Mn²⁺"], "a": 0, "e": "Mn goes from +7 to +2 (5 electrons). 4 O → 4H₂O needs 8H⁺. Charges: −1 + 8 − 5 = +2 on both sides."}, {"q": "How do you balance oxygen atoms in a half-equation in acidic solution?", "o": ["Add O₂", "Add H₂O", "Add OH⁻", "Add electrons"], "a": 1, "e": "Add water to the side lacking oxygen, then H⁺ to balance hydrogen."}, {"q": "When combining two half-equations, what must be equal?", "o": ["The number of atoms of oxygen", "The number of H⁺ ions", "The number of electrons in each", "The charges on each side"], "a": 2, "e": "Multiply the half-equations so electrons lost equal electrons gained, then cancel them."}, {"q": "Fe²⁺ → Fe³⁺ + e⁻ and MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O. How many Fe²⁺ react per MnO₄⁻?", "o": ["1", "2", "8", "5"], "a": 3, "e": "MnO₄⁻ gains 5 electrons. Each Fe²⁺ loses 1, so 5 Fe²⁺ are needed."}, {"q": "What does an increase in oxidation state show?", "o": ["Oxidation", "Reduction", "Neutralisation", "No reaction"], "a": 0, "e": "Losing electrons makes the oxidation state more positive."}, {"q": "What is the name of Fe₂O₃ using oxidation states?", "o": ["Iron(II) oxide", "Iron(III) oxide", "Iron(VI) oxide", "Diiron trioxide(II)"], "a": 1, "e": "3 × (−2) = −6, shared by 2 Fe, so each Fe is +3: iron(III) oxide."}, {"q": "What is the oxidation state of N in NH₄⁺?", "o": ["+3", "+5", "−3", "−4"], "a": 2, "e": "N + 4(+1) = +1, so N = −3."}, {"q": "In Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂, what happens to bromide ions?", "o": ["They are reduced", "They act as oxidising agents", "They gain electrons", "They are oxidised"], "a": 3, "e": "Br⁻ (−1) becomes Br₂ (0), losing electrons, so bromide is oxidised."}, {"q": "Balance the half-equation: Cr₂O₇²⁻ + ?H⁺ + ?e⁻ → 2Cr³⁺ + 7H₂O", "o": ["14H⁺ and 6e⁻", "7H⁺ and 3e⁻", "14H⁺ and 3e⁻", "7H⁺ and 6e⁻"], "a": 0, "e": "7H₂O n
