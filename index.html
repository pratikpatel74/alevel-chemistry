entropy?", "o": ["kJ mol⁻¹", "J mol⁻¹", "J K⁻¹ mol⁻¹", "K mol⁻¹"], "a": 2, "e": "Entropy values are in J K⁻¹ mol⁻¹, so they must be converted to kJ in ΔG calculations."}, {"q": "What is the Gibbs free-energy equation?", "o": ["ΔG = ΔS − TΔH", "ΔG = ΔH + TΔS", "ΔG = TΔH − ΔS", "ΔG = ΔH − TΔS"], "a": 3, "e": "ΔG combines enthalpy and entropy to predict feasibility."}, {"q": "When is a reaction feasible?", "o": ["When ΔG ≤ 0", "When ΔH > 0", "When ΔS < 0", "When ΔG > 0"], "a": 0, "e": "A negative (or zero) ΔG means the reaction can happen."}, {"q": "ΔH = +178 kJ mol⁻¹ and ΔS = +161 J K⁻¹ mol⁻¹. Above what temperature is the reaction feasible?", "o": ["1.1 K", "1106 K", "28 658 K", "0.9 K"], "a": 1, "e": "T = ΔH ÷ ΔS = 178 ÷ 0.161 = 1106 K. Convert ΔS to kJ first."}, {"q": "A reaction has negative ΔH and positive ΔS. When is it feasible?", "o": ["Only at high temperature", "Only at low temperature", "At all temperatures", "Never"], "a": 2, "e": "ΔH − TΔS is always negative, because −TΔS is negative and ΔH is negative."}, {"q": "A reaction has positive ΔH and negative ΔS. When is it feasible?", "o": ["At all temperatures", "Only at high temperature", "Only at low temperature", "Never"], "a": 3, "e": "Both terms make ΔG positive, so it is never feasible."}, {"q": "Why might a feasible reaction (ΔG < 0) not happen at room temperature?", "o": ["The activation energy is too high, so the rate is very slow", "ΔS is negative", "ΔH is positive", "It needs a catalyst to become feasible"], "a": 0, "e": "Feasibility says nothing about rate. A high Ea is a kinetic barrier."}, {"q": "In a Born–Haber cycle for NaCl, which step is exothermic?", "o": ["Atomisation of Na", "First electron affinity of Cl", "First ionisation energy of Na", "Atomisation of Cl"], "a": 1, "e": "Chlorine releases energy when it gains an electron."}, {"q": "Why is the hydration enthalpy of Mg²⁺ more exothermic than that of Na⁺?", "o": ["Mg²⁺ is larger", "Na⁺ has a higher charge", "Mg²⁺ is smaller with a higher charge, so it attracts water molecules more strongly", "Mg²⁺ forms hydrogen bonds"], "a": 2, "e": "Higher charge density gives stronger ion–dipole attractions."}, {"q": "How is ΔS for a reaction calculated?", "o": ["ΣS(reactants) − ΣS(products)", "ΔH ÷ T", "ΔG − ΔH", "ΣS(products) − ΣS(reactants)"], "a": 3, "e": "Products minus reactants, each multiplied by its number of moles."}, {"q": "Which reaction has a positive ΔS? ", "o": ["CaCO₃(s) → CaO(s) + CO₂(g)", "N₂(g) + 3H₂(g) → 2NH₃(g)", "H₂O(g) → H₂O(l)", "2Mg(s) + O₂(g) → 2MgO(s)"], "a": 0, "e": "A gas is produced from a solid, so disorder increases."}, {"q": "In a Born–Haber cycle, what is the enthalpy of atomisation of chlorine if the Cl–Cl bond enthalpy is +242 kJ mol⁻¹?", "o": ["+242 kJ mol⁻¹", "+121 kJ mol⁻¹", "+484 kJ mol⁻¹", "−121 kJ mol⁻¹"], "a": 1, "e": "Atomisation forms one mole of Cl atoms, which is half a mole of Cl–Cl bonds broken."}]}, {"id": "3.1.9", "order": 18, "year": 2, "section": "3.1", "spec": "3.1.9", "title": "Rate equations", "desc": "Rate equations and orders, the rate constant k, determining orders from data and graphs, rate-determining steps, and the Arrhenius equation.", "practicals": [7], "summary": [{"h": "Rate equations", "p": ["`rate = k[A]ᵐ[B]ⁿ`, where m and n are the **orders** with respect to A and B, and k is the **rate constant**.", "**Overall order** = m + n.", "Orders can only be found by **experiment**, not from the balanced equation.", "**Zero order**: rate doesn't depend on concentration. **First order**: doubling concentration **doubles** rate. **Second order**: doubling concentration **quadruples** rate."]}, {"h": "Finding orders", "p": ["**Initial rates method**: change one concentration at a time and compare initial rates.", "**Concentration–time graphs**: zero order gives a **straight line**; first order gives a curve with a **constant half-life**.", "**Rate–concentration graphs**: zero order is horizontal; first order is a straight line through the origin; second order is a curve (parabola)."]}, {"h": "The rate constant k", "p": ["Units of k depend on the overall order. Rearrange the rate equation: e.g. second order overall, `k = rate ÷ [A][B]`, units **mol⁻¹ dm³ s⁻¹**.", "k **increases** with **temperature**.", "**Arrhenius equation**: `k = A e^(−Ea/RT)`. Taking logs: `ln k = ln A − Ea/RT`.", "Plot **ln k** against **1/T**: a straight line with gradient **−Ea/R**, so Ea = −gradient × R."]}, {"h": "Rate-determining step", "p": ["The **rate-determining step** is the **slowest** step in a mechanism.", "Species in the rate equation (and their powers) appear in the rate-determining step or steps before it.", "Example: if rate = k[(CH₃)₃CBr], only the halogenoalkane is in the slow step, suggesting an Sɴ1 mechanism."]}], "pitfalls": ["Orders come from **experimental data**, never from equation coefficients.", "Work out k's units every time. They change with overall order.", "In ln k vs 1/T, Ea = −gradient × R, then convert J to kJ if needed."], "questions": [{"q": "In rate = k[A]²[B], what is the overall order?", "o": ["2", "3", "1", "4"], "a": 1, "e": "Overall order = 2 + 1 = 3."}, {"q": "A reaction is first order in X. What happens to the rate if [X] is tripled?", "o": ["It triples", "It increases 9 times", "It stays the same", "It doubles"], "a": 0, "e": "First order: rate is directly proportional to concentration."}, {"q": "A reaction is second order in Y. What happens to the rate if [Y] doubles?", "o": ["Doubles", "Stays the same", "Increases 4 times", "Increases 8 times"], "a": 2, "e": "Rate ∝ [Y]², so 2² = 4 times faster."}, {"q": "What does zero order mean?", "o": ["The reaction doesn't happen", "Rate doubles with concentration", "The reactant is a catalyst", "Changing the concentration of that reactant has no effect on rate"], "a": 3, "e": "A zero-order reactant doesn't appear in the rate equation."}, {"q": "How can orders of reaction be found?", "o": ["Only by experiment", "From the balanced equation", "From ΔH", "From Kc"], "a": 0, "e": "Orders reflect the mechanism and must be determined experimentally."}, {"q": "What is the shape of a concentration–time graph for a zero-order reactant?", "o": ["A curve with constant half-life", "A straight line with negative gradient", "A horizontal line", "An upward curve"], "a": 1, "e": "The rate is constant, so concentration falls at a constant rate."}, {"q": "Which feature of a concentration–time graph shows first order?", "o": ["A straight line", "A horizontal line", "A constant half-life", "An increasing gradient"], "a": 2, "e": "First-order reactions have the same half-life whatever the starting concentration."}, {"q": "What is the shape of a rate–concentration graph for a first-order reactant?", "o": ["Horizontal line", "A curve", "A vertical line", "A straight line through the origin"], "a": 3, "e": "Rate is directly proportional to concentration."}, {"q": "rate = k[A][B]. Concentrations in mol dm⁻³, rate in mol dm⁻³ s⁻¹. What are the units of k?", "o": ["mol⁻¹ dm³ s⁻¹", "s⁻¹", "mol dm⁻³ s⁻¹", "mol⁻² dm⁶ s⁻¹"], "a": 0, "e": "k = rate ÷ [A][B] = (mol dm⁻³ s⁻¹) ÷ (mol dm⁻³)² = mol⁻¹ dm³ s⁻¹."}, {"q": "What are the units of k for a first-order reaction overall?", "o": ["mol dm⁻³ s⁻¹", "s⁻¹", "mol⁻¹ dm³ s⁻¹", "No units"], "a": 1, "e": "k = rate ÷ [A] = (mol dm⁻³ s⁻¹) ÷ (mol dm⁻³) = s⁻¹."}, {"q": "How does increasing temperature affect k?", "o": ["k decreases", "k stays the same", "k increases", "k becomes zero"], "a": 2, "e": "More molecules exceed Ea at higher temperature, so k increases."}, {"q": "What is the Arrhenius equation?", "o": ["k = A e^(Ea/RT)", "k = Ea/RT", "k = A + Ea/RT", "k = A e^(−Ea/RT)"], "a": 3, "e": "k depends exponentially on Ea and temperature."}, {"q": "In a plot of ln k against 1/T, what is the gradient?", "o": ["−Ea/R", "Ea/R", "ln A", "−R/Ea"], "a": 0, "e": "ln k = ln A − (Ea/R)(1/T), so the gradient is −Ea/R."}, {"q": "A plot of ln k against 1/T has a gradient of −6000 K. What is Ea? (R = 8.31 J K⁻¹ mol⁻¹)", "o": ["722 J mol⁻¹", "49.9 kJ mol⁻¹", "6.00 kJ mol⁻¹", "−49.9 kJ mol⁻¹"], "a": 1, "e": "Ea = −gradient × R = 6000 × 8.31 = 49 860 J mol⁻¹ ≈ 49.9 kJ mol⁻¹."}, {"q": "What is the rate-determining step?", "o": ["The fastest step", "The first step", "The slowest step in a mechanism", "The final step"], "a": 2, "e": "The overall rate can't be faster than the slowest step."}, {"q": "rate = k[(CH₃)₃CBr]. What does this suggest about the mechanism with OH⁻?", "o": ["OH⁻ is in the rate-determining step", "The reaction is second order", "Both reactants collide in the slow step", "Only the halogenoalkane is involved in the rate-determining step"], "a": 3, "e": "OH⁻ is zero order, so it reacts after the slow step (Sɴ1)."}, {"q": "Experiment 1: [A] = 0.1, rate = 2.0 × 10⁻³. Experiment 2: [A] = 0.2, rate = 8.0 × 10⁻³. What is the order in A?", "o": ["2", "1", "0", "4"], "a": 0, "e": "Doubling [A] multiplies rate by 4, so the order is 2."}, {"q": "Experiment 1: [B] = 0.1, rate = 3.0 × 10⁻⁴. Experiment 2: [B] = 0.3, rate = 3.0 × 10⁻⁴. What is the order in B?", "o": ["1", "0", "2", "3"], "a": 1, "e": "Tripling [B] doesn't change the rate, so B is zero order."}, {"q": "In the initial rates method, why is only one concentration changed at a time?", "o": ["To save chemicals", "To keep the temperature constant", "So that the effect of each reactant on rate can be found separately", "To increase rate"], "a": 2, "e": "If two changed, you couldn't tell which caused the change in rate."}, {"q": "rate = k[NO]²[O₂]. Which species could be in the rate-determining step?", "o": ["Only O₂", "Only NO", "None", "Two NO and one O₂ (or species formed from them in earlier steps)"], "a": 3, "e": "The rate equation shows what is involved up to and including the slow step."}, {"q": "Why does a catalyst increase k?", "o": ["It lowers Ea, which increases k in the Arrhenius equation", "It raises temperature", "It increases concentration", "It changes the orders"], "a": 0, "e": "A smaller Ea makes e^(−Ea/RT) larger, so k increases."}, {"q": "In a clock reaction, what is used as a measure of the initial rate?", "o": ["The time taken", "1/time for a set amount of product to form", "The final concentration", "The temperature"], "a": 1, "e": "A faster reaction reaches the colour change sooner, so rate ∝ 1/t."}]}, {"id": "3.1.10", "order": 19, "year": 2, "section": "3.1", "spec": "3.1.10", "title": "Equilibrium constant Kp", "desc": "Mole fractions, partial pressures, writing and calculating Kp, its units, and how temperature, pressure and catalysts affect Kp.", "practicals": [], "summary": [{"h": "Partial pressures", "p": ["For gas mixtures, **partial pressure** is the pressure each gas would exert on its own.", "`mole fraction of A = moles of A ÷ total moles of gas`", "`partial pressure of A (pA) = mole fraction of A × total pressure`", "The sum of partial pressures equals the **total pressure**."]}, {"h": "Kp", "p": ["For aA(g) + bB(g) ⇌ cC(g) + dD(g): `Kp = (pC)ᶜ(pD)ᵈ ÷ (pA)ᵃ(pB)ᵇ`", "Only **gases** are included in Kp.", "Work out the units by cancelling pressure units (e.g. kPa).", "Use an ICE table for moles, find mole fractions, then partial pressures, then Kp."]}, {"h": "What changes Kp", "p": ["Like Kc, **Kp only changes with temperature**.", "Exothermic forward reaction: Kp **decreases** as temperature increases. Endothermic: Kp **increases**.", "Changing **total pressure** changes partial pressures and may shift the position of equilibrium, but **Kp stays the same**.", "A **catalyst** doesn't affect Kp."]}], "pitfalls": ["Partial pressures use **mole fractions** at **equilibrium**, not initial amounts.", "Mole fractions must **add up to 1**. Use this to check your working.", "Only temperature changes Kp."], "questions": [{"q": "What is a mole fraction?", "o": ["Moles of one gas ÷ total moles of gas", "Mass of gas ÷ total mass", "Partial pressure ÷ volume", "Moles of gas ÷ volume"], "a": 0, "e": "Mole fraction is the proportion of the total gas moles made up by one gas."}, {"q": "How is partial pressure calculated?", "o": ["Total pressure ÷ moles", "Mole fraction × total pressure", "Moles × volume", "Kp × total pressure"], "a": 1, "e": "Each gas contributes a share of the total pressure equal to its mole fraction."}, {"q": "A mixture has 2 mol N₂ and 6 mol H₂ at 200 kPa total. What is the partial pressure of N₂?", "o": ["100 kPa", "25 kPa", "50 kPa", "150 kPa"], "a": 2, "e": "Mole fraction N₂ = 2 ÷ 8 = 0.25. pN₂ = 0.25 × 200 = 50 kPa."}, {"q": "What is the sum of the mole fractions in a mixture?", "o": ["Total pressure", "Depends on the gases", "Zero", "1"], "a": 3, "e": "All the fractions together make up the whole."}, {"q": "What is the Kp expression for N₂(g) + 3H₂(g) ⇌ 2NH₃(g)?", "o": ["(pNH₃)² ÷ (pN₂)(pH₂)³", "(pN₂)(pH₂)³ ÷ (pNH₃)²", "2pNH₃ ÷ pN₂ × 3pH₂", "(pNH₃) ÷ (pN₂)(pH₂)"], "a": 0, "e": "Products over reactants, each partial pressure raised to its coefficient."}, {"q": "What are the units of Kp for N₂(g) + 3H₂(g) ⇌ 2NH₃(g), with pressures in kPa?", "o": ["kPa²", "kPa⁻²", "kPa", "No units"], "a": 1, "e": "kPa² ÷ (kPa × kPa³) = kPa⁻²."}, {"q": "Which species are included in Kp?", "o": ["All species", "Solids only", "Gases only", "Aqueous species only"], "a": 2, "e": "Kp uses partial pressures, which only apply to gases."}, {"q": "What changes the value of Kp?", "o": ["Total pressure", "Adding a catalyst", "Adding more reactant", "Temperature"], "a": 3, "e": "Kp, like Kc, is constant at a given temperature."}, {"q": "For an exothermic forward reaction, what happens to Kp as temperature increases?", "o": ["It decreases", "It increases", "It stays the same", "It becomes negative"], "a": 0, "e": "Equilibrium shifts left, in the endothermic direction, so Kp decreases."}, {"q": "The total pressure on an equilibrium is increased. What happens to Kp?", "o": ["It increases", "It stays the same", "It decreases", "It doubles"], "a": 1, "e": "The position of equilibrium may shift, but Kp is unchanged at constant temperature."}, {"q": "For 2SO₂ + O₂ ⇌ 2SO₃, pSO₂ = 20 kPa, pO₂ = 10 kPa, pSO₃ = 60 kPa. What is Kp?", "o": ["0.3 kPa⁻¹", "3.0 kPa", "0.9 kPa⁻¹", "9.0 kPa⁻¹"], "a": 2, "e": "Kp = 60² ÷ (20² × 10) = 3600 ÷ 4000 = 0.9 kPa⁻¹."}, {"q": "What is the effect of a catalyst on Kp?", "o": ["Increases it", "Decreases it", "Doubles it", "No effect"], "a": 3, "e": "A catalyst speeds up both directions equally, so equilibrium is reached faster but Kp is unchanged."}, {"q": "In an equilibrium mixture at 100 kPa, the mole fraction of NO₂ is 0.4. What is pNO₂?", "o": ["40 kPa", "0.4 kPa", "60 kPa", "250 kPa"], "a": 0, "e": "pNO₂ = 0.4 × 100 = 40 kPa."}, {"q": "N₂O₄ ⇌ 2NO₂. Start with 1.0 mol N₂O₄. At equilibrium, 0.40 mol has reacted. What is the total moles of gas?", "o": ["1.0 mol", "1.4 mol", "0.6 mol", "1.8 mol"], "a": 1, "e": "N₂O₄ left = 0.60 mol. NO₂ formed = 0.80 mol. Total = 1.40 mol."}, {"q": "Using the previous question, what is the mole fraction of NO₂?", "o": ["0.80", "0.43", "0.57", "0.40"], "a": 2, "e": "0.80 ÷ 1.40 = 0.57."}, {"q": "For an endothermic forward reaction, what happens to Kp as temperature rises?", "o": ["Decreases", "No change", "Becomes zero", "Increases"], "a": 3, "e": "Equilibrium shifts right, in the endothermic direction, so Kp increases."}, {"q": "What is meant by partial pressure?", "o": ["The pressure a gas in a mixture would exert if it alone occupied the volume", "The total pressure", "Pressure of a liquid", "Pressure at equilibrium only"], "a": 0, "e": "Each gas contributes part of the total pressure."}, {"q": "For H₂(g) + I₂(g) ⇌ 2HI(g), what are the units of Kp?", "o": ["kPa", "No units", "kPa⁻¹", "kPa²"], "a": 1, "e": "kPa² ÷ (kPa × kPa) cancels out."}, {"q": "Why might a high total pressure increase the yield of NH₃ even though Kp is unchanged?", "o": ["Kp increases", "The reaction becomes endothermic", "The partial pressures change, so the position shifts to the side with fewer moles to keep the ratio equal to Kp", "A catalyst forms"], "a": 2, "e": "The system adjusts its composition to restore the Kp value."}, {"q": "CaCO₃(s) ⇌ CaO(s) + CO₂(g). What is the Kp expression?", "o": ["pCaO × pCO₂ ÷ pCaCO₃", "pCaCO₃ ÷ pCO₂", "1 ÷ pCO₂", "pCO₂"], "a": 3, "e": "Solids aren't included, so only CO₂ appears."}, {"q": "A mixture contains 0.2 mol A, 0.3 mol B and 0.5 mol C. What is the mole fraction of C?", "o": ["0.5", "0.3", "0.2", "1.0"], "a": 0, "e": "Total = 1.0 mol. 0.5 ÷ 1.0 = 0.5."}, {"q": "What must you find before calculating partial pressures?", "o": ["Kc", "The equilibrium moles of each gas and the total moles", "The rate constant", "ΔH"], "a": 1, "e": "Equilibrium moles give mole fractions, which give partial pressures."}]}, {"id": "3.1.11", "order": 20, "year": 2, "section": "3.1", "spec": "3.1.11", "title": "Electrode potentials and cells", "desc": "Half-cells and the standard hydrogen electrode, standard electrode potentials, cell EMF and conventional representation, predicting reactions, and commercial cells.", "practicals": [8], "summary": [{"h": "Half-cells and the standard hydrogen electrode", "p": ["A **half-cell** is an element in contact with a solution of its ions. Two half-cells joined by a wire and a **salt bridge** make an electrochemical cell.", "**Standard electrode potential (E⦵)**: the EMF of a half-cell compared with the **standard hydrogen electrode**, under standard conditions.", "**Standard hydrogen electrode (SHE)**: H₂ gas at **100 kPa**, bubbled over a **platinum** electrode in **1.00 mol dm⁻³ H⁺**, at **298 K**. Its E⦵ is defined as **0.00 V**.", "Standard conditions: **298 K**, **100 kPa**, **1.00 mol dm⁻³** solutions.", "**Platinum** is used where there's no solid metal in the half-cell, e.g. Fe³⁺/Fe²⁺, because it is inert and conducts."]}, {"h": "The electrochemical series", "p": ["Half-equations are written as **reductions**, e.g. `Cu²⁺ + 2e⁻ ⇌ Cu   E⦵ = +0.34 V`.", "A **more positive** E⦵ means the species on the left is a **better oxidising agent** (more easily reduced).", "A **more negative** E⦵ means the species on the right is a **better reducing agent** (more easily oxidised)."]}, {"h": "Cells and EMF", "p": ["`E(cell) = E(right) − E(left)`, or E(positive electrode) − E(negative electrode).", "**Conventional representation**: `Zn | Zn²⁺ || Cu²⁺ | Cu`. The **oxidised** half-cell (more negative) on the left; the reduction on the right. Single lines are phase boundaries; the double line is the salt bridge.", "Electrons flow from the **more negative** electrode to the **more positive** electrode through the wire.", "A reaction is **feasible** if E(cell) is **positive**. Kinetics may still make it too slow."]}, {"h": "Commercial cells", "p": ["**Non-rechargeable** cells (e.g. alkaline batteries) are used until the reactants run out.", "**Rechargeable** cells (e.g. lithium-ion) have reactions that can be **reversed** by applying an external current.", "**Fuel cells** (e.g. hydrogen–oxygen) produce electricity from a continuous supply of fuel. Reactions in alkaline conditions: `2H₂ + 4OH⁻ → 4H₂O + 4e⁻` and `O₂ + 2H₂O + 4e⁻ → 4OH⁻`. Overall `2H₂ + O₂ → 2H₂O`.", "Benefits: fuel cells only produce water and are efficient. Risks: hydrogen is flammable and often made using fossil fuels; batteries contain toxic or flammable materials."]}], "pitfalls": ["Electrode potential tables are always **reductions**. Reverse the more negative one to show oxidation.", "E(cell) = E(more positive) − E(more negative). It should come out **positive** for a feasible reaction.", "In the conventional representation, the **reduced forms** go next to the electrodes on the outside."], "questions": [{"q": "What is the standard electrode potential of the standard hydrogen electrode?", "o": ["1.00 V", "0.00 V", "−1.00 V", "It depends on temperature"], "a": 1, "e": "The SHE is the reference, defined as 0.00 V."}, {"q": "What are the conditions of a standard hydrogen electrode?", "o": ["H₂ at 100 kPa, 1.00 mol dm⁻³ H⁺, 298 K, platinum electrode", "H₂ at 1 kPa, pure water, 273 K", "H₂ at 100 kPa, 2.00 mol dm⁻³ H⁺, copper electrode", "O₂ at 100 kPa"], "a": 0, "e": "These standard conditions are needed for a reproducible reference."}, {"q": "Why is platinum used in some half-cells?", "o": ["It is the most reactive metal", "It is cheap", "It is inert and conducts electricity", "It forms ions easily"], "a": 2, "e": "Platinum provides a surface for electron transfer without reacting itself."}, {"q": "What is the role of the salt bridge?", "o": ["To carry electrons", "To heat the cell", "To provide H⁺", "To complete the circuit by allowing ions to move between half-cells"], "a": 3, "e": "Ions flow through the salt bridge to balance charge as electrons flow in the wire."}, {"q": "Cu²⁺/Cu E⦵ = +0.34 V; Zn²⁺/Zn E⦵ = −0.76 V. What is the cell EMF?", "o": ["+1.10 V", "−0.42 V", "+0.42 V", "−1.10 V"], "a": 0, "e": "E(cell) = 0.34 − (−0.76) = +1.10 V."}, {"q": "In a Zn/Cu cell, in which direction do electrons flow in the wire?", "o": ["From Cu to Zn", "From Zn to Cu", "No flow", "Through the salt bridge"], "a": 1, "e": "Zn has the more negative E⦵, so it is oxidised and releases electrons, which flow to Cu."}, {"q": "A more positive E⦵ means the species on the left of the half-equation is:", "o": ["A better reducing agent", "Less easily reduced", "A better oxidising agent", "Unreactive"], "a": 2, "e": "It is more easily reduced, so it is a stronger oxidising agent."}, {"q": "Which is the strongest reducing agent? (Li⁺/Li −3.04, Zn²⁺/Zn −0.76, Cu²⁺/Cu +0.34, Ag⁺/Ag +0.80 V)", "o": ["Ag", "Cu", "Zn", "Li"], "a": 3, "e": "The most negative E⦵ means Li is most easily oxidised."}, {"q": "What is the conventional representation of a Zn/Cu cell?", "o": ["Zn | Zn²⁺ || Cu²⁺ | Cu", "Cu | Cu²⁺ || Zn²⁺ | Zn", "Zn²⁺ | Zn || Cu | Cu²⁺", "Zn || Cu"], "a": 0, "e": "Oxidation half-cell on the left, metals on the outside, salt bridge as a double line."}, {"q": "How do you predict whether a redox reaction is feasible?", "o": ["If E(cell) is negative", "If E(cell) is positive", "If ΔH is positive", "If the reactants are metals"], "a": 1, "e": "A positive EMF means the reaction is thermodynamically feasible."}, {"q": "Why might a reaction with a positive E(cell) not be observed?", "o": ["It is not feasible", "The salt bridge is missing", "The activation energy may be very high, so the rate is too slow", "E(cell) is always wrong"], "a": 2, "e": "Electrode potentials predict feasibility, not rate."}, {"q": "Fe³⁺/Fe²⁺ E⦵ = +0.77 V; I₂/I⁻ E⦵ = +0.54 V. Will Fe³⁺ oxidise I⁻?", "o": ["No, because Fe³⁺ is a weaker oxidising agent", "No, because both are positive", "Only with a catalyst", "Yes, because Fe³⁺/Fe²⁺ is more positive, so E(cell) = +0.23 V"], "a": 3, "e": "Fe³⁺ is reduced and I⁻ is oxidised: 0.77 − 0.54 = +0.23 V."}, {"q": "What is the overall reaction in a hydrogen–oxygen fuel cell?", "o": ["2H₂ + O₂ → 2H₂O", "H₂ → 2H⁺ + 2e⁻", "O₂ + 4e⁻ → 2O²⁻", "H₂O → H₂ + ½O₂"], "a": 0, "e": "Hydrogen is oxidised and oxygen reduced, producing water."}, {"q": "How does a rechargeable cell differ from a non-rechargeable cell?", "o": ["It uses no chemicals", "Its reactions can be reversed by applying an external current", "It has a higher voltage", "It contains hydrogen"], "a": 1, "e": "Recharging drives the reactions backwards, regenerating the reactants."}, {"q": "What is an advantage of hydrogen fuel cells?", "o": ["Hydrogen is easy to store", "They produce CO₂", "The only product is water", "They never need refuelling"], "a": 2, "e": "No CO₂ is produced at the point of use, but hydrogen production may use fossil fuels."}, {"q": "What is a limitation of hydrogen fuel cells?", "o": ["They produce toxic gases", "They are inefficient", "They produce CO₂ directly", "Hydrogen is flammable, hard to store, and is often made using fossil fuels"], "a": 3, "e": "These issues affect the overall environmental benefit and safety."}, {"q": "In which direction are half-equations written in the electrochemical series?", "o": ["As reductions", "As oxidations", "Either", "As overall reactions"], "a": 0, "e": "All standard electrode potentials refer to the reduction reaction."}, {"q": "Why is a high-resistance voltmeter used to measure EMF?", "o": ["To speed up the reaction", "So almost no current flows and the EMF is measured accurately", "To increase voltage", "To protect the salt bridge"], "a": 1, "e": "Drawing current would change concentrations and lower the measured voltage."}, {"q": "What happens at the negative electrode of a cell?", "o": ["Reduction", "Neutralisation", "Oxidation", "Nothing"], "a": 2, "e": "The more negative half-cell is oxidised, releasing electrons into the wire."}, {"q": "Ag⁺/Ag E⦵ = +0.80 V; Cu²⁺/Cu E⦵ = +0.34 V. What is the EMF of a Cu/Ag cell?", "o": ["+1.14 V", "−0.46 V", "+0.34 V", "+0.46 V"], "a": 3, "e": "E(cell) = 0.80 − 0.34 = +0.46 V."}, {"q": "Which statement about the salt bridge is correct?", "o": ["It is often filter paper soaked in KNO₃, which doesn't react with the ions in the half-cells", "It carries electrons", "It is made of copper", "It contains chloride ions to react with silver"], "a": 0, "e": "KNO₃ is used because nitrates are soluble and don't form precipitates."}, {"q": "What happens to the concentration of Cu²⁺ in a Zn/Cu cell as it runs?", "o": ["Increases", "Decreases, as Cu²⁺ is reduced to Cu", "Stays the same", "Doubles"], "a": 1, "e": "Cu²⁺ ions gain electrons and deposit as copper metal."}]}, {"id": "3.1.12", "order": 21, "year": 2, "section": "3.1", "spec": "3.1.12", "title": "Acids and bases", "desc": "Brønsted–Lowry acids and bases, pH of strong acids and bases, Kw, Ka and pKa for weak acids, titration curves, indicators and buffers.", "practicals": [9], "summary": [{"h": "Brønsted–Lowry theory", "p": ["An **acid** is a **proton (H⁺) donor**. A **base** is a **proton acceptor**.", "Acid–base equilibria involve the **transfer of protons**."]}, {"h": "pH and strong acids", "p": ["`pH = −log₁₀[H⁺]` and `[H⁺] = 10^(−pH)`.", "**Strong acids** fully dissociate, so [H⁺] = [acid] for monoprotic acids like HCl.", "**Ionic product of water**: `Kw = [H⁺][OH⁻]` = 1.00 × 10⁻¹⁴ mol² dm⁻⁶ at 298 K. In pure water, [H⁺] = [OH⁻], so `Kw = [H⁺]²`.", "For a **strong base**: find [OH⁻], then `[H⁺] = Kw ÷ [OH⁻]`, then pH.", "Kw increases with temperature (dissociation of water is endothermic). Pure water is still neutral at higher temperature even though pH < 7."]}, {"h": "Weak acids", "p": ["**Weak acids** only **partially dissociate**: HA ⇌ H⁺ + A⁻.", "`Ka = [H⁺][A⁻] ÷ [HA]`. Units mol dm⁻³. `pKa = −log₁₀ Ka`.", "A **larger Ka** (smaller pKa) means a **stronger** acid.", "Assume [H⁺] = [A⁻] and [HA] at equilibrium ≈ initial [HA], so `[H⁺] = √(Ka × [HA])`."]}, {"h": "Titration curves and indicators", "p": ["pH curves show a **vertical section** at the equivalence point.", "Strong acid–strong base: vertical section about pH 3 to 11. Weak acid–strong base: equivalence point **above 7**. Strong acid–weak base: **below 7**. Weak–weak: no sharp vertical section.", "Choose an **indicator** whose colour change range lies **within the vertical section**. **Phenolphthalein** (8.2–10) for weak acid–strong base. **Methyl orange** (3.1–4.4) for strong acid–weak base.", "At the **half-equivalence point** of a weak acid–strong base titration, **pH = pKa**."]}, {"h": "Buffers", "p": ["A **buffer** **resists changes in pH** when small amounts of acid or base are added, or on dilution.", "**Acidic buffer**: a weak acid and its salt (e.g. ethanoic acid and sodium ethanoate). Added H⁺ reacts with A⁻; added OH⁻ reacts with HA (and the equilibrium shifts).", "**Basic buffer**: a weak base and its salt (e.g. ammonia and ammonium chloride).", "For a buffer, `[H⁺] = Ka × [HA] ÷ [A⁻]`.", "Uses: blood (carbonic acid/hydrogencarbonate buffer), shampoos, biological reagents."]}], "pitfalls": ["For strong bases, use **Kw** to get [H⁺]. Don't calculate pOH unless asked.", "In buffer calculations, the salt provides **[A⁻]**, not the acid.", "pH values are given to **2 decimal places**.", "Weak acid approximations: [H⁺] = [A⁻] and [HA] unchanged. State them if asked."], "questions": [{"q": "What is a Brønsted–Lowry acid?", "o": ["A proton acceptor", "A proton donor", "An electron pair acceptor", "A substance that produces OH⁻"], "a": 1, "e": "Brønsted–Lowry acids donate H⁺ ions."}, {"q": "What is the pH of 0.010 mol dm⁻³ HCl?", "o": ["2.00", "1.00", "0.01", "12.00"], "a": 0, "e": "HCl is strong, so [H⁺] = 0.010. pH = −log(0.010) = 2.00."}, {"q": "What is [H⁺] in a solution of pH 3.50?", "o": ["3.50 mol dm⁻³", "−3.50 mol dm⁻³", "3.16 × 10⁻⁴ mol dm⁻³", "0.35 mol dm⁻³"], "a": 2, "e": "[H⁺] = 10⁻³·⁵⁰ = 3.16 × 10⁻⁴ mol dm⁻³."}, {"q": "What is the value of Kw at 298 K?", "o": ["1.00 × 10⁻⁷ mol dm⁻³", "7.00", "1.00 × 10¹⁴", "1.00 × 10⁻¹⁴ mol² dm⁻⁶"], "a": 3, "e": "Kw = [H⁺][OH⁻] = 1.00 × 10⁻¹⁴ mol² dm⁻⁶ at 298 K."}, {"q": "What is the pH of 0.10 mol dm⁻³ NaOH? (Kw = 1.00 × 10⁻¹⁴)", "o": ["13.00", "1.00", "7.00", "14.00"], "a": 0, "e": "[OH⁻] = 0.10. [H⁺] = 1.00 × 10⁻¹⁴ ÷ 0.10 = 1.00 × 10⁻¹³. pH = 13.00."}, {"q": "Why is pure water at 50 °C still neutral, even though its pH is below 7?", "o": ["It contains acid", "[H⁺] still equals [OH⁻]", "Kw decreases", "It contains more OH⁻"], "a": 1, "e": "Neutral means equal [H⁺] and [OH⁻]. Kw increases with temperature, so both increase equally."}, {"q": "What is a weak acid?", "o": ["A dilute acid", "An acid that fully dissociates", "An acid that only partially dissociates in water", "An acid with pH 7"], "a": 2, "e": "Weak acids set up an equilibrium with only a small proportion of molecules dissociated."}, {"q": "What is the Ka expression for HA ⇌ H⁺ + A⁻?", "o": ["[HA] ÷ [H⁺][A⁻]", "[H⁺] × [HA]", "[H⁺] ÷ [A⁻]", "[H⁺][A⁻] ÷ [HA]"], "a": 3, "e": "Products over reactants, as for any equilibrium constant."}, {"q": "Ka of a weak acid is 1.74 × 10⁻⁵ mol dm⁻³ and its concentration is 0.100 mol dm⁻³. What is the pH?", "o": ["2.88", "4.76", "1.00", "5.76"], "a": 0, "e": "[H⁺] = √(1.74 × 10⁻⁵ × 0.100) = 1.32 × 10⁻³. pH = 2.88."}, {"q": "Which acid is the strongest?", "o": ["pKa = 4.8", "pKa = 3.1", "pKa = 9.2", "pKa = 6.4"], "a": 1, "e": "A smaller pKa means a larger Ka, so the acid dissociates more."}, {"q": "What is pKa?", "o": ["log Ka", "Ka²", "−log₁₀ Ka", "1/Ka"], "a": 2, "e": "pKa = −log₁₀ Ka, just as pH = −log₁₀[H⁺]."}, {"q": "At the half-equivalence point of a weak acid–strong base titration, what is true?", "o": ["pH = 7", "pH = 14", "Ka = 1", "pH = pKa"], "a": 3, "e": "Half the acid has reacted, so [HA] = [A⁻], and Ka = [H⁺]."}, {"q": "Which indicator suits a weak acid–strong base titration?", "o": ["Phenolphthalein", "Methyl orange", "Either", "Neither"], "a": 0, "e": "The equivalence point is above 7, and phenolphthalein changes in the range 8.2–10."}, {"q": "Which indicator suits a strong acid–weak base titration?", "o": ["Phenolphthalein", "Methyl orange", "Universal indicator", "Litmus"], "a": 1, "e": "The vertical section is in the acidic range, matching methyl orange (3.1–4.4)."}, {"q": "Why is no indicator suitable for a weak acid–weak base titration?", "o": ["The pH stays at 7", "The reaction is too fast", "There is no sharp vertical section in the pH curve", "Weak acids don't react with bases"], "a": 2, "e": "The pH changes gradually, so no indicator changes colour sharply at the equivalence point."}, {"q": "What is a buffer?", "o": ["A strong acid", "A solution with pH 7", "A catalyst", "A solution that resists changes in pH when small amounts of acid or base are added"], "a": 3, "e": "Buffers keep pH almost constant."}, {"q": "What does an acidic buffer contain?", "o": ["A weak acid and its salt", "A strong acid and its salt", "A strong acid and strong base", "Water only"], "a": 0, "e": "E.g. ethanoic acid and sodium ethanoate."}, {"q": "How does an ethanoic acid/ethanoate buffer respond to added H⁺?", "o": ["H⁺ reacts with ethanoic acid", "H⁺ reacts with ethanoate ions (CH₃COO⁻) to form ethanoic acid", "pH falls sharply", "H⁺ reacts with water"], "a": 1, "e": "The large reservoir of A⁻ removes added H⁺, so [H⁺] barely changes."}, {"q": "A buffer has [HA] = 0.20 and [A⁻] = 0.40 mol dm⁻³, with Ka = 1.8 × 10⁻⁵. What is [H⁺]?", "o": ["3.6 × 10⁻⁵", "1.8 × 10⁻⁵", "9.0 × 10⁻⁶", "7.2 × 10⁻⁶"], "a": 2, "e": "[H⁺] = Ka × [HA] ÷ [A⁻] = 1.8 × 10⁻⁵ × 0.20 ÷ 0.40 = 9.0 × 10⁻⁶."}, {"q": "Which buffer system controls blood pH?", "o": ["Ammonia/ammonium", "Ethanoic acid/ethanoate", "Phosphoric acid only", "Carbonic acid/hydrogencarbonate"], "a": 3, "e": "H₂CO₃ ⇌ H⁺ + HCO₃⁻ keeps blood pH close to 7.4."}, {"q": "How does a buffer respond to added OH⁻?", "o": ["OH⁻ reacts with HA (or H⁺), and more HA dissociates to replace H⁺", "OH⁻ reacts with A⁻", "pH rises sharply", "Nothing happens"], "a": 0, "e": "The weak acid neutralises the hydroxide, keeping [H⁺] nearly constant."}, {"q": "What is the pH of a solution with [H⁺] = 2.5 × 10⁻⁴ mol dm⁻³?", "o": ["4.00", "3.60", "2.50", "10.40"], "a": 1, "e": "pH = −log(2.5 × 10⁻⁴) = 3.60."}]}, {"id": "3.2.4", "order": 22, "year": 2, "section": "3.2", "spec": "3.2.4", "title": "Properties of Period 3 elements and their oxides", "desc": "Reactions of Na, Mg, Al, Si, P and S with oxygen and water, structure and melting points of the oxides, and their acid–base behaviour.", "practicals": [], "summary": [{"h": "Reactions with water", "p": ["**Sodium** reacts vigorously with cold water: `2Na + 2H₂O → 2NaOH + H₂`. Solution pH **13–14**.", "**Magnesium** reacts very slowly with cold water: `Mg + 2H₂O → Mg(OH)₂ + H₂`. Solution pH about **9–10** (Mg(OH)₂ is sparingly soluble)."]}, {"h": "Reactions with oxygen", "p": ["Na burns with a **yellow** flame to form Na₂O. Mg burns with a **bright white** flame to form MgO.", "Al forms Al₂O₃; Si forms SiO₂; P burns with a white flame to form P₄O₁₀; S burns with a **blue** flame to form SO₂."]}, {"h": "Structure and melting points of the oxides", "p": ["**Na₂O, MgO, Al₂O₃**: **giant ionic**, high melting points. MgO > Na₂O because Mg²⁺ has a higher charge. Al₂O₃ is lower than expected because it has some **covalent character**.", "**SiO₂**: **macromolecular**, very high melting point (many strong covalent bonds).", "**P₄O₁₀, SO₂**: **simple molecular**, low melting points (weak intermolecular forces). P₄O₁₀ is larger, so higher than SO₂."]}, {"h": "Oxides with water", "p": ["**Na₂O** + H₂O → 2NaOH (pH 12–14). **MgO** + H₂O → Mg(OH)₂ (pH about 9).", "**Al₂O₃** and **SiO₂** are **insoluble** in water (pH 7).", "**P₄O₁₀** + 6H₂O → 4H₃PO₄ (pH 0–1). **SO₂** + H₂O → H₂SO₃ (pH 2–3). **SO₃** + H₂O → H₂SO₄ (pH 0–1).", "**Ionic** oxides are **basic** (release O²⁻, which reacts with water to give OH⁻). **Covalent** oxides are **acidic**."]}, {"h": "Acid–base reactions", "p": ["**Basic oxides** (Na₂O, MgO) react with acids to form salts and water.", "**Al₂O₃** is **amphoteric**: it reacts with acids **and** bases. With NaOH: `Al₂O₃ + 2NaOH + 3H₂O → 2NaAl(OH)₄`.", "**SiO₂** is acidic: it reacts with hot concentrated NaOH to form sodium silicate: `SiO₂ + 2NaOH → Na₂SiO₃ + H₂O`.", "**P₄O₁₀** and **SO₂/SO₃** react with bases to form salts, e.g. phosphates and sulfites/sulfates."]}], "pitfalls": ["Al₂O₃ is **amphoteric**. Give equations with both an acid and a base.", "SiO₂ doesn't react with water but is still classed as **acidic** (it reacts with bases).", "Explain melting points with **structure and bonding type** for each oxide."], "questions": [{"q": "What is the product of sodium reacting with cold water?", "o": ["Na₂O and H₂", "NaOH and H₂", "NaH and O₂", "Na₂O₂"], "a": 1, "e": "2Na + 2H₂O → 2NaOH + H₂."}, {"q": "What is the approximate pH of the solution formed when sodium reacts with water?", "o": ["13–14", "7", "9–10", "1–2"], "a": 0, "e": "NaOH is a strong alkali that dissolves fully."}, {"q": "Why is the solution formed by magnesium with water only weakly alkaline (about pH 9–10)?", "o": ["MgO forms", "Mg is not a metal", "Mg(OH)₂ is only sparingly soluble", "Magnesium doesn't react"], "a": 2, "e": "Little Mg(OH)₂ dissolves, so the OH⁻ concentration is low."}, {"q": "What colour flame does sulfur burn with?", "o": ["Yellow", "Bright white", "Red", "Blue"], "a": 3, "e": "Sulfur burns with a blue flame forming SO₂."}, {"q": "What type of structure does SiO₂ have?", "o": ["Macromolecular", "Giant ionic", "Simple molecular", "Metallic"], "a": 0, "e": "Each Si is covalently bonded to 4 O in a giant network."}, {"q": "Why does MgO have a higher melting point than Na₂O?", "o": ["MgO is covalent", "Mg²⁺ has a higher charge than Na⁺, giving stronger ionic attraction", "MgO is macromolecular", "Na₂O has more ions"], "a": 1, "e": "Higher charge and smaller ion size give stronger electrostatic attraction."}, {"q": "Why is the melting point of Al₂O₃ lower than expected for an ionic oxide?", "o": ["Al³⁺ is large", "It is simple molecular", "It has some covalent character, because Al³⁺ polarises oxide ions", "It is metallic"], "a": 2, "e": "The small, highly charged Al³⁺ distorts O²⁻, giving partial covalent bonding."}, {"q": "Why do P₄O₁₀ and SO₂ have low melting points?", "o": ["They are ionic", "They are macromolecular", "They have metallic bonding", "They are simple molecular, with only weak intermolecular forces"], "a": 3, "e": "Melting only requires overcoming van der Waals and dipole–dipole forces."}, {"q": "What forms when P₄O₁₀ reacts with water?", "o": ["Phosphoric(V) acid, H₃PO₄", "Phosphine", "Phosphorus", "Sodium phosphate"], "a": 0, "e": "P₄O₁₀ + 6H₂O → 4H₃PO₄, a strongly acidic solution."}, {"q": "What is the pH of the solution formed when SO₂ dissolves in water?", "o": ["12", "2–3", "7", "9"], "a": 1, "e": "SO₂ forms sulfurous acid, H₂SO₃, a weak acid."}, {"q": "What does it mean that Al₂O₃ is amphoteric?", "o": ["It dissolves in water", "It only reacts with acids", "It reacts with both acids and bases", "It is acidic only"], "a": 2, "e": "Al₂O₃ shows both basic and acidic behaviour."}, {"q": "What forms when Al₂O₃ reacts with sodium hydroxide solution?", "o": ["Al(OH)₃ only", "Al and NaOH", "Al₂(SO₄)₃", "NaAl(OH)₄"], "a": 3, "e": "Al₂O₃ + 2NaOH + 3H₂O → 2NaAl(OH)₄."}, {"q": "Why is SiO₂ classed as an acidic oxide even though it doesn't dissolve in water?", "o": ["It reacts with bases such as hot concentrated NaOH to form a salt", "It reacts with acids", "It has a low pH", "It is ionic"], "a": 0, "e": "SiO₂ + 2NaOH → Na₂SiO₃ + H₂O."}, {"q": "Why are ionic oxides like Na₂O basic?", "o": ["They contain H⁺", "Their oxide ions (O²⁻) react with water to form OH⁻ ions", "They are covalent", "They form acids"], "a": 1, "e": "O²⁻ + H₂O → 2OH⁻."}, {"q": "What is the trend in the oxides across Period 3?", "o": ["From acidic to basic", "All basic", "From basic (ionic) through amphoteric to acidic (covalent)", "All amphoteric"], "a": 2, "e": "Metal oxides on the left are basic; non-metal oxides on the right are acidic."}, {"q": "What is formed when MgO reacts with hydrochloric acid?", "o": ["MgH₂", "Mg(OH)₂", "Mg and water", "MgCl₂ and water"], "a": 3, "e": "MgO + 2HCl → MgCl₂ + H₂O. A basic oxide neutralises an acid."}, {"q": "Which oxide forms a solution of pH about 0–1 with water?", "o": ["SO₃", "MgO", "Na₂O", "Al₂O₃"], "a": 0, "e": "SO₃ + H₂O → H₂SO₄, a strong acid."}, {"q": "What colour flame does magnesium burn with?", "o": ["Yellow", "Bright white", "Blue", "Green"], "a": 1, "e": "Magnesium burns with a dazzling white flame, forming MgO."}, {"q": "Write the equation for SO₂ reacting with sodium hydroxide.", "o": ["SO₂ + NaOH → NaSO₂ + H", "SO₂ + H₂O → H₂SO₃", "SO₂ + 2NaOH → Na₂SO₃ + H₂O", "SO₂ + Na → NaSO₂"], "a": 2, "e": "An acidic oxide reacts with a base to form a salt (sodium sulfite) and water."}, {"q": "Why does P₄O₁₀ have a higher melting point than SO₂?", "o": ["P₄O₁₀ is ionic", "P₄O₁₀ is macromolecular", "SO₂ has hydrogen bonds", "P₄O₁₀ molecules are larger, with more electrons, so stronger van der Waals forces"], "a": 3, "e": "Both are simple molecular, but P₄O₁₀ is a bigger molecule."}, {"q": "Why don't Al₂O₃ and SiO₂ change the pH of water?", "o": ["They are insoluble in water", "They are neutral oxides", "They react to give pH 7", "They are gases"], "a": 0, "e": "Neither dissolves, so the water stays at pH 7."}, {"q": "What is the product of sodium burning in oxygen?", "o": ["NaO", "Na₂O", "NaO₂ only", "Na₂O₃"], "a": 1, "e": "4Na + O₂ → 2Na₂O."}]}, {"id": "3.2.5", "order": 23, "year": 2, "section": "3.2", "spec": "3.2.5", "title": "Transition metals", "desc": "Characteristic properties, ligands and complex shapes, colour, variable oxidation states, redox titrations, catalysts and homogeneous and heterogeneous catalysis.", "practicals": [], "summary": [{"h": "General properties", "p": ["Transition metals (Ti to Cu) have an **incomplete d sub-level** in their atoms or ions.", "Characteristic properties: **complex formation**, **coloured ions**, **variable oxidation states**, and **catalytic activity**."]}, {"h": "Complexes and ligands", "p": ["A **complex** is a central metal atom or ion surrounded by **ligands**.", "A **ligand** is a molecule or ion that forms a **co-ordinate bond** with the metal by **donating a lone pair**.", "**Co-ordination number**: the number of co-ordinate bonds to the central metal.", "**Monodentate** ligands (one bond): H₂O, NH₃, Cl⁻. **Bidentate** (two bonds): ethane-1,2-diamine (en), ethanedioate (C₂O₄²⁻). **Multidentate**: EDTA⁴⁻ (six bonds).", "Haem in haemoglobin is a multidentate ligand around Fe²⁺. CO is toxic because it **replaces O₂** and binds more strongly.", "**Chelate effect**: replacing monodentate ligands with multidentate ones increases the **number of particles**, so **entropy increases** and the reaction is feasible."]}, {"h": "Shapes of complexes", "p": ["Small ligands like H₂O and NH₃: **octahedral**, co-ordination number 6, 90°.", "Larger ligands like **Cl⁻**: **tetrahedral**, co-ordination number 4, 109.5°.", "**Square planar**: e.g. cisplatin, Pt(NH₃)₂Cl₂, 90°. **Linear**: e.g. [Ag(NH₃)₂]⁺ in Tollens' reagent.", "Octahedral complexes can show **cis–trans** isomerism; those with bidentate ligands can show **optical** isomerism. Square planar can show cis–trans (cisplatin is the cis isomer)."]}, {"h": "Colour", "p": ["Ligands **split** the d orbitals into two energy levels. Electrons absorb visible light and are **excited** to the higher level: `ΔE = hν = hc/λ`.", "The **colour seen** is the **complementary** colour to the light absorbed (the light transmitted).", "Changes in **oxidation state**, **co-ordination number** or **ligand** change ΔE and so change colour.", "**Colorimetry** measures absorbance to find concentration, using a calibration curve."]}, {"h": "Variable oxidation states and redox titrations", "p": ["Examples: vanadium: VO₂⁺ (+5, yellow), VO²⁺ (+4, blue), V³⁺ (green), V²⁺ (violet), reduced by **zinc in acid**.", "**Cr₂O₇²⁻** (orange, +6) can be reduced to **Cr³⁺** (green). Zinc reduces Cr³⁺ to Cr²⁺ (blue).", "The redox potential of a transition metal ion changes with **pH** and **ligand**. E.g. Ag⁺ is reduced to Ag in Tollens' reagent.", "**Redox titrations**: MnO₄⁻ is purple and self-indicating: `MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺`. End point: first **permanent pale pink**."]}, {"h": "Catalysts", "p": ["Transition metals are good catalysts because they have **variable oxidation states**.", "**Heterogeneous**: in a different phase from the reactants, e.g. **iron** in the Haber process, **V₂O₅** in the Contact process. Reaction happens at **active sites** on the surface. Supports increase surface area; **poisoning** (e.g. by sulfur) blocks sites.", "Contact process with V₂O₅: `SO₂ + V₂O₅ → SO₃ + V₂O₄`, then `2V₂O₄ + O₂ → 2V₂O₅`.", "**Homogeneous**: same phase, working through an **intermediate**. E.g. **Fe²⁺** catalyses the reaction between **I⁻ and S₂O₈²⁻**, which have a high Ea because both ions are negative and repel.", "**Autocatalysis**: a product catalyses the reaction. E.g. **Mn²⁺** catalyses the reaction between MnO₄⁻ and C₂O₄²⁻."]}], "pitfalls": ["A ligand donates a **lone pair**, forming a **co-ordinate (dative)** bond.", "The colour seen is what is **transmitted**, not what is absorbed.", "The chelate effect is explained by **entropy increase**, as there are more particles in the products.", "Zn is not a transition metal: Zn²⁺ has a full 3d¹⁰ sub-level."], "questions": [{"q": "What is the definition of a transition metal?", "o": ["Any metal in the d-block", "An element that forms at least one stable ion with an incomplete d sub-level", "A metal with variable charge", "Any coloured metal"], "a": 1, "e": "Zinc and scandium are in the d-block but aren't classed as transition metals by this definition."}, {"q": "What is a ligand?", "o": ["A molecule or ion that donates a lone pair to form a co-ordinate bond with a metal", "A positive ion", "A metal atom", "A type of catalyst"], "a": 0, "e": "Ligands must have at least one lone pair."}, {"q": "What is the co-ordination number of [Cu(H₂O)₆]²⁺?", "o": ["2", "4", "6", "8"], "a": 2, "e": "Six water ligands each form one co-ordinate bond."}, {"q": "What shape is [CuCl₄]²⁻?", "o": ["Octahedral", "Square planar", "Linear", "Tetrahedral"], "a": 3, "e": "Cl⁻ is a large ligand, so only four fit around Cu²⁺, in a tetrahedral arrangement."}, {"q": "Which is a bidentate ligand?", "o": ["Ethane-1,2-diamine", "Water", "Ammonia", "EDTA⁴⁻"], "a": 0, "e": "Ethane-1,2-diamine (H₂NCH₂CH₂NH₂) has two N atoms, each donating a lone pair."}, {"q": "How many co-ordinate bonds does EDTA⁴⁻ form?", "o": ["2", "6", "4", "1"], "a": 1, "e": "EDTA⁴⁻ is hexadentate: it wraps around the metal with six bonds."}, {"q": "Why is carbon monoxide toxic?", "o": ["It forms acid", "It destroys red blood cells", "It binds to the Fe²⁺ in haemoglobin more strongly than O₂, replacing it", "It reacts with water"], "a": 2, "e": "CO prevents haemoglobin carrying oxygen."}, {"q": "What is the chelate effect?", "o": ["Multidentate ligands form weaker complexes", "Ligands get larger", "Colour change on ligand substitution", "Multidentate ligands replace monodentate ligands, increasing the number of particles and entropy"], "a": 3, "e": "E.g. [Cu(H₂O)₆]²⁺ + EDTA⁴⁻ → [CuEDTA]²⁻ + 6H₂O: 2 particles become 7."}, {"q": "Cisplatin is used as an anticancer drug. What is its shape?", "o": ["Square planar", "Tetrahedral", "Octahedral", "Linear"], "a": 0, "e": "Pt(NH₃)₂Cl₂ is square planar, with the two Cl on the same side (cis)."}, {"q": "What is the shape of [Ag(NH₃)₂]⁺?", "o": ["Square planar", "Linear", "Tetrahedral", "Octahedral"], "a": 1, "e": "Two ligands at 180°. This is the active species in Tollens' reagent."}, {"q": "Why are transition metal complexes coloured?", "o": ["They emit light", "They contain s electrons", "Ligands split d orbitals; electrons absorb visible light to jump between levels, and the complementary colour is seen", "They reflect all light"], "a": 2, "e": "Absorbed frequencies depend on ΔE between split d orbitals."}, {"q": "Which equation links the energy gap to the light absorbed?", "o": ["E = mc²", "pV = nRT", "q = mcΔT", "ΔE = hν"], "a": 3, "e": "ΔE = hν = hc/λ, where h is Planck's constant."}, {"q": "Which change does NOT change the colour of a complex?", "o": ["Diluting the solution slightly with water (same ligands)", "Changing the ligand", "Changing the oxidation state", "Changing the co-ordination number"], "a": 0, "e": "Dilution makes the colour paler but not a different colour, since ΔE is unchanged."}, {"q": "What colour is vanadium in the +4 oxidation state (VO²⁺)?", "o": ["Yellow", "Blue", "Green", "Violet"], "a": 1, "e": "VO₂⁺ (+5) yellow, VO²⁺ (+4) blue, V³⁺ (+3) green, V²⁺ (+2) violet."}, {"q": "What is seen at the end point of a manganate(VII) titration with Fe²⁺?", "o": ["Colourless to orange", "Green to brown", "The first permanent pale pink colour", "Purple to green"], "a": 2, "e": "Once all Fe²⁺ has reacted, excess MnO₄⁻ makes the solution pink. It's self-indicating."}, {"q": "In the titration MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺, 0.0010 mol MnO₄⁻ is used. How many moles of Fe²⁺ reacted?", "o": ["0.0010", "0.0002", "0.0080", "0.0050"], "a": 3, "e": "The ratio is 1 MnO₄⁻ : 5 Fe²⁺, so 0.0050 mol."}, {"q": "Why are transition metals good catalysts?", "o": ["They have variable oxidation states", "They are very reactive", "They have full d sub-levels", "They are always solid"], "a": 0, "e": "They can gain and lose electrons easily, forming intermediates that lower Ea."}, {"q": "What is a heterogeneous catalyst?", "o": ["A catalyst in the same phase as the reactants", "A catalyst in a different phase from the reactants", "A product that catalyses its own reaction", "An enzyme"], "a": 1, "e": "E.g. solid iron catalysing gaseous N₂ and H₂ in the Haber process."}, {"q": "How does V₂O₅ act as a catalyst in the Contact process?", "o": ["It provides heat", "It is a reducing agent only", "It oxidises SO₂ to SO₃, being reduced to V₂O₄, which is then reoxidised by O₂", "It absorbs SO₃"], "a": 2, "e": "The vanadium changes oxidation state and is regenerated."}, {"q": "Why is the reaction between I⁻ and S₂O₈²⁻ slow without a catalyst?", "o": ["It is endothermic", "The ions are too large", "Iodine is a solid", "Both ions are negative, so they repel, giving a high activation energy"], "a": 3, "e": "Fe²⁺ catalyses it by reacting with S₂O₈²⁻ first, then Fe³⁺ reacts with I⁻."}, {"q": "What is autocatalysis?", "o": ["When a product of the reaction acts as a catalyst for the reaction", "When a catalyst is poisoned", "When no catalyst is needed", "When the catalyst is a solid"], "a": 0, "e": "E.g. Mn²⁺ formed in the MnO₄⁻/C₂O₄²⁻ reaction speeds up the reaction."}, {"q": "How does catalyst poisoning reduce efficiency?", "o": ["It changes oxidation state", "Impurities bind to the active sites on the surface, blocking reactants", "It increases temperature", "It dissolves the catalyst"], "a": 1, "e": "E.g. sulfur impurities poison the iron catalyst in the Haber process."}]}, {"id": "3.2.6", "order": 24, "year": 2, "section": "3.2", "spec": "3.2.6", "title": "Reactions of ions in aqueous solution", "desc": "Acidity of hexaaqua ions, reactions of metal aqua ions with OH⁻, NH₃ and CO₃²⁻, amphoteric aluminium hydroxide, and ligand substitution.", "practicals": [11], "summary": [{"h": "Metal aqua ions", "p": ["In water, metal ions form **hexaaqua ions**: [M(H₂O)₆]²⁺ or [M(H₂O)₆]³⁺.", "**M³⁺ aqua ions are more acidic** than M²⁺ because M³⁺ has a **higher charge density**. It **polarises** the water ligands more, weakening the O–H bonds so H⁺ is released more easily.", "`[Fe(H₂O)₆]³⁺ + H₂O ⇌ [Fe(H₂O)₅(OH)]²⁺ + H₃O⁺`"]}, {"h": "Reactions with NaOH and NH₃ (hydrolysis)", "p": ["OH⁻ or NH₃ removes H⁺ from the aqua ion, forming a neutral **metal hydroxide precipitate**.", "**[Cu(H₂O)₆]²⁺** (blue solution) → Cu(H₂O)₄(OH)₂, **blue precipitate**.", "**[Fe(H₂O)₆]²⁺** (green solution) → Fe(H₂O)₄(OH)₂, **green precipitate** (turns brown in air).", "**[Fe(H₂O)₆]³⁺** (yellow/brown solution) → Fe(H₂O)₃(OH)₃, **brown precipitate**.", "**[Al(H₂O)₆]³⁺** (colourless solution) → Al(H₂O)₃(OH)₃, **white precipitate**."]}, {"h": "Excess reagents", "p": ["**Al(OH)₃ is amphoteric**: in **excess NaOH** it dissolves to form **[Al(OH)₄]⁻**, a colourless solution.", "In **excess ammonia**, Cu(OH)₂ dissolves to form **[Cu(NH₃)₄(H₂O)₂]²⁺**, a **deep blue solution**. This is ligand substitution.", "Other hydroxides (Fe²⁺, Fe³⁺, Al³⁺) don't dissolve in excess ammonia."]}, {"h": "Reactions with carbonate", "p": ["**M²⁺** ions form **metal carbonate precipitates**: CuCO₃ (blue-green), FeCO₃ (green).", "**M³⁺** ions are acidic enough to react with carbonate, giving **hydroxide precipitates and CO₂ (effervescence)**: Fe(OH)₃ (brown) and Al(OH)₃ (white)."]}, {"h": "Ligand substitution", "p": ["**H₂O and NH₃** are similar in size and uncharged, so substitution happens **without a change in co-ordination number**: e.g. [Co(H₂O)₆]²⁺ → [Co(NH₃)₆]²⁺.", "**Cl⁻** is larger, so substitution **changes** co-ordination number from 6 to 4: `[Cu(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CuCl₄]²⁻ + 6H₂O`. Blue → **yellow-green**. Use concentrated HCl.", "`[Co(H₂O)₆]²⁺` (pink) + 4Cl⁻ ⇌ `[CoCl₄]²⁻` (blue)."]}], "pitfalls": ["M³⁺ + carbonate gives a **hydroxide + CO₂**, not a carbonate. M²⁺ gives a carbonate precipitate.", "Only **Al(OH)₃** dissolves in excess NaOH. Only **Cu(OH)₂** (of these) dissolves in excess NH₃.", "Explain acidity using **charge density** and **polarisation** of O–H bonds."], "questions": [{"q": "Why is [Fe(H₂O)₆]³⁺ more acidic than [Fe(H₂O)₆]²⁺?", "o": ["Fe³⁺ is larger", "Fe³⁺ has a higher charge density, polarising the water ligands more so H⁺ is released more easily", "Fe²⁺ forms more bonds", "Fe³⁺ is a weaker acid"], "a": 1, "e": "The smaller, more highly charged ion pulls electron density from O–H bonds, weakening them."}, {"q": "What is seen when NaOH is added to [Cu(H₂O)₆]²⁺(aq)?", "o": ["A blue precipitate", "A green precipitate", "A deep blue solution", "A brown precipitate"], "a": 0, "e": "Cu(H₂O)₄(OH)₂ forms as a blue precipitate."}, {"q": "What is seen when excess ammonia is added to a copper(II) solution?", "o": ["A brown precipitate", "A white precipitate that remains", "A blue precipitate that dissolves to form a deep blue solution", "Effervescence"], "a": 2, "e": "[Cu(NH₃)₄(H₂O)₂]²⁺ forms, which is deep blue."}, {"q": "What colour precipitate does Fe²⁺(aq) form with NaOH?", "o": ["Brown", "White", "Blue", "Green, turning brown on standing in air"], "a": 3, "e": "Fe(OH)₂ is green, and is oxidised by air to brown Fe(OH)₃."}, {"q": "What colour precipitate does Fe³⁺(aq) form with NaOH?", "o": ["Brown", "Green", "Blue", "White"], "a": 0, "e": "Fe(H₂O)₃(OH)₃ is a brown precipitate."}, {"q": "What happens when excess NaOH is added to Al(H₂O)₃(OH)₃?", "o": ["Nothing", "The white precipitate dissolves to form [Al(OH)₄]⁻, a colourless solution", "A blue solution forms", "A brown precipitate forms"], "a": 1, "e": "Aluminium hydroxide is amphoteric, so it reacts with excess base."}, {"q": "What is seen when sodium carbonate is added to Fe³⁺(aq)?", "o": ["A green precipitate only", "No change", "A brown precipitate and effervescence", "A white precipitate only"], "a": 2, "e": "[Fe(H₂O)₆]³⁺ is acidic enough to release CO₂ from carbonate, forming Fe(OH)₃."}, {"q": "What is seen when sodium carbonate is added to Cu²⁺(aq)?", "o": ["A brown precipitate and effervescence", "A deep blue solution", "A white precipitate", "A blue-green precipitate of CuCO₃"], "a": 3, "e": "M²⁺ ions are less acidic, so a metal carbonate precipitates without effervescence."}, {"q": "Why do M³⁺ ions give hydroxides, not carbonates, with Na₂CO₃?", "o": ["The M³⁺ aqua ions are acidic enough to react with carbonate, releasing CO₂", "M³⁺ carbonates are coloured", "Carbonate is a ligand", "M³⁺ ions are larger"], "a": 0, "e": "H⁺ from the acidic aqua ions reacts with CO₃²⁻ to form CO₂ and water."}, {"q": "What happens when concentrated HCl is added to [Cu(H₂O)₆]²⁺?", "o": ["A blue precipitate forms", "The solution turns yellow-green as [CuCl₄]²⁻ forms", "A deep blue solution forms", "No change"], "a": 1, "e": "Six water ligands are replaced by four chloride ligands."}, {"q": "Why does the co-ordination number change from 6 to 4 when Cl⁻ replaces H₂O?", "o": ["Cl⁻ is smaller", "Cl⁻ is neutral", "Cl⁻ ligands are larger than H₂O, so only four fit around the metal", "Cl⁻ forms two bonds each"], "a": 2, "e": "The bigger Cl⁻ ions can't fit six around the central ion."}, {"q": "Why does substitution of H₂O by NH₃ not change the co-ordination number?", "o": ["NH₃ is charged", "NH₃ is bidentate", "NH₃ is much larger", "NH₃ and H₂O are similar in size and both uncharged"], "a": 3, "e": "Six NH₃ ligands can fit just as six H₂O can."}, {"q": "What is the colour of [CoCl₄]²⁻?", "o": ["Blue", "Pink", "Green", "Yellow"], "a": 0, "e": "[Co(H₂O)₆]²⁺ is pink and [CoCl₄]²⁻ is blue."}, {"q": "What is the colour of [Al(H₂O)₆]³⁺(aq)?", "o": ["Blue", "Colourless", "Brown", "Green"], "a": 1, "e": "Al³⁺ has no d electrons, so it doesn't absorb visible light."}, {"q": "Which hydroxide dissolves in excess ammonia?", "o": ["Fe(OH)₃", "Fe(OH)₂", "Cu(OH)₂", "Al(OH)₃"], "a": 2, "e": "Cu(OH)₂ forms the deep blue complex [Cu(NH₃)₄(H₂O)₂]²⁺."}, {"q": "What is the equation for the hydrolysis of [Al(H₂O)₆]³⁺ in water?", "o": ["[Al(H₂O)₆]³⁺ → Al³⁺ + 6H₂O", "[Al(H₂O)₆]³⁺ + OH⁻ → [Al(OH)₆]³⁻", "[Al(H₂O)₆]³⁺ + Cl⁻ → [AlCl₄]⁻", "[Al(H₂O)₆]³⁺ + H₂O ⇌ [Al(H₂O)₅(OH)]²⁺ + H₃O⁺"], "a": 3, "e": "The aqua ion donates H⁺ to water, making the solution acidic."}, {"q": "What is the formula of the hydroxide precipitate from Fe³⁺ aqua ions?", "o": ["Fe(H₂O)₃(OH)₃", "Fe(OH)₂", "[Fe(OH)₄]⁻", "Fe(H₂O)₆(OH)₃"], "a": 0, "e": "Three H⁺ are removed from [Fe(H₂O)₆]³⁺, forming a neutral complex."}, {"q": "What role does ammonia play when added dropwise to a metal aqua ion?", "o": ["Ligand only", "Base: it removes H⁺ from water ligands", "Oxidising agent", "Catalyst"], "a": 1, "e": "In small amounts NH₃ acts as a base. In excess it may also act as a ligand (e.g. with Cu²⁺)."}, {"q": "A solution gives a white precipitate with NaOH that dissolves in excess NaOH, and a white precipitate with Na₂CO₃ plus effervescence. Which ion is present?", "o": ["Cu²⁺", "Fe²⁺", "Al³⁺", "Fe³⁺"], "a": 2, "e": "Amphoteric white hydroxide and acidity with carbonate show Al³⁺."}, {"q": "What colour is [Fe(H₂O)₆]²⁺(aq)?", "o": ["Brown", "Blue", "Colourless", "Pale green"], "a": 3, "e": "Iron(II) aqua ions are pale green."}, {"q": "What is the colour of [Cu(H₂O)₆]²⁺(aq)?", "o": ["Blue", "Green", "Yellow", "Colourless"], "a": 0, "e": "Hexaaquacopper(II) ions are blue."}, {"q": "Why does Fe(OH)₂ turn brown when left in air?", "o": ["It reacts with CO₂", "It is oxidised by oxygen to Fe(OH)₃", "It loses water", "It forms a complex with N₂"], "a": 1, "e": "Iron(II) is oxidised to iron(III), which is brown."}]}, {"id": "3.3.7", "order": 25, "year": 2, "section": "3.3", "spec": "3.3.7", "title": "Optical isomerism", "desc": "Chiral centres, enantiomers, plane-polarised light, racemic mixtures, and why some reactions give racemic products.", "practicals": [], "summary": [{"h": "Chirality", "p": ["**Optical isomerism** is a form of stereoisomerism.", "It happens when a molecule has a **chiral centre**: a carbon atom bonded to **four different groups**.", "The two isomers are **enantiomers**: **non-superimposable mirror images**.", "Draw enantiomers in 3D using wedge and dashed bonds, as mirror images of each other."]}, {"h": "Properties of enantiomers", "p": ["Enantiomers have **identical** physical and chemical properties, except they **rotate plane-polarised light** in **opposite directions** (by the same angle).", "They may also interact differently with other chiral molecules, such as **enzymes** and receptors in the body. This matters for drugs (e.g. thalidomide)."]}, {"h": "Racemic mixtures", "p": ["A **racemic mixture (racemate)** contains **equal amounts** of both enantiomers.", "It has **no effect** on plane-polarised light, because the rotations cancel.", "Reactions that go through a **planar** intermediate or group give racemic mixtures. E.g. nucleophilic addition of **HCN** to a **planar C=O** group: CN⁻ can attack **from either side** with **equal probability**.", "Similarly, a planar **carbocation** intermediate can be attacked from either side."]}], "pitfalls": ["A chiral centre needs **four different** groups. Two CH₂ chain groups of different length still count as different.", "Enantiomers rotate light in **opposite** directions. A racemate is **optically inactive**.", "Explain racemates by the **planar** group and **equal probability** of attack from either side."], "questions": [{"q": "What is a chiral centre?", "o": ["A carbon with a double bond", "A carbon atom bonded to four different groups", "A carbon with two identical groups", "Any carbon in a ring"], "a": 1, "e": "A carbon with four different groups has two non-superimposable arrangements."}, {"q": "What are enantiomers?", "o": ["Non-superimposable mirror images", "Structural isomers", "E/Z isomers", "Identical molecules"], "a": 0, "e": "Enantiomers are optical isomers: mirror images that can't be overlaid."}, {"q": "How do enantiomers differ in their physical properties?", "o": ["Different boiling points", "Different densities", "They rotate plane-polarised light in opposite directions", "Different solubilities in water"], "a": 2, "e": "Otherwise their physical and chemical properties are the same."}, {"q": "What is a racemic mixture?", "o": ["A mixture of structural isomers", "A pure enantiomer", "A mixture of E and Z isomers", "An equal mixture of two enantiomers"], "a": 3, "e": "Equal amounts of each enantiomer."}, {"q": "Why is a racemic mixture optically inactive?", "o": ["The rotations of the two enantiomers cancel out", "It contains no chiral molecules", "It absorbs light", "It isn't a mixture"], "a": 0, "e": "One enantiomer rotates light clockwise and the other anticlockwise by the same amount."}, {"q": "Which molecule has a chiral centre?", "o": ["Propan-2-ol, CH₃CH(OH)CH₃", "Butan-2-ol, CH₃CH(OH)CH₂CH₃", "Ethanol", "Propanone"], "a": 1, "e": "In butan-2-ol, carbon 2 has H, OH, CH₃ and C₂H₅: four different groups."}, {"q": "Why does propan-2-ol not show optical isomerism?", "o": ["It has a C=C", "It has an OH group", "Its central carbon has two identical CH₃ groups", "It is too small"], "a": 2, "e": "Two identical groups mean the mirror image is superimposable."}, {"q": "Why does nucleophilic addition of HCN to ethanal give a racemic mixture?", "o": ["Ethanal is chiral", "HCN is chiral", "The product isn't chiral", "The C=O is planar, so CN⁻ can attack from either side with equal probability"], "a": 3, "e": "Equal attack from above and below gives equal amounts of each enantiomer."}, {"q": "Why might the two enantiomers of a drug have different effects in the body?", "o": ["Enzymes and receptors are chiral, so they interact differently with each enantiomer", "They have different molecular formulae", "One enantiomer is always toxic", "They have different boiling points"], "a": 0, "e": "Biological molecules are chiral, so shape matters. Thalidomide is a famous example."}, {"q": "What type of isomerism is optical isomerism?", "o": ["Structural isomerism", "Stereoisomerism", "Chain isomerism", "Position isomerism"], "a": 1, "e": "Same structural formula, different arrangement in space."}, {"q": "How many chiral centres does 2-hydroxypropanoic acid (lactic acid), CH₃CH(OH)COOH, have?", "o": ["0", "2", "1", "3"], "a": 2, "e": "Carbon 2 has H, OH, CH₃ and COOH."}, {"q": "How are enantiomers drawn to show their 3D shape?", "o": ["As skeletal formulae only", "With all bonds in the plane", "With double bonds", "As mirror images using wedge and dashed bonds"], "a": 3, "e": "Wedges come out of the page and dashes go back, showing the tetrahedral arrangement."}, {"q": "What would happen to plane-polarised light passed through a single pure enantiomer?", "o": ["It would be rotated", "Nothing", "It would be absorbed", "It would be split"], "a": 0, "e": "A pure enantiomer is optically active."}, {"q": "Which statement about enantiomers' chemical properties is correct?", "o": ["They react completely differently with all reagents", "They are identical, except in reactions with other chiral molecules", "One is always more reactive", "Only one can be oxidised"], "a": 1, "e": "With non-chiral reagents, enantiomers react identically."}, {"q": "Why might a reaction via a planar carbocation produce a racemic mixture?", "o": ["The carbocation is chiral", "The nucleophile is chiral", "The nucleophile can attack the planar carbocation from either side equally", "The carbocation is tetrahedral"], "a": 2, "e": "Equal attack from both faces gives both enantiomers equally."}, {"q": "Which of these has a chiral centre?", "o": ["CH₃CH₂Cl", "CH₂Cl₂", "CH₃CHCl₂", "CH₃CHClCH₂CH₃"], "a": 3, "e": "In 2-chlorobutane, carbon 2 has H, Cl, CH₃ and C₂H₅."}, {"q": "Why is it important to make single enantiomers of some drugs?", "o": ["The other enantiomer may be inactive or harmful", "Racemates can't be made", "Single enantiomers are cheaper", "They have higher boiling points"], "a": 0, "e": "Only one enantiomer may fit the target receptor; the other could cause side effects."}, {"q": "Can a molecule with a C=C also show optical isomerism?", "o": ["No, never", "Yes, if it also has a carbon with four different groups", "Only if it is a ring", "Only E isomers can"], "a": 1, "e": "A molecule can show both E/Z and optical isomerism if it has both features."}, {"q": "What is meant by 'non-superimposable'?", "o": ["The molecules have different formulas", "The molecules are identical", "The mirror images can't be placed on top of each other so all atoms match", "The molecules are planar"], "a": 2, "e": "Like left and right hands: mirror images that can't be overlaid."}, {"q": "How many optical isomers does a molecule with one chiral centre have?", "o": ["1", "3", "4", "2"], "a": 3, "e": "One chiral centre gives a pair of enantiomers."}, {"q": "Butanone reacts with HCN. Is the product optically active?", "o": ["No, because a racemic mixture forms", "Yes, one enantiomer forms", "No, because the product has no chiral centre", "Yes, because HCN is chiral"], "a": 0, "e": "The product has a chiral centre, but attack on the planar C=O from both sides gives equal amounts."}, {"q": "Which instrument detects optical activity?", "o": ["Mass spectrometer", "Polarimeter", "pH meter", "Colorimeter"], "a": 1, "e": "A polarimeter measures the rotation of plane-polarised light."}]}, {"id": "3.3.8", "order": 26, "year": 2, "section": "3.3", "spec": "3.3.8", "title": "Aldehydes and ketones", "desc": "Oxidation of aldehydes, Tollens' and Fehling's tests, reduction with NaBH₄, and nucleophilic addition of HCN with the hazards of KCN.", "practicals": [6], "summary": [{"h": "Structure", "p": ["**Aldehydes** have a **C=O** at the **end** of the chain (–CHO). **Ketones** have a **C=O** within the chain.", "The C=O bond is **polar**: carbon is δ+, so it is attacked by **nucleophiles**."]}, {"h": "Oxidation", "p": ["**Aldehydes** are **readily oxidised** to **carboxylic acids** (e.g. by acidified K₂Cr₂O₇). **Ketones** are **not easily oxidised**.", "**Tollens' reagent** ([Ag(NH₃)₂]⁺): aldehydes give a **silver mirror**. Ag⁺ is reduced to Ag.", "**Fehling's solution** (Cu²⁺ complex): aldehydes give a **brick-red precipitate** of Cu₂O. Cu²⁺ is reduced to Cu⁺.", "Ketones give **no change** with either."]}, {"h": "Reduction", "p": ["**NaBH₄** (sodium tetrahydridoborate(III)) in aqueous or alcoholic solution reduces carbonyls.", "Aldehydes → **primary alcohols**. Ketones → **secondary alcohols**. Use [H] in equations, e.g. `CH₃CHO + 2[H] → CH₃CH₂OH`.", "Mechanism: **nucleophilic addition**. The **H⁻ (hydride ion)** from NaBH₄ attacks the δ+ carbon. The C=O bond breaks, forming an O⁻ intermediate, which is protonated by water."]}, {"h": "Nucleophilic addition of HCN", "p": ["Carbonyls react with **KCN** followed by **dilute acid** to form **hydroxynitriles**, e.g. ethanal → 2-hydroxypropanenitrile.", "Mechanism: **CN⁻** attacks the δ+ carbon. The C=O breaks. The O⁻ intermediate gains H⁺ (from HCN or the acid).", "The product is a **racemic mixture** when a chiral centre forms, because the carbonyl group is **planar**.", "**Hazards**: KCN is **highly toxic**. HCN is a toxic gas. Use a fume cupboard; KCN is used rather than HCN gas because it is easier to handle safely, but it still requires great care."]}], "pitfalls": ["NaBH₄ reduction uses the **hydride ion (H⁻)** as nucleophile. Show [H] in equations.", "Aldehyde tests: Tollens' (silver mirror) and Fehling's (brick-red). Ketones: negative.", "Name hydroxynitriles counting the CN carbon: ethanal + HCN gives **2-hydroxypropanenitrile**."], "questions": [{"q": "Where is the C=O group in an aldehyde?", "o": ["In the middle of the chain", "At the end of the chain", "Attached to an OH", "In a ring"], "a": 1, "e": "Aldehydes have –CHO at the end of the carbon chain."}, {"q": "Why is the carbon in C=O attacked by nucleophiles?", "o": ["Oxygen is more electronegative, making the carbon δ+", "Carbon has a lone pair", "The bond is non-polar", "Carbon is negatively charged"], "a": 0, "e": "The polar bond makes carbon electron-deficient."}, {"q": "What is the product when an aldehyde is oxidised?", "o": ["A ketone", "An alcohol", "A carboxylic acid", "An alkene"], "a": 2, "e": "Aldehydes are oxidised to carboxylic acids."}, {"q": "What is seen when an aldehyde is warmed with Tollens' reagent?", "o": ["A brick-red precipitate", "Orange to green", "No change", "A silver mirror"], "a": 3, "e": "Ag⁺ is reduced to silver metal."}, {"q": "What is seen when a ketone is warmed with Fehling's solution?", "o": ["No change: the solution stays blue", "A brick-red precipitate", "A silver mirror", "Effervescence"], "a": 0, "e": "Ketones aren't easily oxidised, so Fehling's stays blue."}, {"q": "What reducing agent is used to reduce carbonyls to alcohols?", "o": ["KMnO₄", "NaBH₄", "K₂Cr₂O₇", "H₂SO₄"], "a": 1, "e": "NaBH₄ provides hydride ions (H⁻)."}, {"q": "What is formed when propanone is reduced with NaBH₄?", "o": ["Propan-1-ol", "Propanal", "Propan-2-ol", "Propanoic acid"], "a": 2, "e": "Ketones are reduced to secondary alcohols."}, {"q": "What is the nucleophile in the reduction of a carbonyl by NaBH₄?", "o": ["BH₄⁻ as a whole", "Na⁺", "H₂O", "The hydride ion, H⁻"], "a": 3, "e": "H⁻ attacks the δ+ carbon, then the O⁻ formed is protonated."}, {"q": "What type of mechanism is the reaction of a carbonyl with KCN and acid?", "o": ["Nucleophilic addition", "Electrophilic addition", "Nucleophilic substitution", "Elimination"], "a": 0, "e": "CN⁻ adds to the C=O carbon."}, {"q": "What is the product when ethanal reacts with KCN then dilute acid?", "o": ["Ethanenitrile", "2-hydroxypropanenitrile", "Propanal", "1-hydroxyethanenitrile"], "a": 1, "e": "The CN adds a carbon: CH₃CH(OH)CN, 2-hydroxypropanenitrile."}, {"q": "Why does the reaction of ethanal with HCN give a racemic mixture?", "o": ["Ethanal is chiral", "CN⁻ is chiral", "The planar C=O can be attacked from either side with equal probability", "The product has no chiral centre"], "a": 2, "e": "Equal attack from both faces produces equal amounts of each enantiomer."}, {"q": "Why is KCN hazardous?", "o": ["It is explosive", "It is radioactive", "It is corrosive only", "It is highly toxic, and can release toxic HCN gas with acid"], "a": 3, "e": "Cyanide stops cellular respiration. Work in a fume cupboard with great care."}, {"q": "Write the equation for reducing ethanal with NaBH₄.", "o": ["CH₃CHO + 2[H] → CH₃CH₂OH", "CH₃CHO + [O] → CH₃COOH", "CH₃CHO + H₂O → CH₃CH₂OH + [O]", "CH₃CHO → CH₂=CH₂ + H₂O"], "a": 0, "e": "[H] represents the reducing agent's hydrogen."}, {"q": "What is reduced in the Fehling's test?", "o": ["The aldehyde", "Cu²⁺ to Cu⁺ (Cu₂O)", "Ag⁺", "Water"], "a": 1, "e": "The aldehyde is oxidised; Cu²⁺ is reduced to brick-red Cu₂O."}, {"q": "What is reduced in Tollens' test?", "o": ["The aldehyde", "Ammonia", "Ag⁺ to Ag", "OH⁻"], "a": 2, "e": "Silver ions gain electrons to form silver metal."}, {"q": "Which compound would give a silver mirror with Tollens' reagent?", "o": ["Propanone", "Propan-2-ol", "Butanone", "Butanal"], "a": 3, "e": "Butanal is an aldehyde, so it is oxidised by Tollens'."}, {"q": "In the mechanism of nucleophilic addition, what happens after CN⁻ attacks the carbon?", "o": ["The C=O π bond breaks, forming an O⁻ intermediate, which is then protonated", "The carbon loses H⁺", "Water leaves", "A carbocation forms"], "a": 0, "e": "The electrons from C=O move onto oxygen, then O⁻ picks up H⁺."}, {"q": "What is formed when an aldehyde is reduced?", "o": ["A secondary alcohol", "A primary alcohol", "A ketone", "A carboxylic acid"], "a": 1, "e": "Aldehydes give primary alcohols on reduction."}, {"q": "Why can't ketones be easily oxidised?", "o": ["They have no C=O", "They are too large", "They have no H atom attached to the carbonyl carbon", "They are ionic"], "a": 2, "e": "Oxidising would need breaking a C–C bond, which mild oxidising agents can't do."}, {"q": "Why is KCN used rather than HCN gas in the lab?", "o": ["KCN isn't toxic", "HCN is a better nucleophile", "KCN is cheaper only", "HCN is a highly toxic gas that is harder to contain; KCN is a solid, though still very toxic"], "a": 3, "e": "KCN supplies CN⁻ ions directly; acid is then added to protonate the intermediate."}, {"q": "Which test distinguishes propanal from propanone?", "o": ["Warm with Fehling's: propanal gives a brick-red precipitate", "Add bromine water", "Add sodium carbonate", "Measure the boiling point only"], "a": 0, "e": "Only the aldehyde (propanal) is oxidised by Fehling's."}, {"q": "What is the systematic name of NaBH₄?", "o": ["Sodium borohydride(V)", "Sodium tetrahydridoborate(III)", "Boron sodium hydride", "Sodium hydride borate"], "a": 1, "e": "Boron is in the +3 oxidation state."}]}, {"id": "3.3.9", "order": 27, "year": 2, "section": "3.3", "spec": "3.3.9", "title": "Carboxylic acids and derivatives", "desc": "Carboxylic acids as weak acids, esterification and ester uses, hydrolysis of esters and fats, biodiesel, and nucleophilic addition–elimination of acyl chlorides and anhydrides.", "practicals": [10], "summary": [{"h": "Carboxylic acids", "p": ["Carboxylic acids (–COOH) are **weak acids**: RCOOH ⇌ RCOO⁻ + H⁺.", "They react with **carbonates** and **hydrogencarbonates** to release **CO₂**: `2RCOOH + Na₂CO₃ → 2RCOONa + H₂O + CO₂`."]}, {"h": "Esters", "p": ["**Esterification**: carboxylic acid + alcohol ⇌ ester + water, with a **concentrated sulfuric acid catalyst**, heated.", "Naming: alcohol part first (e.g. ethyl), then acid part (-oate), e.g. **ethyl ethanoate** CH₃COOCH₂CH₃.", "Uses of esters: **solvents**, **plasticisers**, **perfumes** and **food flavourings** (they have sweet, fruity smells)."]}, {"h": "Hydrolysis of esters", "p": ["**Acid hydrolysis**: heat with dilute acid. Reversible; gives a **carboxylic acid** and **alcohol**.", "**Base hydrolysis**: heat with NaOH. Goes to completion; gives a **carboxylate salt** and alcohol.", "**Fats and oils** are esters of **glycerol** (propane-1,2,3-triol) and **fatty acids**.", "Base hydrolysis of fats gives **soap** (sodium salts of fatty acids) and glycerol.", "**Biodiesel** is a mixture of **methyl esters** of long-chain fatty acids, made by reacting vegetable oils with **methanol** using a **catalyst**."]}, {"h": "Acyl chlorides and acid anhydrides", "p": ["**Acyl chlorides** (RCOCl) and **acid anhydrides** ((RCO)₂O) react by **nucleophilic addition–elimination**.", "With **water** → carboxylic acid. With **alcohols** → esters. With **ammonia** → primary amides. With **primary amines** → N-substituted amides.", "Acyl chlorides give **HCl** as a by-product (misty fumes). Anhydrides give a **carboxylic acid** as a by-product.", "Mechanism: nucleophile attacks the δ+ carbon, C=O breaks (addition); then C=O reforms and Cl⁻ is lost (elimination), followed by loss of H⁺.", "**Ethanoic anhydride** is preferred industrially for making **aspirin**: it is **cheaper**, **less corrosive**, reacts less violently, doesn't produce toxic HCl, and is less easily hydrolysed."]}], "pitfalls": ["Name esters with the **alcohol** part first: methanol + propanoic acid gives **methyl propanoate**.", "Base hydrolysis gives the **salt**, not the acid.", "Addition–elimination: four curly arrows for acyl chlorides, including loss of H⁺ at the end."], "questions": [{"q": "Why are carboxylic acids classed as weak acids?", "o": ["They are dilute", "They only partially dissociate in water", "They don't react with bases", "They have a high pH"], "a": 1, "e": "Only a small proportion of molecules release H⁺."}, {"q": "What gas is produced when a carboxylic acid reacts with sodium hydrogencarbonate?", "o": ["Carbon dioxide", "Hydrogen", "Oxygen", "Chlorine"], "a": 0, "e": "RCOOH + NaHCO₃ → RCOONa + H₂O + CO₂."}, {"q": "What is needed for esterification?", "o": ["NaOH", "UV light", "A concentrated sulfuric acid catalyst and heat", "Water"], "a": 2, "e": "The acid catalyses the reversible reaction between acid and alcohol."}, {"q": "What is the name of the ester formed from methanol and propanoic acid?", "o": ["Propyl methanoate", "Methyl methanoate", "Propyl propanoate", "Methyl propanoate"], "a": 3, "e": "The alcohol gives the first part (methyl), the acid gives the second (propanoate)."}, {"q": "Which is a use of esters?", "o": ["Food flavourings and perfumes", "Fuels for jets only", "Antacids", "Fertilisers"], "a": 0, "e": "Esters have sweet, fruity smells and are also used as solvents and plasticisers."}, {"q": "What are the products of base hydrolysis of ethyl ethanoate with NaOH?", "o": ["Ethanoic acid and ethanol", "Sodium ethanoate and ethanol", "Ethene and ethanoic acid", "Sodium ethoxide"], "a": 1, "e": "The carboxylic acid is deprotonated to form the sodium salt."}, {"q": "Why does base hydrolysis of esters go to completion, unlike acid hydrolysis?", "o": ["Esters are more reactive in base", "The ester is destroyed", "The carboxylate salt formed doesn't react with the alcohol, so the reaction isn't reversible", "Base is a better catalyst"], "a": 2, "e": "Removing the acid as its salt stops the reverse reaction."}, {"q": "What is made by base hydrolysis of a fat?", "o": ["Biodiesel", "Margarine", "Ethanol", "Soap and glycerol"], "a": 3, "e": "Sodium salts of fatty acids are soaps."}, {"q": "What is biodiesel?", "o": ["A mixture of methyl esters of long-chain fatty acids", "Ethanol from fermentation", "Crude oil fraction", "Glycerol"], "a": 0, "e": "Vegetable oils react with methanol to form methyl esters."}, {"q": "What is formed when an acyl chloride reacts with water?", "o": ["An ester and HCl", "A carboxylic acid and HCl", "An amide", "An alcohol"], "a": 1, "e": "RCOCl + H₂O → RCOOH + HCl. Misty fumes of HCl are seen."}, {"q": "What is formed when ethanoyl chloride reacts with ethanol?", "o": ["Ethanoic acid", "Ethanamide", "Ethyl ethanoate and HCl", "Ethanal"], "a": 2, "e": "Acyl chlorides react with alcohols to give esters."}, {"q": "What is formed when ethanoyl chloride reacts with ammonia?", "o": ["Ethylamine", "Ethanoic acid", "Ethyl ethanoate", "Ethanamide"], "a": 3, "e": "Acyl chloride + NH₃ gives a primary amide (and NH₄Cl with excess NH₃)."}, {"q": "What is formed when ethanoyl chloride reacts with methylamine?", "o": ["N-methylethanamide", "Ethanamide", "Methyl ethanoate", "Ethylamine"], "a": 0, "e": "Primary amines give N-substituted amides."}, {"q": "What is the name of the mechanism for acyl chloride reactions?", "o": ["Nucleophilic substitution", "Nucleophilic addition–elimination", "Electrophilic addition", "Free-radical substitution"], "a": 1, "e": "The nucleophile adds to the C=O, then Cl⁻ is eliminated."}, {"q": "What is the by-product when an acid anhydride reacts with an alcohol?", "o": ["HCl", "Water", "A carboxylic acid", "Ammonia"], "a": 2, "e": "(RCO)₂O + R'OH → RCOOR' + RCOOH."}, {"q": "Why is ethanoic anhydride preferred to ethanoyl chloride for making aspirin industrially?", "o": ["It is more reactive", "It produces HCl", "It is more toxic", "It is cheaper, less corrosive, reacts less violently and doesn't produce HCl"], "a": 3, "e": "These make it safer and more economical on a large scale."}, {"q": "What is glycerol?", "o": ["Propane-1,2,3-triol", "Ethane-1,2-diol", "A fatty acid", "A soap"], "a": 0, "e": "Glycerol has three OH groups, which form ester bonds with fatty acids in fats."}, {"q": "Why are acyl chlorides very reactive towards nucleophiles?", "o": ["The C=O carbon is attached to two electronegative atoms (O and Cl), making it very δ+", "They have a C=C", "Cl is a nucleophile", "They are ionic"], "a": 0, "e": "Both oxygen and chlorine withdraw electron density from the carbonyl carbon."}, {"q": "What is seen when ethanoyl chloride is added to water?", "o": ["Silver mirror", "Misty fumes of HCl
