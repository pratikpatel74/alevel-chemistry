eeds 14H⁺. Charge left: −2 + 14 = +12. Right: +6. So add 6e⁻ to the left."}, {"q": "What is the oxidation state of Cl in ClO₃⁻?", "o": ["+3", "+5", "−1", "+7"], "a": 1, "e": "Cl + 3(−2) = −1, so Cl = +5."}]}, {"id": "3.2.1", "order": 8, "year": 1, "section": "3.2", "spec": "3.2.1", "title": "Periodicity", "desc": "Classifying elements into s, p, d and f blocks, and trends in atomic radius, first ionisation energy and melting point across Period 3.", "practicals": [], "summary": [{"h": "Classification", "p": ["Elements are arranged in the Periodic Table by **atomic number**.", "They are classified into **s, p, d and f blocks** according to the sub-level of their **highest-energy electron**.", "s-block: Groups 1 and 2. p-block: Groups 3 to 0. d-block: transition metals. f-block: lanthanides and actinides."]}, {"h": "Atomic radius across Period 3", "p": ["Atomic radius **decreases** across Period 3 (Na to Ar).", "**Nuclear charge increases** (more protons), but electrons are added to the **same shell**, so shielding is similar.", "Outer electrons are pulled **closer** to the nucleus."]}, {"h": "First ionisation energy across Period 3", "p": ["General **increase** across the period, for the same reasons: more protons, similar shielding, smaller radius.", "**Dip at Al**: the outer electron is in a **3p** sub-level, higher in energy than 3s.", "**Dip at S**: the electron is removed from a **3p orbital with a pair**, and pair repulsion makes it easier to remove."]}, {"h": "Melting point across Period 3", "p": ["**Na, Mg, Al**: **metallic** bonding. Melting point **increases** because the ions have a **larger charge** and are **smaller**, with **more delocalised electrons**, so metallic bonding is stronger.", "**Si**: **macromolecular** (giant covalent). The **highest** melting point, because many strong covalent bonds must be broken.", "**P₄, S₈, Cl₂, Ar**: **simple molecular**. Low melting points; only **van der Waals** forces are overcome.", "Order among them: **S₈ > P₄ > Cl₂ > Ar**, because larger molecules have **more electrons** and stronger van der Waals forces."]}], "pitfalls": ["For S₈ vs P₄, mention **more electrons**, so stronger van der Waals forces. Not 'stronger covalent bonds'.", "Silicon is **macromolecular**, not metallic.", "Blocks are based on the sub-level of the **highest-energy** electron."], "questions": [{"q": "How are elements classified into s, p, d and f blocks?", "o": ["By their number of neutrons", "By the sub-level containing their highest-energy electron", "By their state at room temperature", "By their reactivity"], "a": 1, "e": "E.g. chlorine's highest-energy electron is in 3p, so it is a p-block element."}, {"q": "Which block is magnesium in?", "o": ["s-block", "p-block", "d-block", "f-block"], "a": 0, "e": "Mg is 1s² 2s² 2p⁶ 3s². Its highest-energy electron is in an s sub-level."}, {"q": "Why does atomic radius decrease across Period 3?", "o": ["Shielding increases greatly", "Electrons are added to new shells", "Nuclear charge increases, while shielding stays similar, so outer electrons are pulled closer", "Neutron number decreases"], "a": 2, "e": "More protons attract the same outer shell more strongly."}, {"q": "Which Period 3 element has the highest melting point?", "o": ["Aluminium", "Sulfur", "Phosphorus", "Silicon"], "a": 3, "e": "Silicon is macromolecular, so many strong covalent bonds must be broken to melt it."}, {"q": "Why does the melting point increase from Na to Al?", "o": ["Metallic bonding gets stronger: ions are smaller with a higher charge, and there are more delocalised electrons", "Van der Waals forces increase", "Covalent bonds get stronger", "Atoms get larger"], "a": 0, "e": "Na⁺, Mg²⁺ and Al³⁺ have increasing charge and decreasing size, attracting more delocalised electrons more strongly."}, {"q": "Why does sulfur (S₈) have a higher melting point than phosphorus (P₄)?", "o": ["S₈ has stronger covalent bonds", "S₈ is a larger molecule with more electrons, so stronger van der Waals forces", "S₈ is metallic", "S₈ forms hydrogen bonds"], "a": 1, "e": "Both are simple molecular. S₈ has more electrons, giving stronger induced dipole–dipole forces."}, {"q": "Why does argon have the lowest melting point in Period 3?", "o": ["It is metallic", "It is macromolecular", "It exists as single atoms with very weak van der Waals forces", "It forms hydrogen bonds"], "a": 2, "e": "Argon atoms have few electrons for a Period 3 element and weak forces between them."}, {"q": "What is the general trend in first ionisation energy across Period 3?", "o": ["Decreases", "Stays the same", "Decreases then increases", "Increases, with dips at Al and S"], "a": 3, "e": "Ionisation energy rises because nuclear charge increases, with dips at Al (3p) and S (paired electrons)."}, {"q": "Why is the first ionisation energy of Al lower than Mg?", "o": ["Al's outer electron is in a 3p sub-level, which is higher in energy than 3s", "Al has fewer protons", "Al has more shells", "Al's outer electron is paired"], "a": 0, "e": "The 3p electron is higher in energy and partly shielded by the 3s electrons."}, {"q": "Which type of structure does phosphorus have?", "o": ["Metallic", "Simple molecular (P₄)", "Giant ionic", "Macromolecular"], "a": 1, "e": "Phosphorus exists as P₄ molecules held together by van der Waals forces."}, {"q": "What type of bonding is present in solid sodium?", "o": ["Ionic", "Covalent", "Metallic", "Hydrogen bonding"], "a": 2, "e": "Sodium is a metal: Na⁺ ions in a sea of delocalised electrons."}, {"q": "Which Period 3 element is macromolecular?", "o": ["Sodium", "Chlorine", "Sulfur", "Silicon"], "a": 3, "e": "Silicon forms a giant covalent structure like diamond."}, {"q": "Which block is chlorine in?", "o": ["p-block", "s-block", "d-block", "f-block"], "a": 0, "e": "Chlorine is 3s² 3p⁵. Its highest-energy electron is in a p sub-level."}, {"q": "Which of these has the largest atomic radius?", "o": ["Cl", "Na", "Si", "Ar"], "a": 1, "e": "Sodium is at the start of Period 3, with the lowest nuclear charge pulling on the same shell."}, {"q": "Why is the first ionisation energy of S lower than P?", "o": ["S has fewer protons", "S's electron is in a new shell", "In S, the electron is removed from a 3p orbital containing a pair, and pair repulsion makes it easier to remove", "S is a metal"], "a": 2, "e": "P has three unpaired 3p electrons. S has one pair, which repel each other."}, {"q": "What is the order of melting points for the simple molecular Period 3 elements?", "o": ["Ar > Cl₂ > P₄ > S₈", "P₄ > S₈ > Cl₂ > Ar", "Cl₂ > Ar > S₈ > P₄", "S₈ > P₄ > Cl₂ > Ar"], "a": 3, "e": "Larger molecules with more electrons have stronger van der Waals forces."}, {"q": "Transition metals belong to which block?", "o": ["d-block", "s-block", "p-block", "f-block"], "a": 0, "e": "Transition metals have their highest-energy electrons in d sub-levels."}, {"q": "Why does chlorine have a lower melting point than sulfur?", "o": ["Chlorine is metallic", "Cl₂ molecules have fewer electrons than S₈, so weaker van der Waals forces", "Chlorine forms hydrogen bonds", "Chlorine is macromolecular"], "a": 1, "e": "S₈ has 128 electrons; Cl₂ has 34. Fewer electrons means weaker forces between molecules."}, {"q": "In the Periodic Table, elements are arranged in order of:", "o": ["Mass number", "Relative atomic mass", "Atomic number", "Number of neutrons"], "a": 2, "e": "Elements are arranged by atomic number (number of protons)."}, {"q": "Why does aluminium have a higher melting point than sodium?", "o": ["Aluminium is macromolecular", "Aluminium has weaker metallic bonding", "Sodium has more delocalised electrons", "Al³⁺ ions are smaller with a higher charge, and there are more delocalised electrons, so stronger metallic bonding"], "a": 3, "e": "Al contributes 3 electrons per atom to the sea; Na only 1."}, {"q": "Which element in Period 3 has the highest first ionisation energy?", "o": ["Argon", "Chlorine", "Sodium", "Phosphorus"], "a": 0, "e": "Argon has the greatest nuclear charge in the period with similar shielding."}, {"q": "What forces are overcome when silicon melts?", "o": ["Van der Waals forces", "Covalent bonds", "Metallic bonds", "Hydrogen bonds"], "a": 1, "e": "Silicon is macromolecular, so strong covalent bonds must be broken."}]}, {"id": "3.2.2", "order": 9, "year": 1, "section": "3.2", "spec": "3.2.2", "title": "Group 2, the alkaline earth metals", "desc": "Trends in atomic radius, ionisation energy and melting point, reactions with water, solubility of hydroxides and sulfates, and uses of Group 2 compounds.", "practicals": [4], "summary": [{"h": "Physical trends down the group", "p": ["**Atomic radius increases**: more shells.", "**First ionisation energy decreases**: outer electrons are further from the nucleus and more shielded.", "**Melting point generally decreases**: the ions get larger, so the attraction between the ions and delocalised electrons is weaker (Mg is an exception)."]}, {"h": "Reactions with water", "p": ["**Reactivity increases** down the group, because less energy is needed to lose the two outer electrons.", "Metals react with water to form a **hydroxide** and **hydrogen**: `M + 2H₂O → M(OH)₂ + H₂`.", "**Magnesium** reacts very slowly with liquid water, but burns in **steam** to form **magnesium oxide**: `Mg + H₂O → MgO + H₂`."]}, {"h": "Solubility", "p": ["**Hydroxides** become **more soluble** down the group. Mg(OH)₂ is **sparingly soluble**; Ba(OH)₂ is soluble.", "**Sulfates** become **less soluble** down the group. BaSO₄ is **insoluble**.", "**Test for sulfate ions**: add **acidified BaCl₂** solution. A **white precipitate** of BaSO₄ shows sulfate. The acid removes carbonate ions, which would also give a white precipitate."]}, {"h": "Uses", "p": ["**Mg(OH)₂**: used in medicine as an **antacid** to neutralise stomach acid.", "**Ca(OH)₂**: used in agriculture to **neutralise acid soils**.", "**BaSO₄**: used in a **barium meal** for X-rays of the digestive system. It is **insoluble**, so the toxic Ba²⁺ ions aren't absorbed.", "**Mg**: used to extract **titanium** from TiCl₄: `TiCl₄ + 2Mg → Ti + 2MgCl₂`.", "**CaO or CaCO₃**: used to remove **SO₂** from flue gases (flue gas desulfurisation)."]}], "pitfalls": ["Hydroxides: **more** soluble down. Sulfates: **less** soluble down. Learn the opposite trends.", "Mg with **steam** gives the **oxide** (MgO), not the hydroxide.", "BaSO₄ is safe in barium meals **because it's insoluble**. Soluble barium compounds are toxic."], "questions": [{"q": "How does atomic radius change down Group 2?", "o": ["Decreases", "Increases, because there are more electron shells", "Stays the same", "Decreases then increases"], "a": 1, "e": "Each element down the group has an extra shell of electrons."}, {"q": "Why does first ionisation energy decrease down Group 2?", "o": ["Outer electrons are further from the nucleus and more shielded", "Nuclear charge decreases", "Atoms get smaller", "There are fewer electrons"], "a": 0, "e": "Increased distance and shielding outweigh the increased nuclear charge."}, {"q": "How does reactivity with water change down Group 2?", "o": ["Decreases", "Stays the same", "Increases", "Only Mg reacts"], "a": 2, "e": "Less energy is needed to remove the outer electrons, so the metals react more readily."}, {"q": "What are the products when calcium reacts with water?", "o": ["CaO and H₂", "CaO and O₂", "CaH₂ and O₂", "Ca(OH)₂ and H₂"], "a": 3, "e": "Ca + 2H₂O → Ca(OH)₂ + H₂."}, {"q": "What forms when magnesium burns in steam?", "o": ["Magnesium oxide and hydrogen", "Magnesium hydroxide and hydrogen", "Magnesium hydride", "Magnesium oxide and oxygen"], "a": 0, "e": "Mg + H₂O(g) → MgO + H₂. With steam, the oxide forms."}, {"q": "How does the solubility of Group 2 hydroxides change down the group?", "o": ["Decreases", "Increases", "Stays the same", "They are all insoluble"], "a": 1, "e": "Mg(OH)₂ is sparingly soluble, while Ba(OH)₂ is quite soluble."}, {"q": "How does the solubility of Group 2 sulfates change down the group?", "o": ["Increases", "Stays the same", "Decreases", "They are all very soluble"], "a": 2, "e": "MgSO₄ is soluble; BaSO₄ is insoluble."}, {"q": "How do you test for sulfate ions?", "o": ["Add silver nitrate", "Add sodium hydroxide", "Add limewater", "Add acidified barium chloride; a white precipitate shows sulfate"], "a": 3, "e": "Ba²⁺ + SO₄²⁻ → BaSO₄, a white precipitate."}, {"q": "Why is the barium chloride solution acidified in the sulfate test?", "o": ["To remove carbonate ions, which would also form a white precipitate", "To dissolve barium sulfate", "To make the precipitate coloured", "To speed up the reaction"], "a": 0, "e": "Acid reacts with carbonate, producing CO₂, so carbonate doesn't give a false positive."}, {"q": "Why is magnesium hydroxide used as an antacid?", "o": ["It is very soluble", "It neutralises excess stomach acid", "It is acidic", "It kills bacteria"], "a": 1, "e": "Mg(OH)₂ is a base that neutralises HCl in the stomach."}, {"q": "Why is calcium hydroxide used in agriculture?", "o": ["As a fertiliser", "To kill pests", "To neutralise acidic soils", "To increase acidity"], "a": 2, "e": "Ca(OH)₂ (slaked lime) raises soil pH so crops grow better."}, {"q": "Why is barium sulfate safe to use in a barium meal?", "o": ["Barium is not toxic", "It is absorbed quickly", "It dissolves in stomach acid", "It is insoluble, so toxic Ba²⁺ ions are not absorbed into the blood"], "a": 3, "e": "BaSO₄ blocks X-rays and isn't absorbed, so it outlines the gut."}, {"q": "How is magnesium used in the extraction of titanium?", "o": ["It reduces TiCl₄ to titanium", "It oxidises titanium", "It is a catalyst", "It removes sulfur"], "a": 0, "e": "TiCl₄ + 2Mg → Ti + 2MgCl₂. Mg is a more reactive metal, so it displaces Ti."}, {"q": "How are SO₂ emissions removed from power station flue gases?", "o": ["By adding chlorine", "By reacting with calcium oxide or calcium carbonate", "By cooling", "By adding water only"], "a": 1, "e": "SO₂ is acidic, so it reacts with basic CaO or CaCO₃ to form calcium sulfite, removing it from the gas."}, {"q": "Which Group 2 hydroxide is least soluble?", "o": ["Ba(OH)₂", "Ca(OH)₂", "Mg(OH)₂", "Sr(OH)₂"], "a": 2, "e": "Solubility of hydroxides increases down the group, so Mg(OH)₂ is least soluble."}, {"q": "Which Group 2 sulfate is least soluble?", "o": ["MgSO₄", "CaSO₄", "SrSO₄", "BaSO₄"], "a": 3, "e": "Sulfate solubility decreases down the group, so BaSO₄ is the least soluble."}, {"q": "What is the oxidation state of Group 2 elements in their compounds?", "o": ["+2", "+1", "−2", "0"], "a": 0, "e": "Group 2 elements lose their two outer electrons to form 2+ ions."}, {"q": "When dilute NaOH is added to a solution containing Mg²⁺, what is seen?", "o": ["No change", "A white precipitate of Mg(OH)₂", "A blue precipitate", "Effervescence"], "a": 1, "e": "Mg(OH)₂ is sparingly soluble, so it forms a white precipitate."}, {"q": "Adding NaOH to a solution of Ba²⁺ gives no precipitate. Why?", "o": ["Ba²⁺ doesn't react", "BaSO₄ forms instead", "Ba(OH)₂ is soluble", "Barium is a transition metal"], "a": 2, "e": "Group 2 hydroxides get more soluble down the group, so Ba(OH)₂ stays in solution."}, {"q": "Why does melting point generally decrease down Group 2?", "o": ["Covalent bonds weaken", "Van der Waals forces weaken", "There are fewer delocalised electrons", "Ions get larger, so the attraction between ions and delocalised electrons is weaker"], "a": 3, "e": "Larger ions with the same 2+ charge have a lower charge density, so weaker metallic bonding."}, {"q": "Write the equation for strontium reacting with water.", "o": ["Sr + 2H₂O → Sr(OH)₂ + H₂", "Sr + H₂O → SrO + H₂", "2Sr + O₂ → 2SrO", "Sr + 2H₂O → SrH₂ + O₂"], "a": 0, "e": "Like calcium, strontium forms the hydroxide and hydrogen with cold water."}, {"q": "A solution of Ca(OH)₂ is tested with universal indicator. What is the likely pH?", "o": ["About 3", "About 11–12", "Exactly 7", "About 5"], "a": 1, "e": "Calcium hydroxide is an alkali, so the solution is basic."}]}, {"id": "3.2.3", "order": 10, "year": 1, "section": "3.2", "spec": "3.2.3", "title": "Group 7, the halogens", "desc": "Trends in electronegativity and boiling point, oxidising ability, reducing ability of halide ions with sulfuric acid, silver nitrate tests, and uses of chlorine.", "practicals": [4], "summary": [{"h": "Physical trends", "p": ["**Electronegativity decreases** down the group: atomic radius and shielding increase, so the nucleus attracts bonding electrons less.", "**Boiling point increases** down the group: larger molecules with **more electrons**, so stronger van der Waals forces.", "Colours: chlorine is a pale green gas, bromine a red-brown liquid, iodine a grey solid (purple vapour)."]}, {"h": "Oxidising ability", "p": ["**Oxidising ability decreases** down the group. Chlorine is the strongest oxidising agent.", "A more reactive halogen **displaces** a less reactive halide from solution, e.g. `Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂`.", "In aqueous solution, Br₂ appears **orange/yellow** and I₂ appears **brown**."]}, {"h": "Reducing ability of halide ions", "p": ["**Reducing ability increases** down the group: larger ions lose electrons more easily.", "With **concentrated sulfuric acid**:", "**NaCl**: only an acid–base reaction. **Misty fumes** of HCl. No redox.", "**NaBr**: HBr fumes, then Br⁻ reduces H₂SO₄ to **SO₂**. **Orange/brown** bromine vapour.", "**NaI**: HI fumes, then I⁻ reduces H₂SO₄ to **SO₂**, **S** (yellow solid) and **H₂S** (bad egg smell). **Purple/black** iodine."]}, {"h": "Silver nitrate test for halide ions", "p": ["Add **dilute nitric acid** first (to remove carbonate and hydroxide ions), then **silver nitrate**.", "**Cl⁻**: **white** precipitate (AgCl). Dissolves in **dilute ammonia**.", "**Br⁻**: **cream** precipitate (AgBr). Dissolves in **concentrated ammonia**.", "**I⁻**: **yellow** precipitate (AgI). **Insoluble** in ammonia."]}, {"h": "Uses of chlorine and chlorate(I)", "p": ["Chlorine with water: `Cl₂ + H₂O ⇌ HCl + HClO`. This is a **disproportionation** reaction: chlorine is oxidised (to +1) and reduced (to −1) at the same time.", "In sunlight: `2Cl₂ + 2H₂O → 4HCl + O₂`.", "Chlorine is used in **water treatment** to kill bacteria. Benefits outweigh the risks (toxic gas, can form chlorinated hydrocarbons).", "Chlorine with **cold, dilute NaOH**: `Cl₂ + 2NaOH → NaClO + NaCl + H₂O`. Sodium chlorate(I) (NaClO) is used as **bleach**."]}], "pitfalls": ["Oxidising ability of halogens **decreases** down. Reducing ability of halide ions **increases** down. Opposite trends.", "Use **nitric** acid, not hydrochloric, before silver nitrate.", "In the sulfuric acid reactions, give the reduction products of sulfur with their oxidation states: SO₂ (+4), S (0), H₂S (−2)."], "questions": [{"q": "How does electronegativity change down Group 7?", "o": ["Increases", "Decreases", "Stays the same", "Increases then decreases"], "a": 1, "e": "Larger atoms with more shielding attract bonding electrons less strongly."}, {"q": "Why does boiling point increase down Group 7?", "o": ["Molecules get larger with more electrons, so van der Waals forces get stronger", "Covalent bonds get stronger", "Hydrogen bonding increases", "Electronegativity increases"], "a": 0, "e": "More electrons give larger temporary dipoles and stronger forces between molecules."}, {"q": "Which halogen is the strongest oxidising agent?", "o": ["Iodine", "Bromine", "Chlorine", "Astatine"], "a": 2, "e": "Oxidising ability decreases down the group. Chlorine (of Cl, Br, I) gains electrons most readily."}, {"q": "Chlorine water is added to potassium bromide solution. What is observed?", "o": ["No change", "A white precipitate", "A purple solution", "The solution turns orange/yellow as bromine forms"], "a": 3, "e": "Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂. Chlorine displaces bromine."}, {"q": "Why doesn't iodine react with sodium chloride solution?", "o": ["Iodine is a weaker oxidising agent than chlorine", "Iodine is insoluble", "Chloride is a stronger reducing agent", "Iodine is a metal"], "a": 0, "e": "A halogen can only displace a less reactive halide. Iodine is less reactive than chlorine."}, {"q": "How does the reducing ability of halide ions change down the group?", "o": ["Decreases", "Increases", "Stays the same", "Halides are not reducing agents"], "a": 1, "e": "Larger halide ions lose their outer electron more easily, so I⁻ is the strongest reducing agent."}, {"q": "What is seen when concentrated H₂SO₄ is added to solid NaCl?", "o": ["Purple fumes", "A yellow solid", "Misty fumes of HCl only", "A smell of bad eggs"], "a": 2, "e": "Cl⁻ is too weak a reducing agent to reduce H₂SO₄, so only an acid–base reaction occurs."}, {"q": "What are the sulfur-containing products when concentrated H₂SO₄ reacts with NaI?", "o": ["SO₂ only", "None", "SO₃", "SO₂, S and H₂S"], "a": 3, "e": "I⁻ is a strong reducing agent and reduces sulfur from +6 to +4 (SO₂), 0 (S) and −2 (H₂S)."}, {"q": "What is seen when concentrated H₂SO₄ reacts with NaBr?", "o": ["Misty fumes and orange/brown bromine vapour", "Purple fumes", "No change", "A smell of bad eggs"], "a": 0, "e": "HBr fumes form, then Br⁻ reduces H₂SO₄ to SO₂ and is oxidised to Br₂."}, {"q": "Why is dilute nitric acid added before silver nitrate in the halide test?", "o": ["To make the precipitate dissolve", "To remove carbonate ions and other ions that would also form precipitates", "To add chloride ions", "To change the colour"], "a": 1, "e": "Carbonate and hydroxide ions would form precipitates with Ag⁺ and give false results."}, {"q": "What colour precipitate does bromide give with silver nitrate?", "o": ["White", "Yellow", "Cream", "Black"], "a": 2, "e": "AgBr is cream. AgCl is white, AgI is yellow."}, {"q": "A halide precipitate dissolves in dilute ammonia. Which ion was present?", "o": ["Iodide", "Bromide", "Fluoride", "Chloride"], "a": 3, "e": "AgCl dissolves in dilute ammonia. AgBr needs concentrated ammonia, and AgI doesn't dissolve."}, {"q": "What colour precipitate does iodide give with silver nitrate?", "o": ["Yellow", "White", "Cream", "Brown"], "a": 0, "e": "AgI is yellow and doesn't dissolve in ammonia."}, {"q": "What type of reaction happens when chlorine reacts with water?", "o": ["Neutralisation", "Disproportionation", "Displacement", "Hydrolysis only"], "a": 1, "e": "Chlorine (0) is both oxidised to +1 (in HClO) and reduced to −1 (in HCl)."}, {"q": "Why is chlorine added to drinking water?", "o": ["To improve taste", "To add colour", "To kill bacteria", "To add minerals"], "a": 2, "e": "Chlorine and HClO kill harmful microorganisms. The health benefits outweigh the risks."}, {"q": "What is a risk of using chlorine in water treatment?", "o": ["It makes water acidic", "It removes oxygen", "It makes water hard", "Chlorine is toxic, and it can form harmful chlorinated hydrocarbons"], "a": 3, "e": "Chlorine gas is toxic, and it can react with organic matter to form chlorinated compounds."}, {"q": "What forms when chlorine reacts with cold, dilute sodium hydroxide?", "o": ["Sodium chlorate(I), sodium chloride and water", "Sodium chloride and hydrogen", "Hydrochloric acid", "Sodium chlorate(V) only"], "a": 0, "e": "Cl₂ + 2NaOH → NaClO + NaCl + H₂O. NaClO is used as bleach."}, {"q": "What is the oxidation state of Cl in NaClO?", "o": ["−1", "+1", "0", "+5"], "a": 1, "e": "Na (+1) + Cl + O (−2) = 0, so Cl = +1."}, {"q": "What forms when chlorine water is left in sunlight?", "o": ["HClO only", "Chloride ions only", "HCl and oxygen", "Cl₂ gas"], "a": 2, "e": "2Cl₂ + 2H₂O → 4HCl + O₂. Chlorine is lost from water in sunlight."}, {"q": "Which halide ion is the strongest reducing agent?", "o": ["F⁻", "Cl⁻", "Br⁻", "I⁻"], "a": 3, "e": "I⁻ is largest, so its outer electrons are least strongly held and most easily lost."}, {"q": "What is the oxidation state change of sulfur when H₂S forms from H₂SO₄?", "o": ["+6 to −2", "+6 to +4", "+6 to 0", "+4 to −2"], "a": 0, "e": "S in H₂SO₄ is +6, and in H₂S it's −2, so it gains 8 electrons."}, {"q": "Bromine water is added to potassium iodide solution. What is the ionic equation?", "o": ["Br₂ + 2Cl⁻ → 2Br⁻ + Cl₂", "Br₂ + 2I⁻ → 2Br⁻ + I₂", "I₂ + 2Br⁻ → 2I⁻ + Br₂", "No reaction"], "a": 1, "e": "Bromine is a stronger oxidising agent than iodine, so it displaces iodide."}]}, {"id": "3.3.1", "order": 11, "year": 1, "section": "3.3", "spec": "3.3.1", "title": "Introduction to organic chemistry", "desc": "Types of formula, IUPAC nomenclature, homologous series, reaction mechanisms with curly arrows, structural isomerism and E/Z stereoisomerism.", "practicals": [], "summary": [{"h": "Formulae", "p": ["**Molecular**: actual numbers of atoms, e.g. C₄H₁₀. **Empirical**: simplest ratio, e.g. C₂H₅.", "**General formula**: for a homologous series, e.g. alkanes CₙH₂ₙ₊₂.", "**Structural**: arrangement without showing bonds, e.g. CH₃CH₂CH₂CH₃.", "**Displayed**: all atoms and bonds shown. **Skeletal**: lines for the carbon chain, with functional groups shown."]}, {"h": "Nomenclature and homologous series", "p": ["A **homologous series** has the **same functional group** and **general formula**, and each member differs by **CH₂**. Members have similar chemical properties and a trend in physical properties.", "A **functional group** is the group of atoms responsible for the characteristic reactions of a compound.", "IUPAC naming: find the **longest carbon chain** (meth-, eth-, prop-, but-, pent-, hex-...), identify the functional group suffix (-ane, -ene, -ol, -al, -one, -oic acid), and number substituents with the **lowest possible numbers**. List substituents in **alphabetical** order."]}, {"h": "Mechanisms", "p": ["**Curly arrows** show the movement of a **pair of electrons**. They start at a bond or a lone pair and point to where the electrons go.", "**Homolytic fission**: a covalent bond breaks and each atom gets **one** electron, forming **free radicals** (shown with a dot).", "**Heterolytic fission**: one atom gets **both** electrons, forming ions.", "**Nucleophile**: an electron pair **donor**. **Electrophile**: an electron pair **acceptor**."]}, {"h": "Structural isomerism", "p": ["**Structural isomers**: same molecular formula, **different structural formula**.", "**Chain** isomers: different carbon skeleton (e.g. butane and methylpropane).", "**Position** isomers: functional group in a different position (e.g. propan-1-ol and propan-2-ol).", "**Functional group** isomers: different functional groups (e.g. propanal and propanone)."]}, {"h": "Stereoisomerism: E/Z", "p": ["**Stereoisomers**: same structural formula, but a **different arrangement of atoms in space**.", "**E/Z isomerism** happens because there is **restricted rotation** around a **C=C double bond**, and each carbon of the C=C has **two different groups** attached.", "Use **Cahn–Ingold–Prelog (CIP) priority rules**: the atom with the higher **atomic number** has higher priority.", "**Z**: higher-priority groups on the **same side**. **E**: on **opposite sides**."]}], "pitfalls": ["Curly arrows must start from a **bond or lone pair**, never from an atom or a charge on its own.", "E/Z needs **two different groups** on **each** carbon of the C=C.", "Use the lowest numbers when naming, and alphabetical order for substituents: 2-bromo-3-methyl..., not 3-methyl-2-bromo..."], "questions": [{"q": "What is a homologous series?", "o": ["Compounds with the same molecular formula", "Compounds with the same functional group and general formula, each differing by CH₂", "Compounds with different functional groups", "Isomers of each other"], "a": 1, "e": "Members of a homologous series react similarly and show gradual trends in physical properties."}, {"q": "What is the general formula of the alkanes?", "o": ["CₙH₂ₙ₊₂", "CₙH₂ₙ", "CₙH₂ₙ₋₂", "CₙH₂ₙ₊₁OH"], "a": 0, "e": "Alkanes are saturated hydrocarbons, with general formula CₙH₂ₙ₊₂."}, {"q": "What is the empirical formula of butane, C₄H₁₀?", "o": ["C₄H₁₀", "CH₂", "C₂H₅", "CH₃"], "a": 2, "e": "Divide by 2: C₂H₅."}, {"q": "What is the IUPAC name of CH₃CH(CH₃)CH₂CH₃?", "o": ["Pentane", "3-methylbutane", "Methylbutane-2", "2-methylbutane"], "a": 3, "e": "Longest chain is 4 carbons (butane), with a methyl group on carbon 2."}, {"q": "What is the name of CH₃CH₂CH₂OH?", "o": ["Propan-1-ol", "Propan-2-ol", "Propanal", "Propanone"], "a": 0, "e": "Three carbons, with the OH on carbon 1."}, {"q": "What does a curly arrow represent in a mechanism?", "o": ["Movement of a single electron", "Movement of a pair of electrons", "Movement of an atom", "Movement of a proton"], "a": 1, "e": "A full curly arrow shows a pair of electrons moving from a bond or lone pair."}, {"q": "What is homolytic fission?", "o": ["A bond breaks with one atom taking both electrons", "Formation of a bond", "A bond breaks with each atom taking one electron, forming free radicals", "Addition of water"], "a": 2, "e": "Homolytic fission produces two radicals, each with an unpaired electron."}, {"q": "What is a nucleophile?", "o": ["An electron pair acceptor", "A free radical", "A positive ion only", "An electron pair donor"], "a": 3, "e": "Nucleophiles have a lone pair to donate, e.g. OH⁻, CN⁻ and NH₃."}, {"q": "What is an electrophile?", "o": ["An electron pair acceptor", "An electron pair donor", "A radical", "A molecule with a lone pair only"], "a": 0, "e": "Electrophiles are attracted to electron-rich areas such as C=C, e.g. H⁺ and Br⁺."}, {"q": "Butane and methylpropane are which type of isomer?", "o": ["Position isomers", "Chain isomers", "Functional group isomers", "E/Z isomers"], "a": 1, "e": "They have the same molecular formula (C₄H₁₀) but different carbon skeletons."}, {"q": "Propan-1-ol and propan-2-ol are which type of isomer?", "o": ["Chain isomers", "Functional group isomers", "Position isomers", "Stereoisomers"], "a": 2, "e": "Same carbon chain and functional group, but the OH is in a different position."}, {"q": "Propanal and propanone are which type of isomer?", "o": ["Chain isomers", "Position isomers", "E/Z isomers", "Functional group isomers"], "a": 3, "e": "Both are C₃H₆O, but one is an aldehyde and the other a ketone."}, {"q": "Why does E/Z isomerism occur in some alkenes?", "o": ["Restricted rotation around C=C, with two different groups on each carbon of the double bond", "Free rotation around C–C", "A chiral carbon", "Different molecular formulae"], "a": 0, "e": "The double bond can't rotate, so the groups are fixed on one side or the other."}, {"q": "Which alkene can show E/Z isomerism?", "o": ["Ethene", "But-2-ene", "Propene", "2-methylpropene"], "a": 1, "e": "But-2-ene has CH₃ and H on each carbon of the C=C. The others have two identical groups on one carbon."}, {"q": "In Z-but-2-ene, where are the two methyl groups?", "o": ["On opposite sides of the double bond", "On the same carbon", "On the same side of the double bond", "Rotating freely"], "a": 2, "e": "Z (zusammen = together): higher-priority groups on the same side."}, {"q": "How are CIP priorities assigned?", "o": ["By group size", "By the number of hydrogens", "By bond length", "By atomic number of the atom attached directly to the C=C carbon"], "a": 3, "e": "Higher atomic number means higher priority, e.g. Br > Cl > C > H."}, {"q": "In CHCl=CHBr, which groups are compared to decide E or Z?", "o": ["Cl on one carbon and Br on the other", "The two hydrogens", "Cl and H on the same carbon only", "Neither; it can't be E/Z"], "a": 0, "e": "On each carbon, the higher priority group (Cl over H, Br over H) is compared."}, {"q": "What is a skeletal formula?", "o": ["A formula showing all atoms and bonds", "A formula with carbon chains shown as lines and only functional groups drawn", "The simplest ratio of atoms", "The molecular formula"], "a": 1, "e": "In skeletal formulae, each line end and corner is a carbon, and hydrogens on carbon aren't shown."}, {"q": "What is the name of CH₃CH₂CHO?", "o": ["Propanone", "Propan-1-ol", "Propanal", "Propanoic acid"], "a": 2, "e": "Three carbons with an aldehyde group (-CHO): propanal."}, {"q": "What is a functional group?", "o": ["A chain of carbon atoms", "Any hydrogen atom", "A type of isomer", "A group of atoms responsible for the characteristic reactions of a compound"], "a": 3, "e": "E.g. -OH in alcohols and C=C in alkenes."}, {"q": "What is the correct name for CH₃CHBrCH(CH₃)CH₃?", "o": ["2-bromo-3-methylbutane", "3-methyl-2-bromobutane", "2-methyl-3-bromobutane", "3-bromo-2-methylbutane"], "a": 0, "e": "Number to give the lowest locants (2 and 3), and list substituents alphabetically: bromo before methyl."}, {"q": "What is heterolytic fission?", "o": ["Each atom takes one electron", "One atom takes both electrons from the bond, forming ions", "Two radicals combine", "A double bond forms"], "a": 1, "e": "Heterolytic fission produces a cation and an anion."}]}, {"id": "3.3.2", "order": 12, "year": 1, "section": "3.3", "spec": "3.3.2", "title": "Alkanes", "desc": "Fractional distillation of crude oil, cracking, combustion and pollutants, catalytic converters, and free-radical chlorination of alkanes.", "practicals": [], "summary": [{"h": "Fractional distillation", "p": ["Alkanes are **saturated hydrocarbons**, mostly from **crude oil**.", "Crude oil is separated by **fractional distillation**: it is heated and vaporised, and the vapour rises up a column that is **hotter at the bottom and cooler at the top**.", "Fractions **condense** at different heights according to their **boiling points**. Longer chains have higher boiling points (stronger van der Waals forces)."]}, {"h": "Cracking", "p": ["**Cracking** breaks **C–C bonds** in long alkanes to make shorter, **more useful** alkanes and **alkenes**.", "**Thermal cracking**: **high temperature** (up to 1000 °C) and **high pressure** (up to 7000 kPa). Produces a **high proportion of alkenes**.", "**Catalytic cracking**: **zeolite** catalyst, **slight pressure** and **high temperature** (about 450 °C). Produces **motor fuels** and **aromatic hydrocarbons**.", "Cracking is economically important because demand for shorter fractions (petrol) is higher than supply."]}, {"h": "Combustion and pollution", "p": ["**Complete combustion**: alkane + oxygen → CO₂ + H₂O.", "**Incomplete combustion** (limited oxygen): produces **carbon monoxide** (toxic: binds to haemoglobin) and **carbon** (soot, particulates).", "**Sulfur** impurities burn to **SO₂**, causing **acid rain**. SO₂ is removed from power station flue gases using **CaO or CaCO₃**.", "In engines, high temperatures make **nitrogen oxides** (NOₓ) from N₂ and O₂. **Unburned hydrocarbons** also form. NOₓ and hydrocarbons can form photochemical smog.", "**Catalytic converters** (platinum, palladium, rhodium) remove CO, NOₓ and unburned hydrocarbons, e.g. `2CO + 2NO → 2CO₂ + N₂`.", "CO₂, methane and water vapour are **greenhouse gases**, contributing to global warming."]}, {"h": "Chlorination: free-radical substitution", "p": ["Alkanes react with chlorine in **UV light**.", "**Initiation**: `Cl₂ → 2Cl•` (UV light causes homolytic fission).", "**Propagation**: `Cl• + CH₄ → HCl + •CH₃`, then `•CH₃ + Cl₂ → CH₃Cl + Cl•` (the radical is regenerated).", "**Termination**: two radicals combine, e.g. `Cl• + •CH₃ → CH₃Cl`, `•CH₃ + •CH₃ → C₂H₆`.", "Further substitution gives a **mixture** of products, e.g. CH₂Cl₂, CHCl₃, CCl₄."]}], "pitfalls": ["Fractional distillation is a **physical** process. Cracking is a **chemical** reaction.", "In propagation, the radical used up must be **regenerated** in the next step.", "Thermal: high temperature, high pressure, alkenes. Catalytic: zeolite, slight pressure, aromatics and motor fuels."], "questions": [{"q": "What is an alkane?", "o": ["An unsaturated hydrocarbon", "A saturated hydrocarbon containing only single bonds", "A compound with an OH group", "A hydrocarbon with a C=C bond"], "a": 1, "e": "Alkanes contain only C–C and C–H single bonds."}, {"q": "How does fractional distillation separate crude oil?", "o": ["By differences in boiling point: fractions condense at different heights in a column with a temperature gradient", "By chemical reactions", "By cracking", "By filtration"], "a": 0, "e": "The column is hotter at the bottom. Substances condense where the temperature falls below their boiling point."}, {"q": "Why do longer-chain alkanes have higher boiling points?", "o": ["Stronger covalent bonds", "Hydrogen bonding", "More electrons and greater surface contact, so stronger van der Waals forces", "They are ionic"], "a": 2, "e": "Larger molecules have stronger induced dipole–dipole forces between them."}, {"q": "What is cracking?", "o": ["Separating crude oil by boiling point", "Burning alkanes", "Adding hydrogen to alkenes", "Breaking C–C bonds in long alkanes to form shorter alkanes and alkenes"], "a": 3, "e": "Cracking converts less useful long chains into more useful shorter molecules."}, {"q": "What conditions are used for thermal cracking?", "o": ["High temperature and high pressure", "Zeolite catalyst and slight pressure", "UV light", "Low temperature and low pressure"], "a": 0, "e": "Thermal cracking uses up to 1000 °C and up to 7000 kPa, and gives a high proportion of alkenes."}, {"q": "What catalyst is used in catalytic cracking?", "o": ["Platinum", "Zeolite", "Nickel", "Iron"], "a": 1, "e": "Zeolite catalysts are used at around 450 °C and slight pressure."}, {"q": "What are the main products of catalytic cracking?", "o": ["Mostly alkenes", "Only methane", "Motor fuels and aromatic hydrocarbons", "Alcohols"], "a": 2, "e": "Catalytic cracking produces branched alkanes, cycloalkanes and aromatics, useful in motor fuels."}, {"q": "Why is cracking economically important?", "o": ["It produces crude oil", "It removes sulfur", "It makes fuels cheaper to burn", "Demand for shorter chains (e.g. petrol) and alkenes is greater than supply from crude oil"], "a": 3, "e": "Crude oil contains more long-chain fractions than needed. Cracking converts them to more valuable products."}, {"q": "Balance: C₁₀H₂₂ → C₈H₁₈ + ?", "o": ["C₂H₄", "C₂H₆", "CH₄", "C₃H₆"], "a": 0, "e": "Carbon: 10 − 8 = 2. Hydrogen: 22 − 18 = 4. So C₂H₄ (ethene)."}, {"q": "Why is carbon monoxide toxic?", "o": ["It causes acid rain", "It binds to haemoglobin, reducing oxygen transport", "It is a greenhouse gas", "It forms smog only"], "a": 1, "e": "CO binds strongly to haemoglobin, so less oxygen reaches body tissues."}, {"q": "What causes nitrogen oxides to form in car engines?", "o": ["Sulfur impurities in fuel", "Incomplete combustion", "High temperatures cause N₂ and O₂ from the air to react", "Cracking"], "a": 2, "e": "The heat of combustion provides enough energy for nitrogen and oxygen to react."}, {"q": "How are SO₂ emissions reduced at power stations?", "o": ["Catalytic converters", "Cracking", "Burning more fuel", "Reacting SO₂ with calcium oxide or calcium carbonate"], "a": 3, "e": "SO₂ is acidic, so it reacts with basic calcium compounds (flue gas desulfurisation)."}, {"q": "What reaction occurs in a catalytic converter?", "o": ["2CO + 2NO → 2CO₂ + N₂", "CO + H₂O → CO₂ + H₂", "N₂ + O₂ → 2NO", "C + O₂ → CO₂"], "a": 0, "e": "Toxic CO and NO react on the catalyst surface to form CO₂ and N₂."}, {"q": "What is needed for chlorine to react with methane?", "o": ["A catalyst", "UV light", "High pressure", "An acid"], "a": 1, "e": "UV light provides energy for homolytic fission of Cl₂ into chlorine radicals."}, {"q": "What is the initiation step in the chlorination of methane?", "o": ["Cl• + CH₄ → HCl + •CH₃", "•CH₃ + Cl₂ → CH₃Cl + Cl•", "Cl₂ → 2Cl•", "Cl• + Cl• → Cl₂"], "a": 2, "e": "UV light splits Cl₂ homolytically into two chlorine radicals."}, {"q": "Which step is a propagation step?", "o": ["Cl₂ → 2Cl•", "Cl• + •CH₃ → CH₃Cl", "•CH₃ + •CH₃ → C₂H₆", "Cl• + CH₄ → HCl + •CH₃"], "a": 3, "e": "In propagation, a radical reacts with a molecule to form a new radical."}, {"q": "What happens in a termination step?", "o": ["Two radicals combine to form a molecule", "A radical is formed", "UV light breaks a bond", "A radical reacts with a molecule"], "a": 0, "e": "Termination removes radicals, ending the chain reaction."}, {"q": "Why does chlorination of methane give a mixture of products?", "o": ["Methane is impure", "Further substitution occurs: chlorine radicals react with CH₃Cl to give CH₂Cl₂ and so on", "Chlorine is a catalyst", "It is reversible"], "a": 1, "e": "Products like CH₃Cl still have C–H bonds that can be substituted by more chlorine."}, {"q": "What is the product of complete combustion of propane?", "o": ["CO and H₂O", "C and H₂O", "CO₂ and H₂O", "CO₂ and H₂"], "a": 2, "e": "C₃H₈ + 5O₂ → 3CO₂ + 4H₂O."}, {"q": "Which gases from burning fuels contribute to global warming?", "o": ["SO₂ and NO", "CO and particulates", "N₂ and O₂", "CO₂, methane and water vapour"], "a": 3, "e": "Greenhouse gases absorb infrared radiation, trapping heat."}, {"q": "Why are particulates from incomplete combustion harmful?", "o": ["They can cause respiratory problems and global dimming", "They destroy ozone", "They cause acid rain", "They are greenhouse gases"], "a": 0, "e": "Fine carbon particles can be breathed in and damage the lungs."}, {"q": "Is fractional distillation a physical or chemical process?", "o": ["Chemical", "Physical: no bonds within molecules are broken", "Both", "Neither"], "a": 1, "e": "It separates substances by boiling point without changing them chemically."}]}, {"id": "3.3.3", "order": 13, "year": 1, "section": "3.3", "spec": "3.3.3", "title": "Halogenoalkanes", "desc": "The polar C–X bond, nucleophilic substitution with OH⁻, CN⁻ and NH₃, elimination to alkenes, and ozone depletion by CFCs.", "practicals": [], "summary": [{"h": "Structure and reactivity", "p": ["Halogenoalkanes contain a **polar C–X bond**: halogens are more electronegative, so carbon is **δ+**.", "The δ+ carbon is attacked by **nucleophiles**.", "Reactivity depends on **bond enthalpy**, not polarity. The **C–I** bond is **weakest**, so iodoalkanes react **fastest**. C–F is strongest and least reactive."]}, {"h": "Nucleophilic substitution", "p": ["A nucleophile's **lone pair** attacks the δ+ carbon. The C–X bond breaks **heterolytically**, and X⁻ leaves.", "**OH⁻**: aqueous NaOH or KOH, heated under reflux. Forms an **alcohol**.", "**CN⁻**: KCN in **ethanol**, heated under reflux. Forms a **nitrile**, adding **one carbon** to the chain.", "**NH₃**: **excess**, concentrated, in **ethanol**, heated in a sealed tube. Forms a **primary amine**. Excess NH₃ reduces further substitution."]}, {"h": "Elimination", "p": ["**OH⁻** acts as a **base**, removing an H⁺ from a carbon next to the C–X carbon. A **C=C** forms and X⁻ leaves.", "Conditions: **KOH in ethanol** (no water), heated.", "Substitution and elimination **compete**. Aqueous, warm conditions favour substitution (OH⁻ as a nucleophile). Ethanolic, hot conditions favour elimination (OH⁻ as a base).", "Elimination from unsymmetrical halogenoalkanes can give a mixture of alkenes, including E/Z isomers."]}, {"h": "Ozone depletion", "p": ["**Ozone** (O₃) in the upper atmosphere absorbs harmful **UV radiation**, which can cause skin cancer.", "**CFCs** (chlorofluorocarbons) break down in UV light to form **chlorine radicals**: `CF₂Cl₂ → •CF₂Cl + Cl•`.", "Cl• **catalyses** ozone decomposition: `Cl• + O₃ → ClO• + O₂`, then `ClO• + O₃ → 2O₂ + Cl•`. Overall: `2O₃ → 3O₂`.", "One chlorine radical can destroy thousands of ozone molecules because it is regenerated.", "Scientists' research provided evidence for legislation (e.g. the Montreal Protocol) banning CFCs. **HFCs** (no chlorine) are used as alternatives."]}], "pitfalls": ["Reactivity of halogenoalkanes follows **bond enthalpy** (C–I fastest), not bond polarity.", "Same reagent, different conditions: **aqueous** → substitution, **ethanolic** → elimination.", "Curly arrows: from the nucleophile's **lone pair** to the δ+ carbon, and from the **C–X bond** to X."], "questions": [{"q": "Why is the carbon in a C–Br bond δ+?", "o": ["Carbon is more electronegative than bromine", "Bromine is more electronegative, pulling electron density away from carbon", "Carbon has a lone pair", "The bond is ionic"], "a": 1, "e": "The halogen attracts the bonding electrons more strongly, so the carbon becomes partially positive."}, {"q": "Which halogenoalkane reacts fastest in nucleophilic substitution?", "o": ["Iodoalkane", "Chloroalkane", "Fluoroalkane", "Bromoalkane"], "a": 0, "e": "The C–I bond has the lowest bond enthalpy, so it breaks most easily."}, {"q": "What is the reactivity of halogenoalkanes mainly determined by?", "o": ["Bond polarity", "Molecular mass", "Carbon–halogen bond enthalpy", "Boiling point"], "a": 2, "e": "Although C–F is the most polar, it is the strongest bond, so fluoroalkanes are least reactive."}, {"q": "What is formed when bromoethane is heated under reflux with aqueous NaOH?", "o": ["Ethene", "Ethylamine", "Propanenitrile", "Ethanol"], "a": 3, "e": "OH⁻ substitutes for Br⁻, forming ethanol."}, {"q": "What is formed when bromoethane reacts with KCN in ethanol?", "o": ["Propanenitrile", "Ethanenitrile", "Ethanol", "Ethene"], "a": 0, "e": "CN⁻ substitutes for Br⁻, adding a carbon: CH₃CH₂CN, propanenitrile."}, {"q": "Why is excess ammonia used to make a primary amine from a halogenoalkane?", "o": ["To speed up the reaction", "To reduce further substitution forming secondary and tertiary amines", "To act as a solvent", "To favour elimination"], "a": 1, "e": "The primary amine is itself a nucleophile. Excess NH₃ makes it more likely the halogenoalkane reacts with NH₃ instead."}, {"q": "In nucleophilic substitution, where does the first curly arrow start?", "o": ["From the halogen", "From the C–H bond", "From the nucleophile's lone pair to the δ+ carbon", "From the carbon to the nucleophile"], "a": 2, "e": "The nucleophile donates its lone pair to the δ+ carbon."}, {"q": "What conditions favour elimination over substitution?", "o": ["Aqueous NaOH, warm", "Excess ammonia", "KCN in ethanol", "KOH in ethanol, heated"], "a": 3, "e": "Ethanolic, hot conditions favour OH⁻ acting as a base, forming an alkene."}, {"q": "In elimination, what role does OH⁻ play?", "o": ["Base: it removes an H⁺", "Nucleophile", "Electrophile", "Catalyst"], "a": 0, "e": "OH⁻ takes an H⁺ from a carbon adjacent to the C–X carbon, forming water and a C=C."}, {"q": "What is formed when 2-bromopropane is heated with ethanolic KOH?", "o": ["Propan-2-ol", "Propene", "Propanenitrile", "Propylamine"], "a": 1, "e": "Elimination removes HBr, forming propene."}, {"q": "Why can elimination from 2-bromobutane give more than one product?", "o": ["It is a primary halogenoalkane", "Substitution happens too", "H can be removed from either neighbouring carbon, giving but-1-ene or but-2-ene (with E/Z isomers)", "Bromine is removed twice"], "a": 2, "e": "Different H atoms can be removed, giving positional isomers, and but-2-ene shows E/Z isomerism."}, {"q": "Why is ozone in the upper atmosphere important?", "o": ["It causes global warming", "It produces oxygen", "It removes CO₂", "It absorbs harmful UV radiation"], "a": 3, "e": "Ozone absorbs UV that would otherwise increase the risk of skin cancer."}, {"q": "How do CFCs produce chlorine radicals?", "o": ["UV light breaks the C–Cl bond homolytically", "They react with water", "They are ionic", "Heat breaks the C–F bond"], "a": 0, "e": "C–Cl is weaker than C–F, so UV light breaks it, forming Cl•."}, {"q": "Which equations show chlorine radicals destroying ozone?", "o": ["Cl₂ → 2Cl•", "Cl• + O₃ → ClO• + O₂, then ClO• + O₃ → 2O₂ + Cl•", "O₃ → O₂ + O", "2Cl• → Cl₂"], "a": 1, "e": "Cl• is regenerated in the second step, so it acts as a catalyst."}, {"q": "Why can one chlorine radical destroy thousands of ozone molecules?", "o": ["It is very large", "It is not destroyed", "It is regenerated in the propagation cycle, acting as a catalyst", "It makes more chlorine"], "a": 2, "e": "The chain continues until two radicals happen to meet and terminate."}, {"q": "What is the overall equation for ozone depletion?", "o": ["O₃ → O₂ + O", "Cl• + O₃ → ClO• + O₂", "O₂ + O → O₃", "2O₃ → 3O₂"], "a": 3, "e": "Adding the two propagation steps and cancelling gives 2O₃ → 3O₂."}, {"q": "Why are HFCs used instead of CFCs?", "o": ["They contain no chlorine, so they don't form chlorine radicals that destroy ozone", "They are cheaper", "They are better greenhouse gases", "They absorb UV"], "a": 0, "e": "C–F bonds are too strong to break in UV, and there's no C–Cl bond."}, {"q": "What type of solvent is used for the reaction of a halogenoalkane with KCN?", "o": ["Water", "Ethanol", "Hexane", "Acid"], "a": 1, "e": "KCN in ethanol, heated under reflux."}, {"q": "What type of reaction is halogenoalkane + OH⁻(aq) → alcohol + X⁻?", "o": ["Electrophilic addition", "Elimination", "Nucleophilic substitution", "Free-radical substitution"], "a": 2, "e": "A nucleophile replaces the halogen atom."}, {"q": "What is the purpose of the Montreal Protocol?", "o": ["To reduce CO₂ emissions", "To ban plastics", "To limit nitrogen oxides", "To phase out ozone-depleting substances such as CFCs"], "a": 3, "e": "Scientific evidence on ozone depletion led to international agreement to ban CFCs."}, {"q": "What forms when 1-bromopropane reacts with excess ethanolic ammonia?", "o": ["Propylamine (propan-1-amine)", "Propene", "Propanol", "Propanenitrile"], "a": 0, "e": "NH₃ acts as a nucleophile, substituting Br and forming a primary amine."}, {"q": "Which product forms when the conditions are aqueous NaOH and warm?", "o": ["An alkene", "An alcohol", "A nitrile", "An amine"], "a": 1, "e": "In water, OH⁻ mainly acts as a nucleophile, so substitution gives an alcohol."}]}, {"id": "3.3.4", "order": 14, "year": 1, "section": "3.3", "spec": "3.3.4", "title": "Alkenes", "desc": "The C=C bond, electrophilic addition with HBr, Br₂ and H₂SO₄, carbocation stability and major products, the bromine water test, and addition polymers.", "practicals": [6], "summary": [{"h": "Structure", "p": ["Alkenes are **unsaturated** hydrocarbons with at least one **C=C** double bond. General formula **CₙH₂ₙ**.", "The C=C is a region of **high electron density**, so it is attacked by **electrophiles**."]}, {"h": "Electrophilic addition", "p": ["**HBr**: the δ+ H is attracted to the C=C. Electrons from the C=C form a bond to H, and the H–Br bond breaks heterolytically. A **carbocation** forms, and Br⁻ attacks it. Product: a **bromoalkane**.", "**Br₂**: as Br₂ approaches the C=C, the electron density induces a **dipole** in Br₂. The δ+ Br is attacked. Product: a **dibromoalkane**.", "**Test for alkenes**: shake with **bromine water**. **Orange → colourless**.", "**Concentrated H₂SO₄**: adds across the C=C to form an **alkyl hydrogensulfate**, which reacts with water to give an **alcohol**."]}, {"h": "Carbocation stability and major products", "p": ["With unsymmetrical alkenes such as propene, two products are possible.", "**Tertiary** carbocations are **more stable** than secondary, which are more stable than **primary**. Alkyl groups **push electrons** towards the positive carbon (positive inductive effect).", "The **major product** comes from the **more stable carbocation**. E.g. propene + HBr gives mainly **2-bromopropane**."]}, {"h": "Addition polymers", "p": ["Alkenes form **addition polymers**: the C=C bonds open and monomers join into long saturated chains.", "Draw the **repeating unit** with brackets and extension bonds, e.g. poly(chloroethene) from chloroethene.", "Polymers are **unreactive** because the backbone is **saturated** (C–C and C–H bonds) and non-polar.", "**PVC**: rigid, used for window frames and pipes. Adding **plasticisers** pushes chains apart, making it **flexible** (e.g. cable insulation).", "Addition polymers are hard to dispose of because they **don't biodegrade**."]}], "pitfalls": ["In the HBr mechanism, the first curly arrow starts at the **C=C** and goes to the **H**. A second arrow goes from H–Br to Br.", "The **major product** comes from the more stable carbocation: tertiary > secondary > primary.", "Draw the repeat unit with the **extension bonds** going through the brackets, and no C=C."], "questions": [{"q": "What is the general formula of the alkenes?", "o": ["CₙH₂ₙ₊₂", "CₙH₂ₙ", "CₙH₂ₙ₋₂", "CₙH₂ₙ₊₁"], "a": 1, "e": "Alkenes with one C=C have the general formula CₙH₂ₙ."}, {"q": "Why does the C=C bond attract electrophiles?", "o": ["It is a region of high electron density", "It is positively charged", "It has no electrons", "It is very weak"], "a": 0, "e": "The double bond has four electrons, making it electron-rich."}, {"q": "What is seen when bromine water is shaken with an alkene?", "o": ["Colourless to orange", "No change", "Orange to colourless", "A white precipitate"], "a": 2, "e": "Bromine adds across the C=C, so the orange colour disappears."}, {"q": "What is the product when ethene reacts with HBr?", "o": ["1,2-dibromoethane", "Ethanol", "Ethane", "Bromoethane"], "a": 3, "e": "HBr adds across the C=C: CH₂=CH₂ + HBr → CH₃CH₂Br."}, {"q": "What is the product when ethene reacts with Br₂?", "o": ["1,2-dibromoethane", "Bromoethane", "Bromoethene", "Ethanol"], "a": 0, "e": "A bromine atom adds to each carbon of the double bond."}, {"q": "How does Br₂, a non-polar molecule, act as an electrophile?", "o": ["It is already polar", "The C=C's electron density induces a dipole in the Br₂ molecule", "It forms Br⁻ ions first", "It reacts with water first"], "a": 1, "e": "As Br₂ approaches the C=C, electrons in Br₂ are repelled, making the nearer Br δ+."}, {"q": "What is the intermediate in electrophilic addition of HBr?", "o": ["A free radical", "An anion", "A carbocation", "An alkyne"], "a": 2, "e": "After H adds to one carbon, the other carbon is left with a positive charge."}, {"q": "Which carbocation is most stable?", "o": ["Primary", "Secondary", "Methyl", "Tertiary"], "a": 3, "e": "More alkyl groups push electron density towards the positive carbon, stabilising it."}, {"q": "What is the major product when propene reacts with HBr?", "o": ["2-bromopropane", "1-bromopropane", "1,2-dibromopropane", "Propan-2-ol"], "a": 0, "e": "The secondary carbocation is more stable than the primary, so 2-bromopropane is the major product."}, {"q": "Why do alkyl groups stabilise carbocations?", "o": ["They withdraw electrons", "They push electron density towards the positive carbon (positive inductive effect)", "They form hydrogen bonds", "They are charged"], "a": 1, "e": "Electron-releasing alkyl groups spread the positive charge."}, {"q": "How are alcohols made from alkenes using sulfuric acid?", "o": ["Directly with dilute acid only", "With a nickel catalyst", "The alkene reacts with concentrated H₂SO₄ to form an alkyl hydrogensulfate, which is then hydrolysed with water", "With bromine water"], "a": 2, "e": "H₂SO₄ adds across the C=C, then water replaces the hydrogensulfate group with OH."}, {"q": "What is an addition polymer?", "o": ["A polymer formed with loss of water", "A polymer of amino acids", "A polymer with C=C bonds", "A long saturated chain formed when alkene monomers join by opening their C=C bonds"], "a": 3, "e": "No atoms are lost: all the monomer atoms are in the polymer."}, {"q": "Which monomer makes poly(chloroethene)?", "o": ["CH₂=CHCl", "CH₃CH₂Cl", "CHCl=CHCl", "CH₂=CH₂"], "a": 0, "e": "Chloroethene, CH₂=CHCl, is the monomer for PVC."}, {"q": "Why are addition polymers unreactive?", "o": ["They contain C=C bonds", "Their backbone is saturated and non-polar", "They are ionic", "They contain oxygen"], "a": 1, "e": "Strong, non-polar C–C and C–H bonds aren't easily attacked."}, {"q": "What is the effect of adding a plasticiser to PVC?", "o": ["It makes it more rigid", "It makes it biodegradable", "It pushes polymer chains apart, making it flexible", "It removes chlorine"], "a": 2, "e": "Plasticiser molecules get between chains, weakening the forces between them so they can slide."}, {"q": "Why is the disposal of addition polymers a problem?", "o": ["They are toxic", "They dissolve in water", "They react with air", "They are not biodegradable"], "a": 3, "e": "Their unreactive saturated chains aren't broken down by microorganisms."}, {"q": "In the HBr mechanism, where does the first curly arrow start?", "o": ["From the C=C double bond to the H of HBr", "From Br to H", "From H to the C=C", "From Br⁻ to the carbocation"], "a": 0, "e": "Electrons from the C=C form a new bond with the δ+ H."}, {"q": "Why does the bromine water test work for alkenes but not alkanes?", "o": ["Alkanes are ionic", "Alkenes have a C=C that bromine can add across", "Alkanes are more reactive", "Bromine reacts only with water"], "a": 1, "e": "Alkanes are saturated and don't undergo addition with bromine in the dark."}, {"q": "But-1-ene reacts with HBr. Which is the major product?", "o": ["1-bromobutane", "1,2-dibromobutane", "2-bromobutane", "Butan-2-ol"], "a": 2, "e": "A secondary carbocation forms on carbon 2, which is more stable, so 2-bromobutane is major."}, {"q": "What type of reaction is alkene + HBr?", "o": ["Nucleophilic substitution", "Elimination", "Free-radical substitution", "Electrophilic addition"], "a": 3, "e": "An electrophile adds to the C=C, forming a single product."}, {"q": "What is the repeating unit of poly(propene)?", "o": ["–CH₂–CH(CH₃)–", "–CH₂–CH₂–", "–CH=CH(CH₃)–", "–CH₂–CH₂–CH₂–"], "a": 0, "e": "Propene is CH₂=CHCH₃. The double bond opens, leaving CH₃ as a side group."}, {"q": "Rigid PVC without plasticiser is used for:", "o": ["Cable insulation", "Window frames and drainpipes", "Food wrap", "Clothing"], "a": 1, "e": "Unplasticised PVC is rigid. Flexible plasticised PVC is used for cable insulation."}]}, {"id": "3.3.5", "order": 15, "year": 1, "section": "3.3", "spec": "3.3.5", "title": "Alcohols", "desc": "Making ethanol by fermentation and hydration, carbon neutrality, classifying alcohols, oxidation with acidified dichromate, and dehydration to alkenes.", "practicals": [5], "summary": [{"h": "Making ethanol", "p": ["**Fermentation**: `C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂`. Uses **yeast**, **anaerobic** conditions, about **35 °C**. Slow, gives impure ethanol (needs distilling), but uses **renewable** sugar.", "**Hydration of ethene**: `C₂H₄ + H₂O ⇌ C₂H₅OH`. **Steam**, **phosphoric acid catalyst**, about **300 °C** and **60–70 atm**. Fast, pure product, continuous, but uses **non-renewable** crude oil.", "This is acid-catalysed electrophilic addition."]}, {"h": "Bioethanol and carbon neutrality", "p": ["**Bioethanol** from fermentation is described as **carbon-neutral**: the CO₂ taken in by plants in photosynthesis equals the CO₂ released by fermentation and combustion.", "Equations: photosynthesis 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂; fermentation releases 2CO₂; combustion of 2 ethanol releases 4CO₂. Net 6CO₂ in, 6CO₂ out.", "In practice it isn't fully carbon-neutral, because of energy used for **farming, transport, fertilisers and distillation**."]}, {"h": "Classification", "p": ["**Primary**: the carbon bearing OH is attached to **one** other carbon (e.g. ethanol).", "**Secondary**: attached to **two** other carbons (e.g. propan-2-ol).", "**Tertiary**: attached to **three** other carbons (e.g. 2-methylpropan-2-ol)."]}, {"h": "Oxidation with acidified potassium dichromate(VI)", "p": ["Oxidising agent: **K₂Cr₂O₇** acidified with **H₂SO₄**. Colour change **orange → green** (Cr₂O₇²⁻ → Cr³⁺). Use [O] in equations.", "**Primary** alcohols → **aldehydes** (distil off immediately) → **carboxylic acids** (heat under **reflux** with excess oxidising agent).", "**Secondary** alcohols → **ketones** (heat under reflux).", "**Tertiary** alcohols are **not oxidised**: no colour change.", "Tell aldehydes from ketones with **Tollens'** (silver mirror) or **Fehling's** (brick-red precipitate). Only aldehydes react."]}, {"h": "Dehydration (elimination)", "p": ["Alcohols can be dehydrated to **alkenes** by heating with a **concentrated acid catalyst** (H₂SO₄ or H₃PO₄).", "This gives a way to make alkenes, and so polymers, **without using crude oil**.", "Mechanism: the OH is **protonated**, water leaves forming a **carbocation**, then H⁺ is lost from a neighbouring carbon to form C=C."]}], "pitfalls": ["**Distil** to stop at the aldehyde. **Reflux** to go all the way to the carboxylic acid.", "Tertiary alcohols **don't** oxidise. That's how to distinguish them.", "Carbon-neutral claims: always mention the energy used in **farming, transport and processing**."], "questions": [{"q": "What are the conditions for fermentation?", "o": ["Phosphoric acid, 300 °C", "Yeast, anaerobic, about 35 °C", "UV light", "Nickel catalyst, high pressure"], "a": 1, "e": "Yeast enzymes convert sugar to ethanol and CO₂ without oxygen at a warm temperature."}, {"q": "What is the equation for fermentation of glucose?", "o": ["C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂", "C₂H₄ + H₂O → C₂H₅OH", "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O", "C₂H₅OH → C₂H₄ + H₂O"], "a": 0, "e": "One glucose gives two ethanol and two carbon dioxide."}, {"q": "What are the conditions for making ethanol by hydration of ethene?", "o": ["Yeast at 35 °C", "UV light", "Steam, phosphoric acid catalyst, about 300 °C and 60–70 atm", "Aqueous NaOH"], "a": 2, "e": "Ethene and steam react on a phosphoric acid catalyst."}, {"q": "Which is an advantage of hydration over fermentation?", "o": ["Uses renewable raw materials", "Lower temperature", "Batch process", "Faster rate and a purer product"], "a": 3, "e": "Hydration is fast, continuous and gives pure ethanol, but uses non-renewable crude oil."}, {"q": "Why is bioethanol described as carbon-neutral?", "o": ["The CO₂ absorbed by plants in photosynthesis equals the CO₂ released in fermentation and combustion", "It releases no CO₂", "It is made from crude oil", "It absorbs CO₂ when burned"], "a": 0, "e": "The carbon released was recently taken from the atmosphere by the growing crop."}, {"q": "Why is bioethanol not truly carbon-neutral in practice?", "o": ["It releases CO", "Energy from fossil fuels is used for farming, transport, fertilisers and distillation", "Plants don't absorb CO₂", "Fermentation produces no CO₂"], "a": 1, "e": "These processes release extra CO₂ not balanced by photosynthesis."}, {"q": "What type of alcohol is propan-2-ol?", "o": ["Primary", "Tertiary", "Secondary", "Quaternary"], "a": 2, "e": "The carbon with the OH is bonded to two other carbons."}, {"q": "What type of alcohol is 2-methylpropan-2-ol?", "o": ["Primary", "Secondary", "Phenol", "Tertiary"], "a": 3, "e": "The C–OH carbon is attached to three other carbons."}, {"q": "What colour change shows acidified potassium dichromate has oxidised an alcohol?", "o": ["Orange to green", "Green to orange", "Purple to colourless", "Blue to brick-red"], "a": 0, "e": "Cr₂O₇²⁻ (orange) is reduced to Cr³⁺ (green)."}, {"q": "How is an aldehyde obtained from a primary alcohol?", "o": ["Heat under reflux with excess oxidising agent", "Warm with acidified dichromate and distil off the aldehyde as it forms", "Add yeast", "Heat with concentrated acid"], "a": 1, "e": "Distilling immediately removes the aldehyde before it can be oxidised further."}, {"q": "How is a carboxylic acid obtained from a primary alcohol?", "o": ["Distil immediately", "Add bromine water", "Heat under reflux with excess acidified dichromate", "Heat with ethanolic KOH"], "a": 2, "e": "Reflux keeps the aldehyde in the mixture so it is fully oxidised to the acid."}, {"q": "What is the product when a secondary alcohol is oxidised?", "o": ["Aldehyde", "Carboxylic acid", "Alkene", "Ketone"], "a": 3, "e": "Secondary alcohols are oxidised to ketones, which aren't oxidised further."}, {"q": "What happens when a tertiary alcohol is warmed with acidified dichromate?", "o": ["No reaction: the solution stays orange", "It turns green", "It forms a ketone", "It forms an aldehyde"], "a": 0, "e": "Tertiary alcohols have no H on the C–OH carbon, so they aren't oxidised."}, {"q": "What is seen when an aldehyde is warmed with Tollens' reagent?", "o": ["Brick-red precipitate", "A silver mirror", "Orange to green", "No change"], "a": 1, "e": "Ag⁺ is reduced to silver metal, coating the tube."}, {"q": "What is seen when an aldehyde is warmed with Fehling's solution?", "o": ["Silver mirror", "Orange to green", "Blue to brick-red precipitate", "Effervescence"], "a": 2, "e": "Cu²⁺ (blue) is reduced to Cu₂O, a brick-red precipitate."}, {"q": "What are the conditions for dehydrating an alcohol to an alkene?", "o": ["Aqueous NaOH", "Yeast", "UV light", "Heat with a concentrated acid catalyst such as H₂SO₄ or H₃PO₄"], "a": 3, "e": "The acid catalyses elimination of water."}, {"q": "Why is dehydration of alcohols useful?", "o": ["It produces alkenes, and so polymers, without using crude oil", "It makes ethanol", "It removes CO₂", "It makes ketones"], "a": 0, "e": "Ethanol from fermentation can be dehydrated to ethene, a renewable route to polymers."}, {"q": "What does [O] represent in organic oxidation equations?", "o": ["An oxygen molecule", "Oxygen from the oxidising agent", "Ozone", "Water"], "a": 1, "e": "[O] is shorthand for the oxygen supplied by the oxidising agent."}, {"q": "Write the equation for oxidising ethanol to ethanal.", "o": ["C₂H₅OH + 2[O] → CH₃COOH + H₂O", "C₂H₅OH → C₂H₄ + H₂O", "C₂H₅OH + [O] → CH₃CHO + H₂O", "C₂H₅OH + O₂ → CO₂ + H₂O"], "a": 2, "e": "Ethanol loses two H atoms, which combine with [O] to form water."}, {"q": "What is the product of oxidising propan-1-ol under reflux with excess oxidising agent?", "o": ["Propanal", "Propanone", "Propene", "Propanoic acid"], "a": 3, "e": "Primary alcohol → aldehyde → carboxylic acid under reflux."}, {"q": "Why is reflux used for long reactions with volatile organic liquids?", "o": ["Vapour condenses and returns to the flask, so reactants and products aren't lost", "It removes the product", "It cools the reaction", "It speeds up the reaction"], "a": 0, "e": "The vertical condenser returns vapour, allowing prolonged heating."}, {"q": "What is the first step in the mechanism for acid-catalysed dehydration of an alcohol?", "o": ["Loss of water", "Protonation of the OH group by the acid", "Formation of a C=C", "Attack by OH⁻"], "a": 1, "e": "The OH is protonated, turning it into a good leaving group (water)."}]}, {"id": "3.3.6", "order": 16, "year": 1, "section": "3.3", "spec": "3.3.6", "title": "Organic analysis", "desc": "Test-tube tests for functional groups, high-resolution mass spectrometry, and infrared spectroscopy, including the fingerprint region and greenhouse gases.", "practicals": [6], "summary": [{"h": "Identifying functional groups", "p": ["**Alkene**: bromine water, **orange → colourless**.", "**Primary/secondary alcohol**: acidified K₂Cr₂O₇, **orange → green**.", "**Aldehyde**: Tollens' reagent gives a **silver mirror**; Fehling's solution gives a **brick-red precipitate**.", "**Carboxylic acid**: add NaHCO₃ or Na₂CO₃, **effervescence** (CO₂ turns limewater milky)."]}, {"h": "High-resolution mass spectrometry", "p": ["Measures m/z to **several decimal places**, so it can tell apart molecules with the **same integer Mr** but **different molecular formulae**.", "Precise atomic masses: ¹H = 1.0078, ¹²C = 12.0000, ¹⁴N = 14.0031, ¹⁶O = 15.9949.", "E.g. C₃H₈ (44.0626) and CO₂ (43.9898) both have Mr ≈ 44."]}, {"h": "Infrared spectroscopy", "p": ["Bonds **absorb IR radiation** at specific wavenumbers (cm⁻¹), causing them to **vibrate** more.", "Key absorptions: **O–H (alcohols)** 3230–3550, broad. **O–H (acids)** 2500–3000, very broad. **C=O** 1680–1750, sharp. **C–H** 2850–3300. **N–H** 3300–3500.", "The **fingerprint region** (below **1500 cm⁻¹**) is unique to each molecule. Compare with a database to identify a compound or detect impurities."]}, {"h": "IR and global warming", "p": ["**CO₂, methane and water vapour** absorb IR radiation emitted from the Earth's surface. This is why they are **greenhouse gases**.", "Increasing greenhouse gas concentrations contribute to **global warming**."]}], "pitfalls": ["Use the **data sheet** values for IR. Don't memorise every range, but know O–H and C=O.", "Broad O–H at 2500–3000 plus C=O at 1680–1750 means **carboxylic acid**.", "High-resolution MS uses **precise** atomic masses, not whole numbers."], "questions": [{"q": "Which test distinguishes an aldehyde from a ketone?", "o": ["Bromine water", "Tollens' reagent: only the aldehyde gives a silver mirror", "Sodium carbonate", "Litmus paper"], "a": 1, "e": "Aldehydes are oxidised by Tollens' reagent; ketones aren't."}, {"q": "Which test shows a carboxylic acid is present?", "o": ["Add sodium hydrogencarbonate: effervescence of CO₂", "Bromine water decolourises", "Silver mirror", "Orange to green with dichromate"], "a": 0, "e": "Acids react with carbonates and hydrogencarbonates to release CO₂."}, {"q": "What does high-resolution mass spectrometry allow chemists to do?", "o": ["Find the number of isomers", "Measure bond lengths", "Distinguish between molecules with the same integer Mr but different molecular formulae", "Identify functional groups directly"], "a": 2, "e": "Precise masses to several decimal places differ for different formulae."}, {"q": "C₃H₈ and CO₂ both have Mr ≈ 44. A peak is at 43.9898. Which is it? (C = 12.0000, H = 1.0078, O = 15.9949)", "o": ["C₃H₈", "Neither", "Both", "CO₂"], "a": 3, "e": "CO₂ = 12.0000 + 2(15.9949) = 43.9898. C₃H₈ = 44.0626."}, {"q": "What happens when a molecule absorbs infrared radiation?", "o": ["Its bonds vibrate more", "It ionises", "It breaks into fragments", "Its electrons are excited to higher levels"], "a": 0, "e": "IR energy matches the vibrational energy of bonds."}, {"q": "Which absorption range is characteristic of C=O?", "o": ["3230–3550 cm⁻¹", "1680–1750 cm⁻¹", "2500–3000 cm⁻¹", "1000–1300 cm⁻¹"], "a": 1, "e": "A strong, sharp peak at 1680–1750 cm⁻¹ shows a carbonyl group."}, {"q": "A spectrum shows a broad peak at 3230–3550 cm⁻¹ and no C=O. What type of compound is it likely to be?", "o": ["Ketone", "Carboxylic acid", "Alcohol", "Alkane"], "a": 2, "e": "A broad O–H at 3230–3550 cm⁻¹ without C=O suggests an alcohol."}, {"q": "A spectrum shows a very broad peak at 2500–3000 cm⁻¹ and a sharp peak at 1710 cm⁻¹. What is the compound?", "o": ["Alcohol", "Aldehyde", "Alkene", "Carboxylic acid"], "a": 3, "e": "Broad O–H (acid) at 2500–3000 plus C=O at 1710 shows a carboxylic acid."}, {"q": "What is the fingerprint region?", "o": ["The region below 1500 cm⁻¹, unique to each molecule", "The region above 3000 cm⁻¹", "The molecular ion peak", "The region for O–H bonds"], "a": 0, "e": "The complex pattern below 1500 cm⁻¹ can be matched with a database to identify a compound."}, {"q": "How can the fingerprint region be used?", "o": ["To count carbon atoms", "To identify a compound by comparing with known spectra, or detect impurities", "To find Mr", "To measure bond enthalpy"], "a": 1, "e": "Extra peaks compared with a pure reference show impurities."}, {"q": "Why are CO₂, methane and water vapour greenhouse gases?", "o": ["They absorb UV radiation", "They destroy ozone", "Their bonds absorb infrared radiation emitted by the Earth", "They reflect sunlight"], "a": 2, "e": "Absorbing outgoing IR traps heat in the atmosphere."}, {"q": "How can IR show that a primary alcohol has been oxidised to a carboxylic acid?", "o": ["The O–H peak disappears completely", "A C–H peak appears", "No change", "A C=O peak appears at 1680–1750 cm⁻¹ and the O–H peak becomes very broad at 2500–3000"], "a": 3, "e": "The acid has both C=O and a broader, lower-wavenumber O–H."}, {"q": "How could IR show an alcohol has been oxidised to a ketone?", "o": ["The O–H peak disappears and a C=O peak appears", "A broad O–H appears", "A C=C peak appears", "No change"], "a": 0, "e": "The ketone has C=O but no O–H."}, {"q": "Which test distinguishes an alkene from an alkane?", "o": ["Tollens' reagent", "Bromine water", "Sodium carbonate", "Acidified dichromate"], "a": 1, "e": "Alkenes decolourise bromine water. Alkanes don't."}, {"q": "Which test distinguishes propan-2-ol from 2-methylpropan-2-ol?", "o": ["Bromine water", "Sodium hydrogencarbonate", "Warm with acidified potassium dichromate: propan-2-ol turns it green", "Tollens' reagent"], "a": 2, "e": "Secondary alcohols are oxidised; tertiary alcohols aren't."}, {"q": "What unit is used for wavenumber in IR spectroscopy?", "o": ["nm", "Hz", "m/z", "cm⁻¹"], "a": 3, "e": "Wavenumber is measured in cm⁻¹ (reciprocal centimetres)."}, {"q": "What is the precise mass of ¹²C used in high-resolution mass spectrometry?", "o": ["12.0000", "12.0107", "12.0078", "11.9949"], "a": 0, "e": "Carbon-12 is defined as exactly 12."}, {"q": "Which bond causes absorption at 3300–3500 cm⁻¹ in amines?", "o": ["O–H", "N–H", "C=O", "C–N"], "a": 1, "e": "N–H stretching appears in this region."}, {"q": "Why is the fingerprint region hard to interpret bond-by-bond?", "o": ["It has no peaks", "It only shows C–H", "It contains many overlapping absorptions from the whole molecule", "It is above 3000 cm⁻¹"], "a": 2, "e": "It's used as a whole pattern to match against known spectra."}, {"q": "An unknown liquid turns acidified dichromate green, and gives no silver mirror with Tollens'. What could it be?", "o": ["An aldehyde", "A tertiary alcohol", "A carboxylic acid", "A primary or secondary alcohol"], "a": 3, "e": "Oxidised by dichromate means primary or secondary alcohol (or aldehyde). No silver mirror rules out an aldehyde."}, {"q": "Two compounds have Mr = 28: C₂H₄ and N₂. How can they be distinguished?", "o": ["High-resolution mass spectrometry", "Boiling point only", "Low-resolution mass spectrometry", "Litmus paper"], "a": 0, "e": "C₂H₄ = 28.0312 and N₂ = 28.0062, which high-resolution MS can separate."}, {"q": "Which statement about IR spectra is correct?", "o": ["Peaks show the number of hydrogen atoms", "Different bonds absorb at characteristic wavenumbers", "IR spectra show Mr", "Only carbonyls absorb IR"], "a": 1, "e": "Each type of bond absorbs in a characteristic range, so functional groups can be identified."}]}, {"id": "3.1.8", "order": 17, "year": 2, "section": "3.1", "spec": "3.1.8", "title": "Thermodynamics", "desc": "Born–Haber cycles, lattice enthalpy, enthalpies of solution and hydration, perfect ionic model, entropy and Gibbs free-energy change.", "practicals": [], "summary": [{"h": "Key enthalpy definitions", "p": ["**Enthalpy of atomisation**: forming 1 mole of **gaseous atoms** from the element in its standard state. Always endothermic.", "**First electron affinity**: 1 mole of gaseous atoms each **gains one electron** to form 1 mole of gaseous 1− ions. Usually **exothermic**. Second electron affinity is **endothermic** (adding an electron to a negative ion).", "**Lattice enthalpy of formation**: forming 1 mole of solid ionic compound **from its gaseous ions**. Exothermic. (Lattice enthalpy of **dissociation** is the reverse and endothermic.)", "**Enthalpy of hydration**: gaseous ions dissolving in water to form 1 mole of aqueous ions. Exothermic.", "**Enthalpy of solution**: 1 mole of an ionic solid dissolving in water."]}, {"h": "Born–Haber cycles", "p": ["A Hess's law cycle linking the **enthalpy of formation** of an ionic compound to the steps of forming its gaseous ions and the **lattice enthalpy**.", "Steps for NaCl: atomise Na, ionise Na, atomise Cl (½ bond enthalpy), electron affinity of Cl, then lattice formation.", "`ΔfH = ΔatH(metal) + IE + ΔatH(non-metal) + EA + ΔLH(formation)`"]}, {"h": "Perfect ionic model", "p": ["Theoretical lattice enthalpies assume a **perfect ionic model**: spherical ions with no covalent character.", "If the experimental (Born–Haber) value is **more exothermic** than the theoretical value, the compound has some **covalent character**. This happens when a small, highly charged cation **polarises** a large anion.", "Lattice enthalpy is **more exothermic** for **smaller** ions with **higher charge**."]}, {"h": "Dissolving", "p": ["`ΔsolH = ΔLH(dissociation) + Σ ΔhydH`", "Hydration enthalpy is more exothermic for small, highly charged ions (stronger attraction to water's δ+ or δ− ends)."]}, {"h": "Entropy and free energy", "p": ["**Entropy (S)**: a measure of **disorder**, or the number of ways particles and energy can be arranged. Units **J K⁻¹ mol⁻¹**.", "Entropy increases from solid → liquid → gas, and when more moles of gas form.", "`ΔS = ΣS(products) − ΣS(reactants)`", "**Gibbs free energy**: `ΔG = ΔH − TΔS`. Convert ΔS to **kJ** (divide by 1000) to match ΔH.", "A reaction is **feasible** when **ΔG ≤ 0**.", "The temperature at which a reaction becomes feasible: set ΔG = 0, so `T = ΔH ÷ ΔS`.", "A feasible reaction may still not happen if its **activation energy** is too high (kinetic barrier)."]}], "pitfalls": ["Units: ΔH in kJ mol⁻¹, ΔS in J K⁻¹ mol⁻¹. **Divide ΔS by 1000** before using ΔG = ΔH − TΔS.", "State whether you mean lattice enthalpy of **formation** (exothermic) or **dissociation** (endothermic).", "For Cl₂, atomisation is **½ × bond enthalpy**, because it's per mole of Cl atoms.", "Second electron affinity is **endothermic**, because of repulsion between the electron and a negative ion."], "questions": [{"q": "What is the enthalpy of atomisation of chlorine?", "o": ["The energy to form 1 mole of Cl₂ molecules", "The enthalpy change to form 1 mole of gaseous Cl atoms from Cl₂ in its standard state", "The energy to ionise chlorine", "The bond enthalpy of Cl₂"], "a": 1, "e": "It is half the Cl–Cl bond enthalpy, because one Cl₂ gives two Cl atoms."}, {"q": "Why is the second electron affinity of oxygen endothermic?", "o": ["Energy is needed to overcome repulsion between the O⁻ ion and the incoming electron", "Oxygen is a metal", "Oxygen has too many protons", "Electrons are released"], "a": 0, "e": "Adding an electron to a negative ion requires energy to overcome repulsion."}, {"q": "What is lattice enthalpy of formation?", "o": ["Forming 1 mole of solid from its elements", "Breaking 1 mole of solid into gaseous ions", "Forming 1 mole of solid ionic compound from its gaseous ions", "Dissolving 1 mole of solid in water"], "a": 2, "e": "Lattice formation is exothermic as strong ionic bonds form."}, {"q": "Which change makes lattice enthalpy more exothermic?", "o": ["Larger ions with smaller charge", "Larger ions only", "Lower charge only", "Smaller ions with higher charge"], "a": 3, "e": "Smaller ions get closer, and higher charges attract more strongly."}, {"q": "Experimental lattice enthalpy is more exothermic than the perfect ionic model predicts. What does this show?", "o": ["The compound has some covalent character", "The compound is purely ionic", "The data are wrong", "The ions are large"], "a": 0, "e": "Polarisation of the anion by the cation adds extra (covalent) bonding."}, {"q": "Which cation polarises anions most strongly?", "o": ["Large, low-charge cation", "Small, highly charged cation", "Negative ion", "Large, highly charged cation"], "a": 1, "e": "High charge density distorts the anion's electron cloud."}, {"q": "How is enthalpy of solution calculated?", "o": ["ΔsolH = lattice formation + hydration", "ΔsolH = hydration − lattice dissociation", "ΔsolH = lattice dissociation + sum of hydration enthalpies", "ΔsolH = atomisation + ionisation"], "a": 2, "e": "Breaking the lattice (endothermic) then hydrating the ions (exothermic)."}, {"q": "Lattice dissociation of NaCl = +787; hydration Na⁺ = −406; hydration Cl⁻ = −378 kJ mol⁻¹. What is ΔsolH?", "o": ["−3 kJ mol⁻¹", "+1571 kJ mol⁻¹", "−784 kJ mol⁻¹", "+3 kJ mol⁻¹"], "a": 3, "e": "787 + (−406) + (−378) = +3 kJ mol⁻¹."}, {"q": "What is entropy?", "o": ["A measure of disorder, or the number of ways particles and energy can be arranged", "Heat energy", "Activation energy", "Bond strength"], "a": 0, "e": "Higher disorder means higher entropy."}, {"q": "Which change has the largest increase in entropy?", "o": ["Water freezing", "A solid turning into a gas", "Gas condensing", "Liquid turning into solid"], "a": 1, "e": "Gases are much more disordered than solids."}, {"q": "What are the units of
